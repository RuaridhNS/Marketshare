        <input type="radio" name="keep-${esc(g.key)}" value="${b.id}" ${b===g.boats[0]?'checked':''}>
        <span><strong>${esc(b.boat_name||'—')}</strong> · ${esc(b.sail_no||'—')} · type: <strong>${esc(b.boat_type||'unknown')}</strong> · ${b.entries.length} entries · owner: ${esc(b.owner_name||'—')}</span>
      </label>`).join('');
    return `
    <div class="card">
      <h2 style="margin-bottom:4px;">${g.boats.map(b=>esc(b.boat_name||b.sail_no)).join(' / ')}</h2>
      <p class="muted" style="font-size:13px;margin-top:0;">${esc(g.reason)}</p>
      <p style="font-size:13px;margin:10px 0 4px;">Pick which record to keep — the other(s) will be merged into it and removed, with all race history moved over:</p>
      ${boatOptions}
      <div class="btn-row">
        <button class="btn" type="button" data-merge-group="${esc(g.key)}">Merge into selected</button>
        <button class="btn secondary" type="button" data-dismiss-group="${esc(g.key)}">Not a duplicate — dismiss</button>
      </div>
    </div>`;
  }).join('');

  return `
    <h1>Possible duplicate boats</h1>
    <p class="subtitle">${groups.length} candidate group(s), found by matching identical boat names or sail numbers that
      differ only by a trailing IRC endorsement letter (e.g. GBR9091R vs GBR9091). Always a human call — dismiss
      anything that isn't really a duplicate.</p>
    ${groupHtml || `<div class="card muted">No candidates found right now.</div>`}
  `;
}

function attachDuplicatesHandlers() {
  document.querySelectorAll('[data-merge-group]').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.mergeGroup;
      const radios = document.querySelectorAll(`input[name="keep-${CSS.escape(key)}"]`);
      const checked = Array.from(radios).find(r => r.checked);
      if (!checked) return;
      const keepId = parseInt(checked.value);
      radios.forEach(r => { const id = parseInt(r.value); if (id !== keepId) addPendingMerge(keepId, id, 'From Duplicates page: ' + key); });
      navigate();
    });
  });
  document.querySelectorAll('[data-dismiss-group]').forEach(btn => {
    btn.addEventListener('click', () => { dismissDuplicateGroup(btn.dataset.dismissGroup); navigate(); });
  });
}

// ---------- page: regattas list ----------
// Series sits above regatta: the Royal Southern Summer Series is four month
// regattas, Warsash runs a Series and a Championship, and so on. It is derived
// from the regatta name rather than stored, so it needs no migration and no
// second place to keep in sync.
function seriesOf(r) {
  // Top level of the tree is the CLUB, so these name the organiser rather
  // than the event it runs. Cowes Week and the IRC/ORC Championships are
  // deliberately left as-is: the first is an event brand run by Cowes
  // Combined Clubs, the others are championship series with no single
  // host club.
  const n = r.name || '';
  // One club, one branch. Splitting the four Summer Series regattas away
  // from the club's other sixteen events put the same organiser in two
  // places, and left a bucket literally called "other".
  if (/^Royal Southern/i.test(n)) return 'Royal Southern Yacht Club';
  if (/royal solent|taittinger/i.test(n)) return 'Royal Solent Yacht Club';
  if (/^Warsash/i.test(n)) return 'Warsash Sailing Club';
  if (/^Hamble/i.test(n)) return 'Hamble River Sailing Club';
  if (/^Cowes Week$/i.test(n)) return 'Cowes Week';
  if (/^Round the Island/i.test(n)) return 'Island Sailing Club';
  if (/^ORC /i.test(n)) return 'ORC Championships';
  // RORC and "RORC Offshore" were two buckets for a single organiser, which
  // split the same club's events across two places in the tree.
  // The Vice Admiral's Cup is a RORC event. Two of its three regattas are
  // even named "RORC Vice Admiral's Cup"; the third is written
  // "Vice admirals cup/ RTYC", which is why it needs naming here rather
  // than matching on the RORC prefix.
  if (/fastnet|myth of malham|cervantes|north sea race|roschier|caribbean|transatlantic|vice admiral|RTYC|^RORC|^NSR|easter challenge|inshore series/i.test(n)) return 'RORC';
  if (/^JOG/i.test(n)) return 'JOG';
  // Anything still unmatched falls back to its recorded organiser. Every
  // regatta that reached this point with category RORC came from
  // rorc.org or the RORC season points - the 2020 Summer, Autumn and
  // Race the Wight series among them - so they belong with the club,
  // not in a generic bucket labelled "Club".
  if (r.category === 'RORC') return 'RORC';
  return r.category === 'Club' ? 'Other clubs' : (r.category || 'Other');
}

// Per-regatta rollup used by the list: seasons covered and distinct boats,
// counted from boat-level entries where we have them and falling back to the
// aggregate class-count total where we don't.
function regattaSummary(r) {
  const evs = DATA.events.filter(e => e.regatta_id === r.id);
  const years = evs.map(e => e.season_year).filter(y => y != null).sort((a,b)=>a-b);
  const evIds = new Set(evs.map(e => e.id));
  const boatsByYear = {};
  DATA.boats.forEach(b => b.entries.forEach(e => {
    const ra = racesById[e.race_id];
    if (!ra || !evIds.has(ra.event_id)) return;
    const y = eventsById[ra.event_id].season_year;
    (boatsByYear[y] ||= new Set()).add(b.id);
  }));
  const trends = DATA.entry_trends.filter(t => t.regatta_id === r.id);
  // Two DIFFERENT measures, kept apart deliberately. "Boats" is the count of
  // distinct boats we hold named results for; "reported" is the entry total the
  // organiser published, carried in the class counts. They disagree in both
  // directions - our Fastnet 2023 results cover 306 of a reported 358, while in
  // 2021 we hold 310 against a reported 264 because that year's spreadsheet row
  // counted a narrower set of classes. Collapsing them into one line, taking
  // whichever existed, is what made the plotted line contradict the totals
  // printed further down the same page.
  const pts = years.map(y => {
    const rep = (trends.find(t => t.season_year === y) || {}).total || null;
    const own = boatsByYear[y] ? boatsByYear[y].size : null;
    return { x: y, y: own != null ? own : (rep || 0), real: own != null,
             reported: rep, boatLevel: own };
  });
  const recent = pts.filter(p => p.x >= ACTIVE_CUTOFF_YEAR);
  return {
    years, pts,
    nSeasons: years.length,
    nRecent: recent.length,
    latest: pts.length ? pts[pts.length-1] : null,
    hasBoatLevel: Object.keys(boatsByYear).length > 0,
    recentTotal: recent.reduce((a,p)=>a+p.y, 0),
  };
}

function renderRegattasList() {
  // Club > Year > Event > Class > boat. The class layer lives on the entries -
  // it used to be baked into regatta NAMES, which made one event look like
  // eighteen - so the tree is built straight from the entry list.
  const idx = {};           // club -> year -> regattaId -> class -> [entry refs]
  const meta = {};          // regattaId -> regatta
  DATA.boats.forEach(b => b.entries.forEach(e => {
    const ra = racesById[e.race_id]; if (!ra) return;
    const ev = eventsById[ra.event_id]; if (!ev) return;
    const rg = regattasById[ev.regatta_id]; if (!rg) return;
    meta[rg.id] = rg;
    const club = seriesOf(rg), yr = ev.season_year || 0;
    const cls = normClass(e.class) || 'Class unrecorded';
    const byYear = (idx[club] = idx[club] || {});
    const byReg = (byYear[yr] = byYear[yr] || {});
    const byCls = (byReg[rg.id] = byReg[rg.id] || {});
    (byCls[cls] = byCls[cls] || []).push({ b: b.id, p: e.position });
  }));

  // Events with no boat-level results still need a place, or the tree silently
  // loses every aggregate-only season.
  DATA.regattas.forEach(rg => {
    const club = seriesOf(rg);
    DATA.events.filter(e => e.regatta_id === rg.id).forEach(ev => {
      const yr = ev.season_year || 0;
      const byYear = (idx[club] = idx[club] || {});
      const byReg = (byYear[yr] = byYear[yr] || {});
      if (!byReg[rg.id]) { byReg[rg.id] = {}; meta[rg.id] = rg; }
    });
  });

  // REPORTED entries, per event. 80 of 385 event-seasons hold only the entry
  // total the organiser published - nobody ever pulled the boat-level results.
  // Showing those as "0 boats" made the whole Island Sailing Club card read as
  // empty when it actually covers 5,270 reported entries. The two measures are
  // kept apart on purpose (see regattaSummary): one is boats we can name, the
  // other is a number we were told.
  // A "Total" row is a total OF the class rows beside it, not another class.
  // Summing everything counted every entry twice: Round the Island 2025 read
  // 532 where the real figure is 266, and 54 event-seasons across 11 regattas
  // were doubled the same way. Where a Total exists it is authoritative;
  // otherwise the classes are added up.
  const reportedByEvent = {}, totalByEvent = {};
  DATA.class_counts.forEach(cc => {
    const lab = String(cc.class_label || '').trim().toLowerCase();
    if (lab === 'total' || lab === 'overall' || lab === 'all') {
      totalByEvent[cc.event_id] = (totalByEvent[cc.event_id] || 0) + (cc.entry_count || 0);
    } else {
      reportedByEvent[cc.event_id] = (reportedByEvent[cc.event_id] || 0) + (cc.entry_count || 0);
    }
  });
  const trendByRegYear = {};
  DATA.entry_trends.forEach(t => { trendByRegYear[t.regatta_id + ':' + t.season_year] = t.total; });
  const reportedFor = ev => totalByEvent[ev.id] || reportedByEvent[ev.id]
    || trendByRegYear[ev.regatta_id + ':' + ev.season_year] || 0;
  // Which seasons of each regatta we hold NAMED boats for, and which we hold
  // only a reported total for. coverageNote() turns that pair into the reason
  // a season is empty, which is the first question anyone asks of a blank
  // branch - and the answer already existed on the Coverage page.
  const boatYearsByReg = {}, aggYearsByReg = {};
  DATA.boats.forEach(b => b.entries.forEach(e => {
    const ra = racesById[e.race_id]; if (!ra) return;
    const ev = eventsById[ra.event_id]; if (!ev) return;
    (boatYearsByReg[ev.regatta_id] = boatYearsByReg[ev.regatta_id] || new Set())
      .add(ev.season_year);
  }));
  DATA.events.forEach(ev => {
    if (reportedFor(ev) > 0) {
      (aggYearsByReg[ev.regatta_id] = aggYearsByReg[ev.regatta_id] || new Set())
        .add(ev.season_year);
    }
  });
  const whyEmpty = (rg, yr, reported) => {
    // coverageNote() answers "what is the state of this REGATTA", which is a
    // different question from "why is THIS SEASON blank". Used raw it produced
    // answers that contradict the branch they sit under - "Scraped weekly" on
    // an empty season, or "Up to date with what the source publishes". So the
    // season-level fact leads, and the source note is added only where it
    // actually explains the gap.
    const boatYears = Array.from(boatYearsByReg[rg.id] || [])
      .filter(Boolean).sort((a, b) => a - b);
    const cov = coverageNote(rg.name, boatYears,
      Array.from(aggYearsByReg[rg.id] || []));
    // don't say "no named boats" twice when the Why line is about to say it
    const head = reported
      ? reported.toLocaleString() + ' entries reported' +
        (boatYears.length ? ', but no named boats for this season.' : '.')
      : 'No results on file for this season.';
    let why;
    if (boatYears.length) {
      const span = boatYears.length === 1 ? String(boatYears[0])
        : boatYears[0] + '\u2013' + boatYears[boatYears.length - 1];
      why = 'We hold named boats for this event in ' + boatYears.length +
            ' other season' + (boatYears.length === 1 ? '' : 's') +
            ' (' + span + '), but not ' + (yr || 'this one') + '. ';
      why += (cov.status === 'blocked' || cov.status === 'todo')
        ? cov.note
        : 'This season was loaded from the entry-count spreadsheet only.';
    } else if (cov.status === 'blocked' || cov.status === 'todo') {
      why = 'No named boats for any season of this event. ' + cov.note;
    } else {
      why = 'No named boats for any season of this event \u2014 only entry counts ' +
            'were ever loaded for it.';
    }
    return '<p class="tree-empty">' + head +
      '<span class="tree-why"><strong>Why:</strong> ' + esc(why) + '</span></p>';
  };
  // Sum over the events actually under a node, so a club total is never double
  // counted across seasons.
  const reportedOver = evs => evs.reduce((a, ev) => a + reportedFor(ev), 0);
  const eventsOf = (regId, yr) => DATA.events.filter(e =>
    e.regatta_id == regId && (e.season_year || 0) == yr);
  // "12 boats" when we have them; "· 48 reported" as a separate, muted figure
  const countMeta = (nBoats, nReported) =>
    '<span>' + nBoats + ' boat' + (nBoats === 1 ? '' : 's') + '</span>' +
    (nReported > nBoats
      ? '<span class="tree-reported" title="Entry total published by the organiser. '
        + 'We hold named results for ' + nBoats + ' of them.">'
        + nReported.toLocaleString() + ' reported</span>'
      : '');

  // Market share at every level of the tree. The same three numbers are asked
  // of a club, a season, an event and a class - the question "how are we doing
  // here" does not change with the depth, only the set of boats it is asked
  // about.
  //
  // The share is of boats whose sailmaker we KNOW, and the unknown count is
  // shown beside it rather than folded in, because those two numbers mean
  // opposite things: one is how we are doing, the other is how much of the
  // fleet we cannot yet see. Coverage is 6% of the fleet, so a share quoted
  // without the unknown count next to it would be worse than no number.
  const shareOf = (ids) => {
    let north = 0, other = 0, unknown = 0;
    ids.forEach(id => {
      const b = boatsById[id];
      if (!b) return;
      const bucket = bucketOf(liveSailmaker(b));
      if (bucket === 'North Sails') north++;
      else if (bucket === 'Unknown' || bucket === 'Partial') unknown++;
      else other++;
    });
    return { north, other, unknown, known: north + other, total: north + other + unknown };
  };
  const shareMeta = (ids) => {
    const s = shareOf(ids);
    if (!s.total) return '';
    if (!s.known) {
      return '<span class="share-wrap" title="No sailmaker known for any of these ' +
        s.total + ' boats."><span class="share-bar">' +
        '<i class="sb-unknown" style="width:100%"></i></span>' +
        '<span class="share-text share-none">no sailmaker known</span></span>';
    }
    const pct = Math.round(100 * s.north / s.known);
    const w = n => (100 * n / s.total).toFixed(1) + '%';
    return '<span class="share-wrap" title="' + s.north + ' North, ' + s.other +
      ' competitor, ' + s.unknown + ' unknown, of ' + s.total + ' boats. The percentage is ' +
      'North\u2019s share of the ' + s.known + ' we know.">' +
      '<span class="share-bar">' +
      '<i class="sb-north" style="width:' + w(s.north) + '"></i>' +
      '<i class="sb-other" style="width:' + w(s.other) + '"></i>' +
      '<i class="sb-unknown" style="width:' + w(s.unknown) + '"></i></span>' +
      '<span class="share-text">' + pct + '% of ' + s.known + ' known' +
      (s.unknown ? '<span class="share-unknown">, ' + s.unknown + ' unknown</span>' : '') +
      '</span></span>';
  };

  // Boat rows are built on demand. Rendering every entry up front is ~54,000
  // rows of HTML, which is what made the old Sales page unusable.
  window.__treeData = {};
  let leafSeq = 0;

  const clubs = Object.keys(idx).sort();
  const cards = clubs.map(club => {
    const years = Object.keys(idx[club]).map(Number).sort((a, b) => b - a);
    const clubBoats = new Set();
    let clubEvents = 0;
    const clubReported = reportedOver(DATA.events.filter(ev => {
      const rg = regattasById[ev.regatta_id];
      return rg && seriesOf(rg) === club;
    }));

    const yearNodes = years.map(yr => {
      const regs = idx[club][yr];
      const regIds = Object.keys(regs).sort((a, b) =>
        (meta[a].name || '').localeCompare(meta[b].name || ''));
      const yearBoats = new Set();

      const evNodes = regIds.map(rid => {
        const rg = meta[rid];
        const classes = Object.keys(regs[rid])
          .map(c => [c, regs[rid][c]])
          .sort((a, b) => compareClasses(a[0], b[0]));
        const evBoats = new Set();
        const clsNodes = classes.map(pair => {
          const cls = pair[0], rows = pair[1];
          const byBoat = {};
          rows.forEach(r => {
            const g = (byBoat[r.b] = byBoat[r.b] || { races: 0, best: null });
            g.races++;
            if (r.p != null && (g.best == null || r.p < g.best)) g.best = r.p;
            evBoats.add(r.b); yearBoats.add(r.b); clubBoats.add(r.b);
          });
          const key = 'leaf' + (leafSeq++);
          window.__treeData[key] = byBoat;
          const n = Object.keys(byBoat).length;
          return '<details class="tree-node tree-class" data-leaf="' + key + '">' +
            '<summary><span class="tree-name">' + esc(cls) + '</span>' +
            '<span class="tree-meta"><span>' + n + ' boat' + (n === 1 ? '' : 's') + '</span>' +
            '<span>' + rows.length + ' entr' + (rows.length === 1 ? 'y' : 'ies') + '</span>' +
            shareMeta(Object.keys(byBoat)) + '</span></summary>' +
            '<div class="tree-kids tree-boats"><p class="tree-empty">Opening&hellip;</p></div></details>';
        }).join('');
        clubEvents++;
        const sm = regattaSummary(rg);
        return '<details class="tree-node regatta-row" data-name="' +
          esc((rg.name + ' ' + club).toLowerCase()) + '" data-recent="' + sm.nRecent +
          '" data-boatlevel="' + (sm.hasBoatLevel ? 1 : 0) +
          '" data-seasonboats="' + evBoats.size +
          '" data-seasonreported="' + reportedOver(eventsOf(rg.id, yr)) + '">' +
          '<summary><span class="tree-name">' + esc(rg.name) + '</span>' +
          '<span class="tree-meta">' + countMeta(evBoats.size, reportedOver(eventsOf(rg.id, yr))) +
          '<span>' + classes.length + ' class' + (classes.length === 1 ? '' : 'es') + '</span>' +
          shareMeta(Array.from(evBoats)) + '</span>' +
          '<a class="tree-open" href="#/regatta/' + rg.id + '?year=' + yr + '">open &rsaquo;</a></summary>' +
          '<div class="tree-kids">' + (clsNodes ||
            whyEmpty(rg, yr, reportedOver(eventsOf(rg.id, yr)))) +
          '</div></details>';
      }).join('');

      return '<details class="tree-node tree-year"><summary>' +
        '<span class="tree-name">' + (yr || 'Season unrecorded') + '</span>' +
        '<span class="tree-meta"><span>' + regIds.length + ' event' + (regIds.length === 1 ? '' : 's') + '</span>' +
        countMeta(yearBoats.size,
          reportedOver(regIds.flatMap(id => eventsOf(id, yr)))) +
        shareMeta(Array.from(yearBoats)) + '</span></summary>' +
        '<div class="tree-kids">' + evNodes + '</div></details>';
    }).join('');

    return '<details class="card regatta-series" data-series="' + esc(club.toLowerCase()) + '">' +
      '<summary class="tree-series"><span>' + esc(club) + '</span>' +
      '<span class="muted" style="font-weight:400;font-size:13px;">' + years.length +
      ' season' + (years.length === 1 ? '' : 's') + ' &middot; ' + clubEvents +
      ' event' + (clubEvents === 1 ? '' : 's') + ' &middot; ' + clubBoats.size + ' boats' +
      (clubReported > clubBoats.size
        ? ' &middot; <span class="tree-reported" style="display:inline;">'
          + clubReported.toLocaleString() + ' reported</span>' : '') +
      '</span>' + shareMeta(Array.from(clubBoats)) + '</summary>' +
      '<div class="tree-body">' + yearNodes + '</div></details>';
  }).join('');

  return `
    <h1>Regattas</h1>
    <p class="subtitle"><span id="regatta-count">${DATA.regattas.length}</span> events across ${clubs.length} clubs and series,
      spanning ${DATA.stats.n_events} event-seasons. Open a club, then a season, an event and a class to reach the boats.</p>
    <div class="search-row">
      <input type="text" id="regatta-search" placeholder="Search event or club&hellip;">
      <select id="regatta-filter">
        <option value="recent">Active in last 5 seasons</option>
        <option value="boatlevel">Has boat-level results</option>
        <option value="gap">Needs boat-level results</option>
        <option value="all">All events</option>
      </select>
    </div>
    ${cards}
  `;
}

// A class node fills its boat list the first time it is opened.
function fillTreeLeaf(det) {
  const key = det.dataset.leaf;
  const box = det.querySelector('.tree-boats');
  if (!key || !box || box.dataset.filled) return;
  box.dataset.filled = '1';
  const byBoat = (window.__treeData || {})[key] || {};
  const rows = Object.keys(byBoat).map(id => ({ b: boatsById[id], g: byBoat[id] }))
    .filter(x => x.b)
    .sort((x, y) => (x.g.best == null) - (y.g.best == null)
                 || (x.g.best - y.g.best)
                 || (x.b.boat_name || '').localeCompare(y.b.boat_name || ''));
  const ord = n => n === 1 ? '1st' : n === 2 ? '2nd' : n === 3 ? '3rd' : n + 'th';
  box.innerHTML = rows.map(r => {
    const b = r.b, g = r.g, sm = liveSailmaker(b);
    return '<a class="tree-leaf" href="#/boat/' + b.id + '">' +
      '<span class="tree-leaf-name">' + esc(b.boat_name || '\u2014') + '</span>' +
      '<span class="tree-leaf-meta">' + esc(b.sail_no || '') +
      (b.boat_type ? ' &middot; ' + esc(b.boat_type) : '') + '</span>' +
      '<span class="tree-leaf-meta">' +
      (g.best != null ? ord(g.best) + ' best' : 'no result') +
      ' &middot; ' + g.races + ' race' + (g.races === 1 ? '' : 's') + '</span>' +
      '<span class="pill" style="' + pillStyle(sm) + '">' + esc(sm || 'Unknown') + '</span></a>';
  }).join('') || '<p class="tree-empty">No boats.</p>';
}


// ---------- page: analysis ----------
// One filter state, every panel below it. Splitting these into separate views
// meant answering "how do J/109s attend?" and "who wins in J/109s?" in two
// places with two filter settings that could silently disagree.
const ANALYSIS = { sailmaker: '', type: '', club: '', from: 0, to: 0, minRaces: 5 };

function analysisRows() {
  // one flat row per entry, already joined to season / club / class
  const out = [];
  DATA.boats.forEach(b => b.entries.forEach(e => {
    const ra = racesById[e.race_id]; if (!ra) return;
    const ev = eventsById[ra.event_id]; if (!ev) return;
    const rg = regattasById[ev.regatta_id]; if (!rg) return;
    out.push({ b, e, year: ev.season_year || 0, club: seriesOf(rg), regatta: rg,
               cls: normClass(e.class) || '', pos: e.position });
  }));
  return out;
}

function analysisFiltered(rows) {
  const f = ANALYSIS;
  return rows.filter(r =>
    (!f.sailmaker || bucketOf(liveSailmaker(r.b)) === f.sailmaker) &&
    (!f.type || r.b.boat_type === f.type) &&
    (!f.club || r.club === f.club) &&
    (!f.from || r.year >= f.from) &&
    (!f.to || r.year <= f.to));
}

function panel(title, note, body, extra) {
  return `<div class="card" style="padding:0;overflow:auto;">
    <h2 style="padding:16px 20px 0;">${title}</h2>
    <p class="muted" style="padding:0 20px;font-size:12px;margin:4px 0 0;">${note}</p>
    ${extra || ''}
    ${body}
  </div>`;
}

function renderAnalysis() {
  const all = analysisRows();
  const years = [...new Set(all.map(r => r.year).filter(Boolean))].sort((a, b) => b - a);
  if (!ANALYSIS.from) { ANALYSIS.from = years[Math.min(4, years.length - 1)] || 0; }
  if (!ANALYSIS.to) { ANALYSIS.to = years[0] || 0; }
  const rows = analysisFiltered(all);

  const makers = BUCKET_ORDER.filter(m => m !== 'Unknown');
  const types = [...new Set(DATA.boats.map(b => b.boat_type).filter(Boolean))].sort();
  const clubs = [...new Set(all.map(r => r.club))].sort();
  const opt = (list, cur) => list.map(v =>
    `<option value="${esc(v)}" ${cur === v ? 'selected' : ''}>${esc(v)}</option>`).join('');

  // ---- per-boat rollup ----
  const byBoat = {};
  rows.forEach(r => {
    const g = (byBoat[r.b.id] ||= { b: r.b, n: 0, byYear: {}, places: [], podium: 0, scored: 0 });
    g.n++;
    g.byYear[r.year] = (g.byYear[r.year] || 0) + 1;
    if (r.pos != null) { g.scored++; g.places.push(r.pos); if (r.pos <= 3) g.podium++; }
  });
  const boats = Object.values(byBoat);
  const nBoats = boats.length;

  // 1. attendance
  const attend = boats.slice().sort((a, b) => b.n - a.n).slice(0, 15);
  const maxN = attend.length ? attend[0].n : 1;
  const attendBody = `<table><thead><tr><th>Boat</th><th>Type</th><th>Sailmaker</th>
      <th class="num">Races</th><th>Share of the period</th></tr></thead><tbody>` +
    attend.map(g => `<tr class="clickable" data-route="#/boat/${g.b.id}">
      <td><strong>${esc(g.b.boat_name || '—')}</strong> <span class="muted">${esc(g.b.sail_no || '')}</span></td>
      <td>${esc(g.b.boat_type || '')}</td>
      <td><span class="pill" style="${pillStyle(liveSailmaker(g.b))}">${esc(liveSailmaker(g.b) || 'Unknown')}</span></td>
      <td class="num">${g.n}</td>
      <td><span style="display:inline-block;height:8px;border-radius:2px;background:var(--series-north);width:${Math.max(3, g.n / maxN * 100)}%"></span></td>
    </tr>`).join('') + '</tbody></table>';

  // 2. most successful - podium RATE, not raw wins, or the biggest fleets win
  //    by arithmetic. A minimum race count stops a single lucky result topping it.
  const succ = boats.filter(g => g.scored >= ANALYSIS.minRaces)
    .map(g => ({ ...g, rate: g.podium / g.scored,
                 avg: g.places.reduce((a, c) => a + c, 0) / g.places.length }))
    .sort((a, b) => b.rate - a.rate || a.avg - b.avg).slice(0, 15);
  const succBody = succ.length ? `<table><thead><tr><th>Boat</th><th>Type</th><th>Sailmaker</th>
      <th class="num">Scored</th><th class="num">Podiums</th><th class="num">Podium rate</th><th class="num">Avg finish</th></tr></thead><tbody>` +
    succ.map(g => `<tr class="clickable" data-route="#/boat/${g.b.id}">
      <td><strong>${esc(g.b.boat_name || '—')}</strong> <span class="muted">${esc(g.b.sail_no || '')}</span></td>
      <td>${esc(g.b.boat_type || '')}</td>
      <td><span class="pill" style="${pillStyle(liveSailmaker(g.b))}">${esc(liveSailmaker(g.b) || 'Unknown')}</span></td>
      <td class="num">${g.scored}</td><td class="num">${g.podium}</td>
      <td class="num">${Math.round(g.rate * 100)}%</td>
      <td class="num">${g.avg.toFixed(1)}</td></tr>`).join('') + '</tbody></table>'
    : '<p class="muted" style="padding:0 20px 16px;">No boat has enough scored races in this selection.</p>';

  // 3. movers - first half of the window against the second
  const mid = Math.floor((ANALYSIS.from + ANALYSIS.to) / 2);
  const movers = boats.map(g => {
    let early = 0, late = 0;
    Object.keys(g.byYear).forEach(y => { (+y <= mid ? (early += g.byYear[y]) : (late += g.byYear[y])); });
    return { g, early, late, d: late - early };
  }).filter(m => m.early + m.late >= 4);
  const up = movers.slice().sort((a, b) => b.d - a.d).slice(0, 8);
  const down = movers.slice().sort((a, b) => a.d - b.d).slice(0, 8);
  const moverRow = m => `<tr class="clickable" data-route="#/boat/${m.g.b.id}">
      <td><strong>${esc(m.g.b.boat_name || '—')}</strong></td>
      <td>${esc(m.g.b.boat_type || '')}</td>
      <td class="num">${m.early}</td><td class="num">${m.late}</td>
      <td class="num" style="color:${m.d > 0 ? 'var(--series-quantum)' : 'var(--series-one)'};font-weight:600;">${m.d > 0 ? '+' : ''}${m.d}</td></tr>`;
  const moversBody = `<table><thead><tr><th>Rising</th><th>Type</th>
      <th class="num">≤${mid}</th><th class="num">&gt;${mid}</th><th class="num">Δ</th></tr></thead>
      <tbody>${up.map(moverRow).join('')}</tbody>
      <thead><tr><th>Falling</th><th>Type</th><th class="num">≤${mid}</th><th class="num">&gt;${mid}</th><th class="num">Δ</th></tr></thead>
      <tbody>${down.map(moverRow).join('')}</tbody></table>`;

  // 4. ownership changes - the best moment to sell a full inventory
  const owners = [];
  DATA.boats.forEach(b => {
    const h = (b.owner_history || []).filter(x => x.effective_from);
    if (h.length < 2) return;
    const sorted = h.slice().sort((a, c) => String(a.effective_from).localeCompare(String(c.effective_from)));
    const last = sorted[sorted.length - 1];
    const yr = parseInt(String(last.effective_from).slice(0, 4));
    if (!yr || yr < ANALYSIS.from) return;
    if (ANALYSIS.sailmaker && bucketOf(liveSailmaker(b)) !== ANALYSIS.sailmaker) return;
    if (ANALYSIS.type && b.boat_type !== ANALYSIS.type) return;
    owners.push({ b, yr, from: sorted[sorted.length - 2], to: last });
  });
  owners.sort((a, b) => b.yr - a.yr);
  const ownBody = owners.length ? `<table><thead><tr><th>Boat</th><th>Type</th><th>Previous owner</th><th>Now</th><th class="num">Since</th><th>Sailmaker</th></tr></thead><tbody>` +
    owners.slice(0, 20).map(o => `<tr class="clickable" data-route="#/boat/${o.b.id}">
      <td><strong>${esc(o.b.boat_name || '—')}</strong></td>
      <td>${esc(o.b.boat_type || '')}</td>
      <td class="muted">${esc(o.from.owner_name || '—')}</td>
      <td>${esc(o.to.owner_name || '—')}</td>
      <td class="num">${o.yr}</td>
      <td><span class="pill" style="${pillStyle(liveSailmaker(o.b))}">${esc(liveSailmaker(o.b) || 'Unknown')}</span></td>
    </tr>`).join('') + '</tbody></table>'
    : '<p class="muted" style="padding:0 20px 16px;">No ownership changes recorded in this window.</p>';

  // 5. fleet strength - where we are weak AND the fleet is dense
  const fleets = {};
  boats.forEach(g => {
    const t = g.b.boat_type; if (!t) return;
    const f = (fleets[t] ||= { t, n: 0, known: 0, north: 0 });
    f.n++;
    const sm = liveSailmaker(g.b);
    if (sm && !['Unknown', 'Partial'].includes(bucketOf(sm))) {
      f.known++;
      if (bucketOf(sm) === 'North Sails') f.north++;
    }
  });
  const fleetRows = Object.values(fleets).filter(f => f.n >= 5)
    .sort((a, b) => (b.n - b.known) - (a.n - a.known)).slice(0, 15);
  const fleetBody = `<table><thead><tr><th>Fleet</th><th class="num">Boats</th>
      <th class="num">Sailmaker known</th><th class="num">North</th><th class="num">Unknown</th><th>Where the room is</th></tr></thead><tbody>` +
    fleetRows.map(f => {
      const gap = f.n - f.known;
      return `<tr><td><strong>${esc(f.t)}</strong></td><td class="num">${f.n}</td>
        <td class="num">${f.known}</td><td class="num">${f.north}</td>
        <td class="num" style="font-weight:600;">${gap}</td>
        <td><span style="display:inline-block;height:8px;border-radius:2px;background:var(--series-doyle);width:${Math.round(gap / fleetRows[0].n * 100)}%"></span></td></tr>`;
    }).join('') + '</tbody></table>';

  // 6. event pull - which events are growing
  const evAgg = {};
  rows.forEach(r => {
    const k = r.regatta.name;
    const g = (evAgg[k] ||= { k, byYear: {}, boats: new Set() });
    (g.byYear[r.year] ||= new Set()).add(r.b.id);
    g.boats.add(r.b.id);
  });
  const evRows = Object.values(evAgg).map(g => {
    const ys = Object.keys(g.byYear).map(Number).sort((a, b) => a - b);
    const first = ys.length ? g.byYear[ys[0]].size : 0;
    const last = ys.length ? g.byYear[ys[ys.length - 1]].size : 0;
    return { k: g.k, seasons: ys.length, boats: g.boats.size, first, last, d: last - first };
  }).filter(x => x.seasons >= 2).sort((a, b) => b.d - a.d);
  const evBody = evRows.length ? `<table><thead><tr><th>Event</th><th class="num">Seasons</th>
      <th class="num">Distinct boats</th><th class="num">First season</th><th class="num">Latest</th><th class="num">Δ</th></tr></thead><tbody>` +
    evRows.slice(0, 10).map(x => `<tr><td>${esc(x.k)}</td><td class="num">${x.seasons}</td>
      <td class="num">${x.boats}</td><td class="num">${x.first}</td><td class="num">${x.last}</td>
      <td class="num" style="color:${x.d > 0 ? 'var(--series-quantum)' : x.d < 0 ? 'var(--series-one)' : 'inherit'};font-weight:600;">${x.d > 0 ? '+' : ''}${x.d}</td></tr>`).join('')
    + '</tbody></table>'
    : '<p class="muted" style="padding:0 20px 16px;">Not enough seasons in this selection.</p>';

  // 7. people - crew who appear on the most boats. The owner is often not the
  //    person who specifies the sails.
  const people = {};
  (DATA.crew || []).forEach(c => {
    const g = (people[c.person] ||= { name: c.person, boats: new Set(), races: 0 });
    g.boats.add(c.boat_id); g.races++;
  });
  const topPeople = Object.values(people).sort((a, b) => b.boats.size - a.boats.size || b.races - a.races).slice(0, 12);
  const peopleBody = topPeople.length ? `<table><thead><tr><th>Person</th><th class="num">Boats</th><th class="num">Race entries</th></tr></thead><tbody>` +
    topPeople.map(p => `<tr><td>${esc(p.name)}</td><td class="num">${p.boats.size}</td><td class="num">${p.races}</td></tr>`).join('')
    + '</tbody></table>'
    : `<p class="muted" style="padding:0 20px 16px;">Crew names are captured for JOG and the RORC races collected so far. Wider coverage needs the remaining RORC per-race results.</p>`;

  // sample-size warning wherever a sailmaker slice is in play
  // Coverage has to be measured against the selection WITHOUT the sailmaker
  // filter. Measuring inside it always reads "9 of 9", which looks like full
  // coverage when it is the opposite - it is only the boats we happen to know.
  const sansMaker = { ...ANALYSIS, sailmaker: '' };
  const poolIds = new Set(all.filter(r =>
    (!sansMaker.type || r.b.boat_type === sansMaker.type) &&
    (!sansMaker.club || r.club === sansMaker.club) &&
    (!sansMaker.from || r.year >= sansMaker.from) &&
    (!sansMaker.to || r.year <= sansMaker.to)).map(r => r.b.id));
  const pool = [...poolIds].map(id => boatsById[id]).filter(Boolean);
  const poolKnown = pool.filter(b => { const sm = liveSailmaker(b); return sm && !['Unknown', 'Partial'].includes(bucketOf(sm)); }).length;
  const warn = ANALYSIS.sailmaker
    ? `<div class="callout-warn">Showing <strong>${nBoats}</strong> ${esc(ANALYSIS.sailmaker)} boats. But a sailmaker is
       known for only <strong>${poolKnown} of ${pool.length}</strong> boats in this selection
       (${Math.round(poolKnown / Math.max(pool.length, 1) * 100)}%), and the ones we know are disproportionately the ones
       we already sell to. Read this as a view of known boats, not of the fleet.</div>` : '';

  return `
    <h1>Analysis</h1>
    <p class="subtitle">${rows.length.toLocaleString()} entries across ${nBoats.toLocaleString()} boats,
      ${ANALYSIS.from}–${ANALYSIS.to}. Every panel below responds to these filters.</p>
    <div class="card analysis-filters">
      <label>Sailmaker<select id="an-sm"><option value="">All</option>${opt(makers, ANALYSIS.sailmaker)}</select></label>
      <label>Boat type<select id="an-type"><option value="">All</option>${opt(types, ANALYSIS.type)}</select></label>
      <label>Club<select id="an-club"><option value="">All</option>${opt(clubs, ANALYSIS.club)}</select></label>
      <label>From<select id="an-from">${opt(years.map(String), String(ANALYSIS.from))}</select></label>
      <label>To<select id="an-to">${opt(years.map(String), String(ANALYSIS.to))}</select></label>
      <button class="btn secondary" id="an-reset" type="button">Reset</button>
    </div>
    ${warn}
    ${panel('Boat attendance', 'Most active boats in the selection. Activity is the buying signal - a boat that sails is a boat that wears sails out.', attendBody)}
    ${panel('Most successful boats', `Ranked on podium rate, not raw wins - raw wins just find the biggest fleets. Minimum ${ANALYSIS.minRaces} scored races. 58% of entries carry a finishing position, so this covers the races where results were recorded.`, succBody)}
    ${panel('Movers', 'Change in race count between the halves of the window. A boat falling away has been sold or laid up; one climbing is campaigning, and campaigns buy sails.', moversBody)}
    ${panel('Recent ownership changes', 'A new owner is the best moment to sell a full inventory. Derived from the names boats raced under, so it lags a private sale.', ownBody)}
    ${panel('Fleet strength', 'Sorted by how many boats in each fleet we cannot identify. That last column is the size of the conversation nobody has had yet.', fleetBody)}
    ${panel('Event pull', 'Distinct boats at each event, first season against latest. Where the fleet is going is where the rep should be.', evBody)}
    ${panel('People', 'Crew appearing on the most boats. The registered owner is often not the person who specifies the sails.', peopleBody)}
  `;
}

function attachAnalysisHandlers() {
  const bind = (id, key, num) => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('change', () => {
      ANALYSIS[key] = num ? parseInt(el.value) : el.value;
      if (ANALYSIS.from > ANALYSIS.to) ANALYSIS.to = ANALYSIS.from;
      navigate();
    });
  };
  bind('an-sm', 'sailmaker'); bind('an-type', 'type'); bind('an-club', 'club');
  bind('an-from', 'from', true); bind('an-to', 'to', true);
  const r = document.getElementById('an-reset');
  if (r) r.addEventListener('click', () => {
    ANALYSIS.sailmaker = ANALYSIS.type = ANALYSIS.club = '';
    ANALYSIS.from = 0; ANALYSIS.to = 0; navigate();
  });
}


// ---------- page: entry list enrichment ----------
// An event sends the marketing team an entry list: sail number, yacht, owner,
// type, and a Sailmaker column that is mostly blank. Filling it by hand means
// looking up several hundred boats one at a time. This page does the lookup:
// drop the file in, and every boat we already know is filled from the
// database, with the rest flagged so the gap is visible rather than silent.
//
// Deliberately fills BLANKS ONLY. What the team typed is theirs and is never
// overwritten - where the sheet and the database disagree, both are kept and
// the disagreement is reported, because that is a fact worth seeing rather
// than a conflict to resolve silently.
const ENRICH = { rows: null, headers: [], sheets: [], sheet: null, name: '', stats: null };

const XLSX_CDN = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
let _xlsxPromise = null;
function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (_xlsxPromise) return _xlsxPromise;
  // ~880KB, so it is fetched only when a spreadsheet is actually dropped
  _xlsxPromise = new Promise((res, rej) => {
    const t = document.createElement('script');
    t.src = XLSX_CDN;
    t.onload = () => res(window.XLSX);
    t.onerror = () => rej(new Error('could not load the spreadsheet reader'));
    document.head.appendChild(t);
  });
  return _xlsxPromise;
}

const sailKey = v => String(v == null ? '' : v).toUpperCase().replace(/[^A-Z0-9]/g, '');
const nameKey = v => String(v == null ? '' : v).toUpperCase().replace(/[^A-Z0-9]/g, '');

let _bySail = null, _byName = null;
function enrichIndex() {
  if (_bySail) return { bySail: _bySail, byName: _byName };
  _bySail = {}; _byName = {};
  DATA.boats.forEach(b => {
    const k = sailKey(b.sail_no);
    if (k && !_bySail[k]) _bySail[k] = b;
    const n = nameKey(b.boat_name);
    // a name shared by two boats is not an identification, so drop it
    if (n) _byName[n] = (_byName[n] === undefined) ? b : null;
  });
  return { bySail: _bySail, byName: _byName };
}

function lastRaced(b) {
  let y = 0;
  b.entries.forEach(e => {
    const ra = racesById[e.race_id]; if (!ra) return;
    const ev = eventsById[ra.event_id]; if (!ev) return;
    if ((ev.season_year || 0) > y) y = ev.season_year;
  });
  return y || '';
}

// columns we can fill in the sheet's own vocabulary
// `same` decides whether the sheet and the database actually disagree, which
// is not the same question as whether the two strings match.
//
// The entry list writes a boat's TYPE as its rating string - "SUN FAST 3600
// 2.20 Fin6" - where we hold the canonical type, "Sun Fast 3600". Comparing
// them literally reported a disagreement on every single matched boat, which
// is noise that would teach the team to ignore the column. Same for the
// sailmaker: the sheet writes "North", we write "North Sails".
// The entry list writes makers in short form - "North", "Other", "Partial" -
// where our buckets are full names. bucketOf("North") returns "Other", so
// every North boat on the sheet read as a disagreement with our own record of
// it. Match on the maker, not on how it is spelled.
const BUCKET_ALIAS = [
  [/^north/i, 'North Sails'], [/^doyle/i, 'Doyle'], [/^quantum/i, 'Quantum'],
  [/^onesails|^one\b/i, 'One'], [/^sanders/i, 'Sanders'], [/^elvstr/i, 'Elvstrom'],
  [/^partial/i, 'Partial'], [/^unknown/i, 'Unknown'],
];
function makerBucket(v) {
  const t = String(v == null ? '' : v).trim();
  if (!t) return 'Unknown';
  for (let i = 0; i < BUCKET_ALIAS.length; i++) {
    if (BUCKET_ALIAS[i][0].test(t)) return BUCKET_ALIAS[i][1];
  }
  return bucketOf(t);
}

// Fill in the sheet's own vocabulary. Writing "North Sails" into a column that
// already says "North" would leave the team with two spellings of one maker -
// exactly the mess this project exists to clean up - so the spelling already
// in use wins.
function houseSpelling(rows, i) {
  const tally = {};
  if (i < 0) return {};
  rows.forEach(r => {
    const v = String(r[i] == null ? '' : r[i]).trim();
    if (!v) return;
    const b = makerBucket(v);
    (tally[b] = tally[b] || {})[v] = ((tally[b] || {})[v] || 0) + 1;
  });
  const out = {};
  Object.keys(tally).forEach(b => {
    out[b] = Object.keys(tally[b]).sort((x, y) => tally[b][y] - tally[b][x])[0];
  });
  return out;
}

// "ED MOCKRIDGE" and "EDWARD MOCKRIDGE" are one man, and reporting them as a
// disagreement buries the cases where the sheet and the database really do
// name different people. Same surname plus a first name that is a prefix of
// the other counts as the same person. Deliberately conservative: NICK and
// NICHOLAS do not share a prefix, so that pair still gets flagged rather than
// being merged on a guess.
function samePerson(a, b) {
  const norm = v => String(v == null ? '' : v).toUpperCase()
    .replace(/[^A-Z\s]/g, ' ').split(/\s+/).filter(Boolean);
  const x = norm(a), y = norm(b);
  if (!x.length || !y.length) return true;
  if (x.join(' ') === y.join(' ')) return true;
  if (x[x.length - 1] !== y[y.length - 1]) return false;      // different surname
  if (x.length < 2 || y.length < 2) return true;              // surname only
  const f = x[0], g = y[0];
  return f === g || f.indexOf(g) === 0 || g.indexOf(f) === 0;
}

const ENRICH_FIELDS = [
  { re: /sail\s*maker|sailmaker/i,          key: 'sailmaker', get: b => liveSailmaker(b) || '',
    // compare the maker, not the spelling of it
    same: (a, b) => makerBucket(a) === makerBucket(b), house: true },
  { re: /owner/i,                           key: 'owner',     get: b => b.owner_name || '',
    same: (a, b) => samePerson(a, b) },
  { re: /^type$|boat\s*type|yacht\s*type/i, key: 'type',      get: b => b.boat_type || '',
    // the sheet's type carries the rating; ours is the bare type. One
    // containing the other is agreement, not conflict.
    same: (a, b) => { const x = normType(a), y = normType(b);
                      const cx = nameKey(x), cy = nameKey(y);
                      return !cx || !cy || cx === cy || cx.indexOf(cy) === 0 || cy.indexOf(cx) === 0; } },
  { re: /sales\s*lead|lead\s*rep/i,         key: 'lead',      get: b => b.lead_rep || '',
    same: (a, b) => samePerson(a, b) },
];
const ADDED = ['MS match', 'MS partial inventory', 'MS regattas attended', 'MS last raced',
               'MS lead rep', 'MS contacted by', 'MS filled', 'MS disagrees'];

function enrichRows(headers, rows) {
  const { bySail, byName } = enrichIndex();
  const iSail = headers.findIndex(h => /sail\s*(number|no)/i.test(h));
  const iName = headers.findIndex(h => /yacht\s*name|boat\s*name|^name$/i.test(h));
  const cols = ENRICH_FIELDS.map(f => ({ f, i: headers.findIndex(h => f.re.test(h)) }));
  const smCol = cols.find(c => c.f.key === 'sailmaker');
  const house = smCol ? houseSpelling(rows, smCol.i) : {};
  const st = { total: 0, matched: 0, bySail: 0, byName: 0, unmatched: 0,
               filled: {}, disagree: {}, unmatchedRows: [] };
  ENRICH_FIELDS.forEach(f => { st.filled[f.key] = 0; st.disagree[f.key] = 0; });

  const out = rows.map(r => {
    const row = headers.map((_, i) => (r[i] == null ? '' : String(r[i]).trim()));
    st.total++;
    let b = null, how = '';
    if (iSail > -1 && sailKey(row[iSail])) { b = bySail[sailKey(row[iSail])] || null; if (b) how = 'sail number'; }
    if (!b && iName > -1 && nameKey(row[iName])) {
      const cand = byName[nameKey(row[iName])];
      if (cand) { b = cand; how = 'boat name'; }
    }
    const add = { 'MS match': '', 'MS partial inventory': '', 'MS regattas attended': '',
                  'MS last raced': '', 'MS lead rep': '', 'MS contacted by': '',
                  'MS filled': '', 'MS disagrees': '' };
    if (!b) {
      st.unmatched++;
      add['MS match'] = 'not found';
      if (st.unmatchedRows.length < 40) {
        st.unmatchedRows.push({ sail: iSail > -1 ? row[iSail] : '', name: iName > -1 ? row[iName] : '' });
      }
      return { row, add };
    }
    st.matched++;
    if (how === 'sail number') st.bySail++; else st.byName++;
    add['MS match'] = how;
    add['MS partial inventory'] = livePartial(b) || '';
    add['MS regattas attended'] = String(regattaAttendance(b));
    add['MS last raced'] = String(lastRaced(b));
    add['MS lead rep'] = b.lead_rep || '';
    add['MS contacted by'] = b.contacted_by || '';
    const filled = [], differs = [];
    cols.forEach(({ f, i }) => {
      if (i < 0) return;
      let ours = f.get(b);
      if (!ours) return;
      if (f.house) ours = house[makerBucket(ours)] || ours;
      if (!row[i]) { row[i] = ours; filled.push(f.key); st.filled[f.key]++; }
      else if (!f.same(row[i], ours)) {
        differs.push(f.key + ': ours "' + ours + '"'); st.disagree[f.key]++;
      }
    });
    add['MS filled'] = filled.join(', ');
    add['MS disagrees'] = differs.join('; ');
    return { row, add };
  });
  ENRICH.stats = st;
  return out;
}

function enrichToCSV() {
  if (!ENRICH.rows) return '';
  const esc2 = v => { v = String(v == null ? '' : v);
    return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const head = ENRICH.headers.concat(ADDED);
  const lines = [head.map(esc2).join(',')];
  ENRICH.rows.forEach(r => {
    lines.push(r.row.concat(ADDED.map(k => r.add[k])).map(esc2).join(','));
  });
  return lines.join('\n');
}

function parseCSVText(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += ch;
    } else if (ch === '"') q = true;
    else if (ch === ',') { row.push(cell); cell = ''; }
    else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (ch !== '\r') cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

function useSheet(matrix, sheetName) {
  // the header is the first row with two or more non-empty cells
  let h = 0;
  while (h < matrix.length && matrix[h].filter(c => String(c || '').trim()).length < 2) h++;
  const headers = (matrix[h] || []).map(c => String(c == null ? '' : c).replace(/\s+/g, ' ').trim());
  let last = headers.length; while (last > 0 && !headers[last - 1]) last--;
  ENRICH.headers = headers.slice(0, last);
  const body = matrix.slice(h + 1).filter(r => r.some(c => String(c == null ? '' : c).trim()));
  ENRICH.sheet = sheetName;
  ENRICH.rows = enrichRows(ENRICH.headers, body);
}

function attachEnrichHandlers() {
  const zone = document.getElementById('drop-zone');
  const input = document.getElementById('enrich-file');
  const pick = document.getElementById('enrich-pick');
  const status = document.getElementById('enrich-status');
  if (!zone) return;
  const say = m => { if (status) status.textContent = m; };

  const handle = async (file) => {
    if (!file) return;
    ENRICH.name = file.name;
    say('Reading ' + file.name + '…');
    try {
      if (/\.csv$/i.test(file.name)) {
        ENRICH.sheets = [];
        useSheet(parseCSVText(await file.text()), '');
      } else {
        const X = await loadXLSX();
        const wb = X.read(await file.arrayBuffer(), { type: 'array' });
        ENRICH.sheets = wb.SheetNames.slice();
        ENRICH.book = wb;
        const first = wb.SheetNames[0];
        useSheet(X.utils.sheet_to_json(wb.Sheets[first], { header: 1, raw: false, defval: '' }), first);
      }
      navigate();
    } catch (err) {
      say('Could not read that file: ' + err.message);
    }
  };

  if (pick) pick.addEventListener('click', () => input.click());
  if (input) input.addEventListener('change', () => handle(input.files[0]));
  ['dragenter', 'dragover'].forEach(ev => zone.addEventListener(ev, e => {
    e.preventDefault(); zone.classList.add('drag');
  }));
  ['dragleave', 'drop'].forEach(ev => zone.addEventListener(ev, e => {
    e.preventDefault(); zone.classList.remove('drag');
  }));
  zone.addEventListener('drop', e => handle(e.dataTransfer.files[0]));

  const sheetSel = document.getElementById('enrich-sheet');
  if (sheetSel) sheetSel.addEventListener('change', () => {
    const X = window.XLSX, wb = ENRICH.book;
    if (!X || !wb) return;
    useSheet(X.utils.sheet_to_json(wb.Sheets[sheetSel.value], { header: 1, raw: false, defval: '' }),
      sheetSel.value);
    navigate();
  });

  const note = document.getElementById('enrich-dl-note');
  const dl = document.getElementById('enrich-dl');
  if (dl) dl.addEventListener('click', async () => {
    const csv = enrichToCSV();
    const base = (ENRICH.name || 'entry-list').replace(/\.[^.]+$/, '') +
                 (ENRICH.sheet ? '-' + ENRICH.sheet : '') + '-marketshare';
    // Published pages hand files to the viewer through the downloads
    // capability; a plain blob link is inert there. Locally there is no
    // capability, and the blob link is the only route - so try both.
    let saved = false;
    try {
      const downloads = window.claude && claude.use ? await claude.use('downloads') : null;
      if (downloads) {
        try {
          await downloads.save({ filename: base + '.csv', data: csv });
          saved = true;
          if (note) note.textContent = 'Saved.';
        } catch (err) {
          const code = err && err.code;
          if (code === 'declined') { if (note) note.textContent = 'Save cancelled.'; return; }
          if (code === 'extension_not_enabled') {
            // CSV is not enabled for this viewer; .txt holds the same text
            await downloads.save({ filename: base + '.csv.txt', data: csv });
            saved = true;
            if (note) note.textContent = 'Saved as .csv.txt — rename to .csv to open it in Excel.';
          } else if (note) {
            note.textContent = 'Could not save (' + (code || 'unknown') + '). Use Copy instead.';
          }
        }
      }
    } catch (e) { /* fall through to the blob route */ }
    if (!saved) {
      try {
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = base + '.csv';
        document.body.appendChild(a); a.click();
        setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
        // A blob click cannot be confirmed: some hosts silently drop it. Say
        // what was attempted rather than claiming a save that may not exist.
        if (note) note.textContent = 'Download sent to the browser. If nothing ' +
          'appears, this page is sandboxed — use Copy and paste into a sheet.';
      } catch (e) {
        if (note) note.textContent = 'Downloads are blocked here — use Copy instead.';
      }
    }
  });

  const cp = document.getElementById('enrich-copy');
  if (cp) cp.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(enrichToCSV());
      if (note) note.textContent = 'Copied — paste straight into Excel or Sheets.';
    } catch (e) {
      if (note) note.textContent = 'Could not reach the clipboard.';
    }
  });
}

// ---------- page: coverage ----------
// Why a source is incomplete, so the gap list says what to DO rather than just
// that something is missing. Keyed by a test on the regatta name.
const COVERAGE_NOTES = [
  [/^Rolex Fastnet|^RORC |^IRC |^NSR |Easter Challenge|Inshore Series|Two-Handed|Myth of Malham|Cervantes|North Sea|Roschier|Caribbean|Transatlantic/i,
   'blocked', 'RORC results moved to sailracehq.com, which disallows our crawler, so the legacy '
   + 'archive stops at 2022. Easter Challenge 2023–2026, the Vice Admiral\'s Cup 2023–2024, '
   + 'Cervantes 2023–2025 and the 2026 Double Handed Nationals were since read through a browser '
   + 'and are complete. sailracehq only publishes back to 2023, so earlier seasons need RORC directly.'],
  [/^JOG/i, 'blocked',
   'myjog.jog.org.uk disallows our crawler (Cloudflare managed AI list). Needs JOG to allow it, or a member-side export.'],
  [/^ORC /i, 'manual',
   'ORC championships, aggregate counts only from the IRC Solent Report. Boat-level would need the event sites season by season.'],
  [/^Round the Island/i, 'blocked',
   'Aggregate counts only, and still the biggest single gap: 2,635 reported entries, no named boats. '
   + 'Results ARE published, at racing.islandsc.org.uk — the same platform RORC uses, so the same '
   + 'extraction works. That site\'s robots.txt disallows our crawler outright, so it needs the '
   + 'browser route rather than a scraper.'],
  [/^Cowes Week/i, 'auto', 'Scraped weekly. 2017 lost ~80 of 348 fetches to a DNS drop and is worth a re-run.'],
  [/^Royal Southern|^Taittinger|^Hamble|^Warsash/i, 'auto', 'Scraped weekly.'],
];
// A source being blocked only matters if it is actually missing recent
// seasons. Most of the RORC records are per-class historical result sets that
// stopped years ago and are complete as they stand - calling those "blocked"
// buried the handful of regattas that genuinely need action.
function coverageNote(name, boatYears, aggYears) {
  const latest = Math.max(0, ...boatYears, ...aggYears);
  const newestBoat = Math.max(0, ...boatYears);
  const stale = latest && newestBoat < latest;          // aggregate newer than boats
  const ranRecently = latest >= ACTIVE_CUTOFF_YEAR;

  // Age decides first: a regatta that last ran years ago cannot be "blocked",
  // whatever its source, because there is nothing newer to go and fetch.
  if (!ranRecently) {
    return {status: 'historical',
            note: `Complete as held. Last ran ${latest || '—'}; no newer results exist to fetch.`};
  }
  for (const [re, status, note] of COVERAGE_NOTES) {
    if (!re.test(name)) continue;
    if (status === 'blocked' && !stale) {
      return {status: 'auto', note: 'Up to date with what the source publishes.'};
    }
    return {status, note};
  }
  return ranRecently
    ? {status: 'todo', note: 'No automated source configured yet.'}
    : {status: 'historical', note: `Complete as held. Last ran ${latest || '—'}.`};
}
const COVERAGE_BADGE = {
  auto:    ['Automated',   'var(--series-north)', '#fff'],
  todo:    ['Needs work',  'var(--series-doyle)', '#292524'],
  manual:  ['Manual only', 'var(--series-other)', '#fff'],
  blocked: ['Blocked',     'var(--series-one)',   '#fff'],
  historical: ['Historical', 'var(--series-unknown)', 'var(--series-unknown-text)'],
};

// Everything that needs a human verdict, in one place and computed live rather
// than exported as a snapshot - a CSV of this goes stale the moment a scrape

const VARIANT_SUFFIX_RE = /\b(ood|od|sport|mod|mk\s*[ivx0-9]+|b&c|r[12]|s|e|c|distinction|yawl|custom|fc|sq)\b/ig;

function typeFamilies() {
  const counts = {};
  DATA.boats.forEach(b => {
    const t = (b.boat_type || '').trim();
    if (t) counts[t] = (counts[t] || 0) + 1;
  });
  const fam = {};
  Object.entries(counts).forEach(([name, n]) => {
    const base = name.replace(VARIANT_SUFFIX_RE, '').replace(/\s+/g, ' ').trim().replace(/[-/]$/, '');
    (fam[base] ||= []).push({name, n});
  });
  return Object.entries(fam)
    .filter(([, v]) => v.length > 1)
    .map(([base, v]) => ({base, variants: v.sort((a, b) => b.n - a.n),
                          total: v.reduce((s, x) => s + x.n, 0)}))
    .sort((a, b) => b.total - a.total);
}

  return `
    <h1>Data quality</h1>
    <p class="subtitle">Everything waiting on a human decision, computed live from the current data.</p>

    <div class="stat-row">
      <div class="stat-tile"><div class="v">${fams.length}</div><div class="l">Naming families to confirm</div></div>
      <div class="stat-tile"><div class="v">${dupCount}</div><div class="l">Duplicate candidates</div></div>
      <div class="stat-tile"><div class="v">${flagged.length}</div><div class="l">Flagged sailmaker findings</div></div>
      <div class="stat-tile"><div class="v">${noSm.length}</div><div class="l">Active boats, no sailmaker</div></div>
    </div>

    <div class="card" style="padding:0;overflow:auto;">
      <h2 style="padding:18px 20px 0;">Missing data — active fleet (${active.length} boats)</h2>
      <p class="muted" style="font-size:12px;padding:0 20px;margin:4px 0 0;">Most-raced boats shown first, since those matter commercially.</p>
      <table>
        <thead><tr><th>Field</th><th class="num">Missing</th><th>Busiest boats missing it</th><th>Why it matters</th></tr></thead>
        <tbody>
          ${missRow('Sailmaker', noSm, 'The core gap. Race results almost never publish sails.')}
          ${missRow('Owner', noOwner, 'Beware: results often record the boat captain here.')}
          ${missRow('Boat type', noType, 'Needed for duplicate detection and class analysis.')}
          ${missRow('IRC TCC', noTcc, 'Also the IRC-eligibility signal for the fleet filter.')}
        </tbody>
      </table>
    </div>

    <div class="card" style="padding:0;overflow:auto;">
      <h2 style="padding:18px 20px 0;">Naming — is each row the same boat as its siblings?</h2>
      <p class="muted" style="font-size:12px;padding:0 20px;margin:4px 0 0;">
        These differ only by a variant suffix. A suffix often means a genuinely different boat — deeper keel,
        different designer, different generation — so none of them have been merged.
        ${fams.length > 40 ? `Showing the 40 largest of ${fams.length}.` : ''}</p>
      <table>
        <thead><tr><th>Family</th><th>Variants on file</th><th class="num">Boats</th></tr></thead>
        <tbody>${famRows || '<tr><td colspan="3" class="muted">Nothing ambiguous.</td></tr>'}</tbody>
      </table>
    </div>

    ${flagged.length ? `<div class="card" style="padding:0;overflow:auto;">
      <h2 style="padding:18px 20px 0;">Sailmaker findings worth checking</h2>
      <p class="muted" style="font-size:12px;padding:0 20px;margin:4px 0 0;">
        Researched from published sources, not asserted. <strong>low</strong> means the match itself is
        doubtful; <strong>medium</strong> usually means the evidence is sound but dated.</p>
      <table>
        <thead><tr><th>Boat</th><th>Sail No</th><th>Sailmaker</th><th>Confidence</th><th>Source</th></tr></thead>
        <tbody>${flagRows}</tbody>
      </table>
    </div>` : ''}

    ${charterRows ? `<div class="card" style="padding:0;overflow:auto;">
      <h2 style="padding:18px 20px 0;">Charter or owner?</h2>
      <p class="muted" style="font-size:12px;padding:0 20px;margin:4px 0 0;">
        These names appear on several boats, which usually means a charter company, club or school entering
        rather than owning — but not always: Peter Morton and Niklas Zennström genuinely own several. Ones
        already marked as charter are excluded. Tell me which of these are charterers and I'll flag them, so
        they stop reading as changes of ownership.</p>
      <table>
        <thead><tr><th>Name</th><th class="num">Boats</th><th>Boats it appears on</th></tr></thead>
        <tbody>${charterRows}</tbody>
      </table>
    </div>` : ''}

    <div class="card">
      <h2>Duplicates</h2>
      <p style="margin:0;">${dupCount} candidate group(s) waiting.
        <a href="#/duplicates" data-route="#/duplicates">Work through them →</a></p>
    </div>
  `;
}

// ---------- page: compare regattas ----------
function renderCompare(selectedIds) {
  const sel = new Set((selectedIds || []).map(Number));
  // only offer regattas that actually have a trend worth plotting
  const candidates = DATA.regattas
    .map(r => ({r, s: regattaSummary(r)}))
    .filter(x => x.s.pts.length > 1)
    .sort((a,b) => b.s.nRecent - a.s.nRecent || a.r.name.localeCompare(b.r.name));

  const chosen = candidates.filter(x => sel.has(x.r.id));
  const series = chosen.map(x => ({
    label: x.r.name,
    points: x.s.pts.map(p => ({x: p.x, y: p.y, solid: p.real})),
  }));

  // Add-one-at-a-time dropdown plus removable chips. A <select multiple>
  // needs ctrl-click to pick a second item - clicking normally REPLACES the
  // first - so the tool looked broken to anyone using it the obvious way.
  // Alphabetical, because you come here knowing which regatta you want.
  const unpicked = candidates.filter(x => !sel.has(x.r.id))
    .sort((a, b) => a.r.name.localeCompare(b.r.name));
  const chips = chosen.map((x, i) => `
    <span class="cmp-chip" style="display:inline-flex;align-items:center;gap:8px;margin:0 8px 8px 0;
          padding:6px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);">
      <span style="width:10px;height:10px;border-radius:50%;background:${LINE_COLOURS[i % LINE_COLOURS.length]};"></span>
      ${esc(x.r.name)}
      <button type="button" class="cmp-remove" data-id="${x.r.id}" aria-label="Remove ${esc(x.r.name)}"
              style="border:0;background:none;cursor:pointer;font-size:16px;line-height:1;color:var(--text-muted);padding:0;">×</button>
    </span>`).join('');

  const picker = `
    <div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px;">
      <select id="cmp-add" style="min-width:280px;">
        <option value="">+ Add a regatta…</option>
        ${unpicked.map(x => `<option value="${x.r.id}">${esc(x.r.name)} (${x.s.pts.length} seasons)</option>`).join('')}
      </select>
      ${chosen.length ? `<button class="btn secondary" id="cmp-clear" type="button">Clear all</button>` : ''}
    </div>
    ${chips ? `<div style="margin-top:12px;">${chips}</div>` : ''}`;

  const table = chosen.length ? (() => {
    const years = Array.from(new Set(chosen.flatMap(x => x.s.pts.map(p=>p.x)))).sort((a,b)=>a-b);
    const head = years.map(y => `<th class="num">${y}</th>`).join('');
    const rows = chosen.map(x => {
      const by = {}; x.s.pts.forEach(p => by[p.x] = p);
      const first = x.s.pts[0], last = x.s.pts[x.s.pts.length-1];
      const chg = (first && last && first.y) ? Math.round((last.y-first.y)/first.y*100) : null;
      return `<tr><td>${esc(x.r.name)}</td>${years.map(y => {
        const p = by[y];
        return `<td class="num">${p ? (p.real ? p.y : `<span class="muted">${p.y}</span>`) : '—'}</td>`;
      }).join('')}<td class="num">${chg==null?'—':(chg>0?'+':'')+chg+'%'}</td></tr>`;
    }).join('');
    return `<div class="card" style="padding:0;overflow:auto;">
      <h2 style="padding:18px 20px 0;">Side by side</h2>
      <p class="muted" style="font-size:12px;padding:0 20px;margin:4px 0 0;">Greyed figures are aggregate-only seasons.</p>
      <table><thead><tr><th>Regatta</th>${head}<th class="num">Change</th></tr></thead><tbody>${rows}</tbody></table>
    </div>`;
  })() : '';

  return `
    <h1>Compare regattas</h1>
    <p class="subtitle">Attendance over time, plotted together. Add as many as you like.</p>
    <div class="card">${picker}</div>
    ${chosen.length ? `<div class="card">${svgLineChart(series, {height: 320})}</div>`
      : `<div class="card muted">Add a regatta above to start.</div>`}
    ${table}
  `;
}

function attachCompareHandlers() {
  const add = document.getElementById('cmp-add');
  if (!add) return;
  // replaceState rather than assigning location.hash: picking regattas
  // shouldn't push a history entry per click, or Back has to walk out
  // through every selection you tried.
  const go = (ids) => {
    history.replaceState(null, '', '#/compare' + (ids.length ? '?r=' + ids.join(',') : ''));
    navigate();
  };
  const current = () => {
    const q = (location.hash.split('?')[1] || '');
    return new URLSearchParams(q).get('r')?.split(',').filter(Boolean) || [];
  };
  add.addEventListener('change', () => {
    if (!add.value) return;
    const ids = current();
    if (!ids.includes(add.value)) ids.push(add.value);
    go(ids);
  });
  document.querySelectorAll('.cmp-remove').forEach(b =>
    b.addEventListener('click', () => go(current().filter(id => id !== b.dataset.id))));
  const clear = document.getElementById('cmp-clear');
  if (clear) clear.addEventListener('click', () => go([]));
}

function attachRegattaListHandlers() {
  const search = document.getElementById('regatta-search');
  const filter = document.getElementById('regatta-filter');
  if (!search) return;
  // Class nodes render their boats only when opened - see fillTreeLeaf.
  const sections = document.getElementById('main');
  if (sections && !sections.dataset.treeBound) {
    sections.dataset.treeBound = '1';
    sections.addEventListener('toggle', (ev) => {
      const d = ev.target;
      if (d && d.tagName === 'DETAILS' && d.open && d.dataset.leaf) fillTreeLeaf(d);
    }, true);   // capture: 'toggle' does not bubble
  }
  const apply = () => {
    const q = search.value.trim().toLowerCase();
    const f = filter.value;
    let shown = 0;
    document.querySelectorAll('.regatta-row').forEach(tr => {
      let ok = (!q || tr.dataset.name.includes(q));
      if (ok && f === 'recent') ok = parseInt(tr.dataset.recent) > 0;
      if (ok && f === 'boatlevel') ok = tr.dataset.boatlevel === '1';
      // the work queue: a season the organiser reported entries for, where we
      // still hold no named boats
      if (ok && f === 'gap') ok = parseInt(tr.dataset.seasonboats || '0') === 0
                              && parseInt(tr.dataset.seasonreported || '0') > 0;
      tr.style.display = ok ? '' : 'none';
      if (ok) shown++;
    });
    // A season with no surviving event is noise, and so is a club with no
    // surviving season - hide both, innermost first.
    document.querySelectorAll('.tree-year').forEach(y => {
      const any = Array.from(y.querySelectorAll('.regatta-row')).some(tr => tr.style.display !== 'none');
      y.style.display = any ? '' : 'none';
      if (any && q) y.open = true;
    });
    document.querySelectorAll('.regatta-series').forEach(card => {
      const any = Array.from(card.querySelectorAll('.regatta-row')).some(tr => tr.style.display !== 'none');
      card.style.display = any ? '' : 'none';
      if (any && q) card.open = true;
    });
    const c = document.getElementById('regatta-count');
    if (c) c.textContent = shown;
  };
  search.addEventListener('input', apply);
  filter.addEventListener('change', apply);
  apply();
}

// ---------- page: regatta profile ----------
// Distinct boats that entered one regatta in one season, with their races
// rolled up. This is the "regatta entry" - the unit that matters commercially;
// individual race results hang off it rather than the other way round.
function regattaEntriesFor(regattaId, year, classFilter) {
  const evIds = new Set(DATA.events
    .filter(e => e.regatta_id === regattaId && (year == null || e.season_year === year))
    .map(e => e.id));
  if (!evIds.size) return [];
  const out = [];
  DATA.boats.forEach(b => {
    let races = 0, best = null, cls = new Set(), sm = null;
    b.entries.forEach(e => {
      const ra = racesById[e.race_id];
      if (!ra || !evIds.has(ra.event_id)) return;
      if (classFilter && normClass(e.class) !== classFilter) return;
      races++;
      if (e.class) cls.add(e.class);
      const pos = parseInt(e.position, 10);
      if (!isNaN(pos) && pos > 0 && (best === null || pos < best)) best = pos;
      if (!sm && e.sailmaker_name) sm = e.sailmaker_name;
    });
    if (races) out.push({ boat: b, races, best, classes: cls, sailmaker: sm || b.current_sailmaker });
  });
  return out.sort((a, b) => (a.best ?? 9999) - (b.best ?? 9999) ||
                            (a.boat.boat_name || '').localeCompare(b.boat.boat_name || ''));
}

// Sources label the same division inconsistently ("IRC 1", "IRC Class 1",
// "IRC One", "1"), and Cowes appends the race number to every label
// ("J/70 (Race 8)"). Collapse those so a class groups as one thing.
function normClass(raw) {
  let s = (raw || '').trim();
  if (!s) return 'Unclassified';
  s = s.replace(/\s*\(race\s*\d+\)\s*$/i, '');
  const WORDS = {one:'1', two:'2', three:'3', four:'4', five:'5', six:'6', seven:'7', zero:'0'};
  // The division marker is not always at the start: Hamble writes "HWS IRC1"
  // and "Autumn Regatta IRC2", Cowes "LMIS IRC Class 3". Pull the division out
  // wherever it sits so the same division reads the same across regattas.
  let m = s.match(/\bIRC\s*(?:class\s*)?([0-9]+|zero|one|two|three|four|five|six|seven)\s*([A-Z])?\b/i);
  if (m) return 'IRC ' + (WORDS[m[1].toLowerCase()] ?? m[1]) + (m[2] || '').toUpperCase();
  if (/^[0-7]$/.test(s)) return 'IRC ' + s;
  return s.replace(/\s+/g, ' ');
}

// Classes raced within one regatta-season, with boats and races per class.
// Classes belong in racing order, not in size order. Sorting by entry count
// put IRC 4 above IRC 1 whenever Four was the bigger fleet, which reads as an
// error every time.
//
// The catch is that a trailing number does not always mean a division: "IRC 2"
// is division two, but "Class 40", "Cape 31", "HP30" and "J/109" are boat
// classes that merely end in digits. Division numbers are single digits (with
// an optional A/B split), so a trailing run of two or more digits is taken as
// part of a class NAME and sorted alphabetically among the named classes.
function classSortKey(label) {
  const s = String(label == null ? '' : label).trim();
  if (!s) return [9, 0, '', ''];                       // unlabelled, last
  if (/division unrecorded/i.test(s)) return [8, 0, '', s];
  if (/\boverall\b/i.test(s)) return [0, 0, '', s];    // the whole fleet, first
  if (/\bsuper\s*zero\b/i.test(s)) return [1, -1, '', s];
  if (/\bzero\b/i.test(s)) return [1, 0, '', s];
  const split = s.match(/(\d)\s*\/\s*(\d)\s*$/);      // "IRC 1/2" sits between them
  if (split) return [1, parseInt(split[1], 10) + 0.5, '', s];
  const m = s.match(/(\d+)([A-Za-z])?\s*$/);
  if (m && m[1].length === 1) return [1, parseInt(m[1], 10), (m[2] || '').toUpperCase(), s];
  return [2, 0, '', s];                                // named divisions and one-designs
}

function compareClasses(a, b) {
  const x = classSortKey(a), y = classSortKey(b);
  return (x[0] - y[0]) || (x[1] - y[1]) || x[2].localeCompare(y[2])
      || String(x[3]).localeCompare(String(y[3]), undefined, { sensitivity: 'base' });
}

function regattaClassesFor(regattaId, year) {
  const evIds = new Set(DATA.events
    .filter(e => e.regatta_id === regattaId && (year == null || e.season_year === year))
    .map(e => e.id));
  const byClass = new Map();
  DATA.boats.forEach(b => b.entries.forEach(e => {
    const ra = racesById[e.race_id];
    if (!ra || !evIds.has(ra.event_id)) return;
    const key = normClass(e.class);
    let g = byClass.get(key);
    if (!g) { g = { cls: key, boats: new Set(), races: new Set() }; byClass.set(key, g); }
    g.boats.add(b.id);
    g.races.add(e.race_id);
  }));
  return Array.from(byClass.values())
    .map(g => ({ cls: g.cls, nBoats: g.boats.size, nRaces: g.races.size }))
    .sort((a, b) => compareClasses(a.cls, b.cls));
}

function renderRegattaProfile(id, year, cls) {
  const r = regattasById[id];
  if (!r) return `<div class="card">Regatta not found.</div>`;
  const evs = DATA.events.filter(e => e.regatta_id === id).sort((a,b)=>b.season_year-a.season_year);

  // per-season summary: how many distinct boats entered, and how many races
  const seasonRows = evs.map(ev => {
    const entries = regattaEntriesFor(id, ev.season_year);
    const nRaces = DATA.races.filter(ra => ra.event_id === ev.id).length;
    const totalRow = DATA.class_counts.find(c => c.event_id === ev.id && c.class_label.toLowerCase() === 'total');
    const agg = totalRow ? totalRow.entry_count : null;
    const sel = (year === ev.season_year) ? ' style="background:var(--surface-2);font-weight:600;"' : '';
    return `<tr class="clickable"${sel} data-route="#/regatta/${id}?year=${ev.season_year}">
      <td class="num">${ev.season_year}</td>
      <td class="num">${entries.length || (agg != null ? '<span class="muted">'+agg+' (aggregate)</span>' : '—')}</td>
      <td class="num">${nRaces || '—'}</td>
    </tr>`;
  }).join('');

  const _sum = regattaSummary(r);
  const attendancePts = _sum.pts.map(p => ({x: p.x, y: p.y, solid: p.real}));
  // second series, only for seasons where the organiser's own total is on file
  const reportedPts = _sum.pts.filter(p => p.reported != null)
                             .map(p => ({x: p.x, y: p.reported, solid: true}));

  // The selected season's actual entry list. Default to the most recent season
  // that has boat-level results rather than simply the most recent: several
  // regattas (Fastnet, Myth of Malham) have aggregate-only counts for the
  // newest years because the RORC scrape stops at 2022, and landing on one of
  // those shows an empty entries table for a regatta that plainly has data.
  let focus = year;
  if (focus == null) {
    const withBoats = evs.find(e => DATA.boats.some(b => b.entries.some(x => {
      const ra = racesById[x.race_id];
      return ra && ra.event_id === e.id;
    })));
    focus = (withBoats || evs[0] || {}).season_year ?? null;
  }
  const classes = focus != null ? regattaClassesFor(id, focus) : [];
  const classRows = classes.map(g => {
    const sel = (cls === g.cls) ? ' style="background:var(--surface-2);font-weight:600;"' : '';
    const href = `#/regatta/${id}?year=${focus}` + (cls === g.cls ? '' : `&cls=${encodeURIComponent(g.cls)}`);
    return `<tr class="clickable"${sel} data-route="${esc(href)}">
      <td>${esc(g.cls)}</td><td class="num">${g.nBoats}</td><td class="num">${g.nRaces}</td></tr>`;
  }).join('');
  const entries = focus != null ? regattaEntriesFor(id, focus, cls) : [];
  const entryRows = entries.map(g => `
    <tr class="clickable" data-route="#/boat/${g.boat.id}">
      <td><strong>${esc(g.boat.boat_name||'—')}</strong></td>
      <td>${esc(g.boat.sail_no||'')}</td>
      <td>${esc(g.boat.boat_type||'')}</td>
      <td>${esc(Array.from(g.classes).join(', '))}</td>
      <td>${esc(g.boat.owner_name||'')}</td>
      <td><span class="pill" style="${pillStyle(g.sailmaker)}">${esc(g.sailmaker||'Unknown')}</span></td>
      <td class="num">${g.races}</td>
      <td>${g.best!=null ? (g.best===1?'1st':g.best===2?'2nd':g.best===3?'3rd':g.best+'th') : '—'}</td>
    </tr>`).join('');

  // races for the focused season (and class, if one is selected), kept
  // subsidiary to the entry list
  const focusEvIds = new Set(evs.filter(e => focus == null || e.season_year === focus).map(e => e.id));
  const raceClass = {};   // race_id -> normalised class, for filtering
  DATA.boats.forEach(b => b.entries.forEach(e => {
    if (raceClass[e.race_id] === undefined) raceClass[e.race_id] = normClass(e.class);
  }));
  const raceRows = DATA.races
    .filter(ra => focusEvIds.has(ra.event_id) && (!cls || raceClass[ra.id] === cls))
    .map(ra => {
      const ev = eventsById[ra.event_id];
      const n = DATA.boats.reduce((acc,b) => acc + b.entries.filter(e=>e.race_id===ra.id).length, 0);
      return `<tr class="clickable" data-route="#/race/${ra.id}"><td>${esc(ra.race_name)}</td><td>${esc(raceClass[ra.id]||'')}</td><td class="num">${n}</td></tr>`;
    }).join('');

  const classData = getClassYearData(id);
  const { aggByClassYear, allYears, classesWithYearData } = classData;
  const classTrendTable = classesWithYearData.length && allYears.length ? `
    <div class="card" style="padding:0;overflow:auto;">
      <h2 style="padding:18px 20px 0;">Class sizes over time</h2>
      <p class="muted" style="padding:0 20px;font-size:12px;">Click a season or a class to see it graphed.</p>
      <table>
        <thead><tr>
          <th>Season</th>
          ${classesWithYearData.map(c=>`<th class="num clickable-axis" data-chart-class="${esc(c)}" data-regatta-id="${id}">${esc(c)}</th>`).join('')}
          <th class="num">Total</th>
        </tr></thead>
        <tbody>${allYears.map(y => {
          const total = classesWithYearData.reduce((acc,c) => acc + (aggByClassYear[c][y]||0), 0);
          return `<tr>
            <td class="clickable-axis" data-chart-season="${y}" data-regatta-id="${id}">${y}</td>
            ${classesWithYearData.map(c => `<td class="num">${aggByClassYear[c][y] != null ? aggByClassYear[c][y] : '—'}</td>`).join('')}
            <td class="num"><strong>${total}</strong></td>
          </tr>`;
        }).join('')}</tbody>
      </table>
    </div>` : '';

  return `
    <a class="back-link" href="#/regattas" data-route="#/regattas">← All regattas</a>
    <h1>${esc(r.name)}</h1>
    <p class="subtitle">${esc(r.category||'')} · ${esc(r.region||'')}</p>
    <div class="card" style="padding:0;overflow:auto;">
      <h2 style="padding:18px 20px 0;">Seasons</h2>
      <p class="muted" style="font-size:12px;padding:0 20px;margin:4px 0 0;">Click a season to see who entered it.</p>
      <table>
        <thead><tr><th class="num">Season</th><th class="num">Boats entered</th><th class="num">Races</th></tr></thead>
        <tbody>${seasonRows || '<tr><td colspan="3" class="muted">No seasons on file.</td></tr>'}</tbody>
      </table>
    </div>
    ${attendancePts.length > 1 ? `<div class="card">
      <h2>Attendance over time</h2>
      <p class="muted" style="font-size:12px;margin-top:0;">
        <strong>Boats with results</strong> is how many distinct boats we hold named results for.
        <strong>Reported entries</strong> is the total the organiser published. Where they differ, the gap is
        our coverage of that season &mdash; not a change in the fleet.
        <a href="#/compare?r=${id}" data-route="#/compare?r=${id}">Compare with other regattas &rarr;</a></p>
      ${svgLineChart(reportedPts.length > 1
          ? [{label: 'Boats with results', points: attendancePts},
             {label: 'Reported entries', points: reportedPts, dashed: true}]
          : [{label: 'Boats with results', points: attendancePts}])}
    </div>` : ''}
    ${classes.length ? `<div class="card" style="padding:0;overflow:auto;">
      <h2 style="padding:18px 20px 0;">Classes — ${focus}</h2>
      <p class="muted" style="font-size:12px;padding:0 20px;margin:4px 0 0;">
