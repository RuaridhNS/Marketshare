<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketshare — Race Entry &amp; Sailmaker Tracker</title>
<style>
  :root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page:           #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --success:        #006300;
    --card-shadow:    0 1px 2px rgba(11,11,11,0.06), 0 1px 1px rgba(11,11,11,0.04);

    --series-north:    #2563eb;
    --series-doyle:    #eab308;
    --series-quantum:  #16a34a;
    --series-one:      #dc2626;
    --series-sanders:  #7c3aed;
    --series-elvstrom: #ea580c;
    --series-unknown:  #f5f5f4;
    --series-other:    #71717a;
    --series-partial:  #0d9488;
    --series-unknown-text: #292524;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --page:           #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --baseline:       #383835;
      --border:         rgba(255,255,255,0.10);
      --success:        #0ca30c;
      --card-shadow:    0 1px 2px rgba(0,0,0,0.4);

      --series-north:    #4f83f1;
      --series-doyle:    #f0c33a;
      --series-quantum:  #2fbf63;
      --series-one:      #ef4444;
      --series-sanders:  #9767f0;
      --series-elvstrom: #fb7f36;
      --series-unknown:  #e7e5e4;
      --series-other:    #9a999a;
      --series-partial:  #22b6a6;
      --series-unknown-text: #1c1917;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--page);
    color: var(--text-primary);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  a { color: inherit; }
  .app { display: flex; min-height: 100vh; }

  .sidebar {
    width: 220px; flex: none; background: var(--surface-1);
    border-right: 1px solid var(--border); padding: 20px 12px;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  .brand { font-weight: 700; font-size: 15px; padding: 0 10px 18px; letter-spacing: -0.01em; }
  .brand small { display:block; color: var(--text-muted); font-weight: 500; font-size: 11px; margin-top: 2px;}
  .nav-item {
    display: block; padding: 9px 10px; border-radius: 8px; margin-bottom: 2px;
    color: var(--text-secondary); text-decoration: none; font-size: 13.5px; font-weight: 500;
    cursor: pointer;
  }
  .nav-item:hover { background: var(--gridline); color: var(--text-primary); }
  .nav-item.active { background: var(--series-north); color: white; }

  .main { flex: 1; min-width: 0; padding: 28px 36px 80px; max-width: 1180px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  h2 { font-size: 16px; margin: 0 0 14px; }
  .subtitle { color: var(--text-secondary); font-size: 13.5px; margin: 0 0 24px; }

  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap: 12px; margin-bottom: 26px; }
  .stat-tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; box-shadow: var(--card-shadow); }
  .stat-tile .v { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat-tile .l { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; box-shadow: var(--card-shadow); margin-bottom: 20px; }
  .card-row { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; align-items: start; }
  @media (max-width: 900px) { .card-row { grid-template-columns: 1fr; } }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; color: var(--text-muted); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.03em; padding: 8px 10px; border-bottom: 1px solid var(--gridline); position: sticky; top:0; background: var(--surface-1);}
  td { padding: 8px 10px; border-bottom: 1px solid var(--gridline); vertical-align: top; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: var(--gridline); }
  .num { text-align: right; font-variant-numeric: tabular-nums; }

  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; color: white; white-space: nowrap; }
  .search-row { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  input[type=text], select {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-size: 13.5px; color: var(--text-primary); font-family: inherit;
  }
  input[type=text] { flex: 1; min-width: 200px; }
  .legend { display:flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; font-size: 12.5px; color: var(--text-secondary); }
  .legend-item { display:flex; align-items:center; gap: 6px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .muted { color: var(--text-muted); }
  .back-link { display:inline-block; margin-bottom: 14px; font-size: 13px; color: var(--text-secondary); cursor:pointer; text-decoration: none;}
  .back-link:hover { color: var(--text-primary); }
  .kv { display:grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13.5px; }
  .kv dt { color: var(--text-muted); }
  .kv dd { margin: 0; }
  .tag-flag { color: var(--series-doyle); font-weight: 600; }
  footer.note { color: var(--text-muted); font-size: 11.5px; margin-top: 40px; border-top: 1px solid var(--gridline); padding-top: 14px; }
  code { background: var(--gridline); padding: 1px 5px; border-radius: 4px; font-size: 12px; }

  .nav-badge {
    display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px;
    background: var(--series-doyle); color: white; font-size: 11px; font-weight: 700;
    vertical-align: 1px;
  }
  input[type=number] {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-size: 13.5px; color: var(--text-primary); font-family: inherit; width: 100%;
  }
  label.field-label { display:block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; font-weight: 600; }
  .field { margin-bottom: 12px; }
  .field input, .field select { width: 100%; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; background: var(--series-north); color: white;
    border: none; border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn.secondary { background: var(--gridline); color: var(--text-primary); }
  .btn.danger { background: var(--series-unknown); }
  .btn-row { display:flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .edited-flag {
    display:inline-block; margin-left: 6px; font-size: 10.5px; font-weight: 700; color: var(--series-doyle);
    border: 1px solid var(--series-doyle); border-radius: 999px; padding: 1px 7px; text-transform: uppercase;
    letter-spacing: 0.03em; vertical-align: 1px;
  }
  .filter-panel summary {
    cursor: pointer; font-size: 13px; font-weight: 600; color: var(--text-secondary);
    padding: 4px 0; user-select: none;
  }
  .filter-panel summary:hover { color: var(--text-primary); }
  .filter-panel[open] summary { margin-bottom: 10px; }
  .filter-group { margin-bottom: 14px; }
  .filter-group-title { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-muted); margin-bottom: 6px; }
  .chip-row { display:flex; flex-wrap:wrap; gap: 6px; margin-bottom: 8px; }
  .chip { display:inline-flex; align-items:center; gap: 5px; background: var(--gridline); border-radius: 999px; padding: 4px 10px 4px 8px; font-size: 12.5px; cursor: pointer; user-select:none; }
  .chip input { margin: 0; }
  .mode-row { display:flex; gap: 14px; font-size: 12.5px; color: var(--text-secondary); align-items:center; }
  .mode-row label { display:flex; align-items:center; gap: 5px; cursor:pointer; }
  .regatta-checklist { max-height: 220px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .regatta-checklist .cat-heading { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin: 8px 0 4px; }
  .regatta-checklist .cat-heading:first-child { margin-top: 0; }
  .regatta-checklist label { display:flex; align-items:center; gap: 7px; font-size: 13px; padding: 3px 0; cursor: pointer; }
  textarea.csv-box {
    width: 100%; min-height: 140px; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 12px;
    background: var(--page); border: 1px solid var(--border); border-radius: 8px; padding: 10px; color: var(--text-primary);
    resize: vertical;
  }
  .banner {
    background: var(--gridline); border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px;
    display:flex; align-items:center; justify-content:space-between; gap: 10px; flex-wrap: wrap;
  }
  th.clickable-axis, td.clickable-axis {
    cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px;
  }
  th.clickable-axis:hover, td.clickable-axis:hover { color: var(--series-north); }
  /* <dialog> centers itself via a top/right/bottom/left inset trick in the UA
     stylesheet that author CSS can't cleanly override once showModal() promotes
     it to the top layer - so instead the dialog itself is a transparent,
     full-viewport flex container, and .modal-box (inside it) is the actual
     visible, centered card. */
  dialog#chart-modal[open] {
    display: flex; align-items: center; justify-content: center;
    width: 100vw; height: 100vh; max-width: 100vw; max-height: 100vh;
    margin: 0; padding: 0; border: none; background: transparent;
  }
  dialog#chart-modal::backdrop { background: rgba(0,0,0,0.5); }
  dialog#chart-modal .modal-box {
    border: 1px solid var(--border); border-radius: 12px; padding: 20px 24px 24px;
    background: var(--surface-1); color: var(--text-primary); box-shadow: var(--card-shadow);
    width: min(640px, 92vw); max-width: 92vw;
  }
  dialog#chart-modal .modal-head { display:flex; align-items:center; justify-content:space-between; gap: 16px; margin-bottom: 16px; }
  dialog#chart-modal .modal-head h2 { margin: 0; }
</style>

<body>
<div class="app">
  <nav class="sidebar" id="sidebar">
    <div class="brand">Marketshare<small>Race entry &amp; sailmaker tracker</small></div>
    <a class="nav-item" href="#/overview" data-route="#/overview">Overview</a>
    <a class="nav-item" href="#/boats" data-route="#/boats">Boats</a>

    <a class="nav-item" href="#/market-share" data-route="#/market-share">Market share</a>
    <a class="nav-item" href="#/sales" data-route="#/sales">Sales opportunities</a>

  </nav>

  <dialog id="chart-modal">
    <div class="modal-box">
      <div class="modal-head">
        <h2 id="chart-modal-title"></h2>

<script id="data-json" type="text/plain">/*__DATA_JSON_B64GZ__*/</script>
<script>
(async () => {
// The embedded payload is the dataset JSON, gzip-compressed then base64-encoded
// (raw JSON at this scale is tens of MB of highly repetitive text; gzip shrinks
// it ~15-18x). Decompressed with the browser's native DecompressionStream so no
// external library needs to be inlined.
const b64 = document.getElementById('data-json').textContent;
const gz = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
const ds = new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip')));
const DATA = JSON.parse(await ds.text());

// ---------- sailmaker bucketing / colors ----------
const BUCKET_ORDER = ['North Sails','Doyle','Quantum','One','Sanders','Elvstrom','Other','Partial','Unknown'];
const BUCKET_COLOR = {
  'North Sails':'var(--series-north)', 'Doyle':'var(--series-doyle)', 'One':'var(--series-one)',
  'Sanders':'var(--series-sanders)', 'Quantum':'var(--series-quantum)', 'Elvstrom':'var(--series-elvstrom)',
  'Other':'var(--series-other)', 'Partial':'var(--series-partial)', 'Unknown':'var(--series-unknown)'
};
const BUCKET_TEXT = {
  'North Sails':'#fff', 'Doyle':'#292524', 'One':'#fff', 'Sanders':'#fff', 'Quantum':'#fff',
  'Elvstrom':'#fff', 'Other':'#fff', 'Partial':'#fff', 'Unknown':'var(--series-unknown-text)'
};
function bucketOf(name) {
  if (!name) return 'Unknown';
  if (BUCKET_ORDER.includes(name)) return name;
  if (name === 'Unknown') return 'Unknown';
  if (name === 'Partial') return 'Partial';
  return 'Other';
}
// Dropdown option list for Lead rep / Contacted by - the union of names
// already used anywhere in the CRM data, since there's no separate "team
// members" table. New names can still be typed into a boat's Notes field
// and added properly on the next data refresh.
function teamOptions() {
  const names = new Set();
  DATA.boats.forEach(b => { if (b.lead_rep) names.add(b.lead_rep); if (b.contacted_by) names.add(b.contacted_by); });
  return Array.from(names).sort();
}
// Bucket counts across tracked boats (unlike DATA.market_share_boats, which
// is precomputed server-side and silently drops boats with no sailmaker
// signal at all instead of bucketing them as "Unknown" - this keeps the
// Overview/Market-share totals matching the actual boat count). Defaults to
// the active fleet (last 5 seasons) - pass DATA.boats explicitly for all-time.
function boatBucketCounts(boats) {
  const counts = {};
  (boats || DATA.boats.filter(b => b.active)).forEach(b => { const bucket = bucketOf(b.current_sailmaker); counts[bucket] = (counts[bucket]||0) + 1; });
  return counts;
}
// inline style string for a sailmaker pill, incl. a border on the (near-white) Unknown pill so it stays visible
function pillStyle(name) {
  const b = bucketOf(name);
  const border = b === 'Unknown' ? `border:1px solid var(--border);` : '';
  return `background:${BUCKET_COLOR[b]};color:${BUCKET_TEXT[b]};${border}`;
}
function esc(s) { return (s===null||s===undefined) ? '' : String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtDate(iso) { return iso ? iso.slice(0,10) : ''; }

// ---------- lookups ----------
const boatsById = {}; DATA.boats.forEach(b => boatsById[b.id] = b);
const regattasById = {}; DATA.regattas.forEach(r => regattasById[r.id] = r);
const eventsById = {}; DATA.events.forEach(e => eventsById[e.id] = e);
const racesById = {}; DATA.races.forEach(r => racesById[r.id] = r);

// Entries only carry race_id (see export_dashboard_data.py for why) - these
// derive the regatta/event/season a race_entry belongs to via that FK chain,
// same information, without duplicating it onto every single entry.
function entryEvent(e) { const race = racesById[e.race_id]; return race ? eventsById[race.event_id] : null; }
function entryRegatta(e) { const ev = entryEvent(e); return ev ? regattasById[ev.regatta_id] : null; }
function entrySeasonYear(e) { const ev = entryEvent(e); return ev ? ev.season_year : null; }

// per-boat set of regatta ids / categories it has entries in, for the boats-list filter
DATA.boats.forEach(b => {
  b.regattaIds = new Set(b.entries.map(e => entryEvent(e)?.regatta_id).filter(x => x != null));
  b.regattaCategories = new Set(b.entries.map(e => entryRegatta(e)?.category).filter(x => x != null));
});

// ---------- active / inactive (last-5-season activity window) ----------
// A boat with no race entry in the last 5 seasons is treated as inactive -
// Overview/Market-share default to the active fleet, since a boat that left
// the sport years ago shouldn't count toward "current" market share.
DATA.boats.forEach(b => {
  b.lastActiveYear = null;
  b.entries.forEach(e => {
    const y = entrySeasonYear(e);
    if (y != null && (b.lastActiveYear == null || y > b.lastActiveYear)) b.lastActiveYear = y;
  });
});
let MAX_SEASON_YEAR = 0;
DATA.boats.forEach(b => { if (b.lastActiveYear != null && b.lastActiveYear > MAX_SEASON_YEAR) MAX_SEASON_YEAR = b.lastActiveYear; });
const ACTIVE_CUTOFF_YEAR = MAX_SEASON_YEAR - 4;
DATA.boats.forEach(b => { b.active = b.lastActiveYear != null && b.lastActiveYear >= ACTIVE_CUTOFF_YEAR; });

// ---------- pending edits (sailmaker / owner / TCC changes made in-browser) ----------
// The dashboard is a static file with no backend, so edits are held here (persisted to
// localStorage) and exported as a CSV to be applied to the DB via
// scripts/apply_boat_updates.py - see the "Pending changes" page.
const PENDING_KEY = 'marketshare_pending_edits_v1';
function loadPendingEdits() {
  try { return JSON.parse(localStorage.getItem(PENDING_KEY) || '{}'); }
  catch (e) { return {}; }
}
let PENDING = loadPendingEdits();
function savePendingEdits() { localStorage.setItem(PENDING_KEY, JSON.stringify(PENDING)); }
function setPendingEdit(boatId, patch) {
  const existing = PENDING[boatId] || {};
  PENDING[boatId] = { ...existing, ...patch };
  // drop keys that were cleared back to empty
  Object.keys(PENDING[boatId]).forEach(k => { if (PENDING[boatId][k] === '' || PENDING[boatId][k] == null) delete PENDING[boatId][k]; });
  if (Object.keys(PENDING[boatId]).length === 0) delete PENDING[boatId];
  savePendingEdits();
  updatePendingBadge();
}
function clearPendingEdit(boatId) { delete PENDING[boatId]; savePendingEdits(); updatePendingBadge(); }
function clearAllPendingEdits() { PENDING = {}; savePendingEdits(); updatePendingBadge(); }
function updatePendingBadge() {
  const n = Object.keys(PENDING).length + PENDING_MERGES.length;
  const badge = document.getElementById('pending-badge');
  if (badge) { badge.style.display = n ? '' : 'none'; badge.textContent = n; }
  const dupBadge = document.getElementById('duplicates-badge');
  if (dupBadge) {
    const dn = findDuplicateGroups().length;
    dupBadge.style.display = dn ? '' : 'none';
    dupBadge.textContent = dn;
  }
}
const csvEsc = v => { v = (v==null?'':String(v)); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
function pendingEditsToCSV() {
  const cols = ['SailNo', 'BoatName', 'NewSailmaker', 'NewOwner', 'NewTCC', 'NewLeadRep', 'NewContactedBy', 'Notes'];
  const lines = [cols.join(',')];
  Object.keys(PENDING).forEach(boatId => {
    const b = boatsById[boatId];
    const p = PENDING[boatId];
    if (!b) return;
    lines.push([
      csvEsc(b.sail_no), csvEsc(b.boat_name), csvEsc(p.sailmaker||''),
      csvEsc(p.owner||''), csvEsc(p.tcc||''), csvEsc(p.leadRep||''),
      csvEsc(p.contactedBy||''), csvEsc(p.notes||''),
    ].join(','));
  });
  return lines.join('\n') + '\n';
}

// ---------- pending boat merges (duplicate / rename cleanup) ----------
const MERGES_KEY = 'marketshare_pending_merges_v1';
function loadPendingMerges() {
  try { return JSON.parse(localStorage.getItem(MERGES_KEY) || '[]'); }
  catch (e) { return []; }
}
let PENDING_MERGES = loadPendingMerges();
function savePendingMerges() { localStorage.setItem(MERGES_KEY, JSON.stringify(PENDING_MERGES)); }
function addPendingMerge(keepId, mergeId, notes) {
  PENDING_MERGES = PENDING_MERGES.filter(m => m.mergeId !== mergeId); // one pending merge per boat
  PENDING_MERGES.push({ keepId, mergeId, notes: notes||'' });
  savePendingMerges();
  updatePendingBadge();
}
function removePendingMerge(mergeId) {
  PENDING_MERGES = PENDING_MERGES.filter(m => m.mergeId !== mergeId);
  savePendingMerges();
  updatePendingBadge();
}
function isPendingMergeAway(boatId) { return PENDING_MERGES.some(m => String(m.mergeId) === String(boatId)); }
function pendingMergesToCSV() {
  const lines = ['KeepSailNo,MergeSailNo,Notes'];
  PENDING_MERGES.forEach(m => {
    const keep = boatsById[m.keepId], merge = boatsById[m.mergeId];
    if (!keep || !merge) return;
    lines.push([csvEsc(keep.sail_no), csvEsc(merge.sail_no), csvEsc(m.notes)].join(','));
  });
  return lines.join('\n') + '\n';
}

// ---------- duplicate-boat detection ----------
// Heuristics only - always a human call before merging. Two signals:
//  1. identical (normalized) boat name across 2+ boat records
//  2. sail numbers that differ only by a trailing IRC endorsement letter
//     (e.g. GBR9091R vs GBR9091 - the exact pattern that prompted this feature)
function sailNoBase(s) { return (s||'').replace(/[A-Z]$/, ''); }
// Boat type strings carry a trailing IRC rating suffix that varies slightly
// between sources for the very same boat (e.g. "J 109 2.10" vs "J 109 2.08",
// "SUN FAST 3300 1.95 WB" vs "SUN FAST 3300 1.95") - strip it before comparing
// so real matches aren't missed, without being so loose it stops meaning
// anything. Boats with no type at all deliberately DON'T match each other
// (empty string only equals empty string via the caller's own name/base
// grouping, not across groups), since "no type recorded" isn't a match signal.
function normType(t) { return (t||'').toUpperCase().replace(/\s+\d+\.\d+.*$/, '').trim(); }

function findDuplicateGroups() {
  const byName = {};
  const byBase = {};
  DATA.boats.forEach(b => {
    const nameKey = (b.boat_name||'').trim().toUpperCase();
    const typeKey = normType(b.boat_type);
    if (nameKey) (byName[nameKey+'||'+typeKey] ||= []).push(b);
    const base = sailNoBase(b.sail_no);
    if (base) (byBase[base+'||'+typeKey] ||= []).push(b);
  });
  const groups = [];
  const seen = new Set();
  Object.entries(byName).forEach(([key, boats]) => {
    if (boats.length < 2) return;
    const ids = boats.map(b=>b.id).sort().join(',');
    if (seen.has(ids)) return;
    seen.add(ids);
    const typeNote = normType(boats[0].boat_type) ? ` and boat type ("${boats[0].boat_type}")` : '';
    groups.push({ key: 'name:'+key, reason: `Same boat name ("${boats[0].boat_name}")${typeNote}`, boats });
  });
  Object.entries(byBase).forEach(([key, boats]) => {
    const distinctSailNos = new Set(boats.map(b=>b.sail_no));
    if (distinctSailNos.size < 2) return;
    const ids = boats.map(b=>b.id).sort().join(',');
    if (seen.has(ids)) return;
    seen.add(ids);
    groups.push({ key: 'sailno:'+key, reason: `Sail numbers differ only by a trailing letter (${Array.from(distinctSailNos).join(' / ')}), same boat type`, boats });
  });
  const dismissed = loadDismissedDupes();
  return groups.filter(g => !dismissed.includes(g.key) && !g.boats.some(b => isPendingMergeAway(b.id)));
}
const DISMISSED_DUP_KEY = 'marketshare_dismissed_dupes_v1';
function loadDismissedDupes() { try { return JSON.parse(localStorage.getItem(DISMISSED_DUP_KEY)||'[]'); } catch(e){ return []; } }
function dismissDuplicateGroup(key) {
  const d = loadDismissedDupes();
  if (!d.includes(key)) { d.push(key); localStorage.setItem(DISMISSED_DUP_KEY, JSON.stringify(d)); }
}

// ---------- tiny SVG chart helpers ----------
function svgBarChart(items, {width=520, barHeight=22, gap=8, valueKey='entries', labelKey='sailmaker', colorFn}={}) {
  const max = Math.max(...items.map(i => i[valueKey]), 1);
  const chartW = width - 150;
  const h = items.length * (barHeight+gap);
  let bars = '';
  items.forEach((it, i) => {
    const y = i*(barHeight+gap);
    const w = Math.max(2, (it[valueKey]/max) * chartW);
    const color = colorFn(it);
    bars += `<text x="146" y="${y+barHeight/2+4}" text-anchor="end" font-size="12.5" fill="var(--text-secondary)">${esc(it[labelKey])}</text>`;
    bars += `<rect x="152" y="${y+3}" width="${w}" height="${barHeight-6}" rx="4" fill="${color}"/>`;
    bars += `<text x="${152+w+8}" y="${y+barHeight/2+4}" font-size="12.5" font-variant-numeric="tabular-nums" fill="var(--text-primary)">${it[valueKey]}</text>`;
  });
  return `<svg viewBox="0 0 ${width} ${h}" width="100%" height="${h}" role="img">${bars}</svg>`;
}

function sparkline(points, {width=560, height=90, color='var(--series-north)'}={}) {
  if (points.length === 0) return '<div class="muted">No data</div>';
  const xs = points.map(p=>p.x), ys = points.map(p=>p.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = 0, maxY = Math.max(...ys, 1);
  const pad = 28;
  const sx = x => pad + (maxX===minX ? 0 : (x-minX)/(maxX-minX)) * (width-pad*2);
  const sy = y => (height-24) - (y-minY)/(maxY-minY) * (height-44);
  const path = points.map((p,i) => `${i===0?'M':'L'}${sx(p.x).toFixed(1)},${sy(p.y).toFixed(1)}`).join(' ');
  let dots = '', labels = '';
  points.forEach(p => {
    dots += `<circle cx="${sx(p.x).toFixed(1)}" cy="${sy(p.y).toFixed(1)}" r="3.5" fill="${color}"><title>${p.x}: ${p.y}</title></circle>`;
    labels += `<text x="${sx(p.x).toFixed(1)}" y="${height-6}" font-size="10.5" text-anchor="middle" fill="var(--text-muted)">${p.x}</text>`;
    labels += `<text x="${sx(p.x).toFixed(1)}" y="${(sy(p.y)-8).toFixed(1)}" font-size="10.5" text-anchor="middle" fill="var(--text-secondary)">${p.y}</text>`;
  });
  const gridY = height-24;
  return `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}">
    <line x1="${pad}" y1="${gridY}" x2="${width-pad}" y2="${gridY}" stroke="var(--baseline)" stroke-width="1"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2"/>
    ${dots}${labels}
  </svg>`;
}

// ---------- routing ----------
// Scroll position is remembered per-hash so back/forward (and in-place
// re-renders like editing a field or merging a duplicate) return you to
// where you were instead of jumping to the top every time.
let lastHash = location.hash || '#/overview';
const SCROLL_POSITIONS = {};
function navigate() {
  SCROLL_POSITIONS[lastHash] = window.scrollY;

  const hash = location.hash || '#/overview';
  document.querySelectorAll('.nav-item').forEach(n => {
    n.classList.toggle('active', hash.startsWith(n.dataset.route));
  });
  const [_, route, arg] = hash.split('/');
  const main = document.getElementById('main');
  try {
    if (!route || route === 'overview') main.innerHTML = renderOverview();
    else if (route === 'boats') main.innerHTML = renderBoatsList();
    else if (route === 'boat') main.innerHTML = renderBoatProfile(parseInt(arg));
    else if (route === 'regattas') main.innerHTML = renderRegattasList();
    else if (route === 'regatta') main.innerHTML = renderRegattaProfile(parseInt(arg));
    else if (route === 'race') main.innerHTML = renderRacePage(parseInt(arg));
    else if (route === 'market-share') main.innerHTML = renderMarketShare();
    else if (route === 'sales') main.innerHTML = renderSales();
    else if (route === 'duplicates') main.innerHTML = renderDuplicates();
    else if (route === 'changes') main.innerHTML = renderPendingChanges();
    else main.innerHTML = renderOverview();
  } catch (err) {
    main.innerHTML = `<div class="card">Something went wrong rendering this page: ${esc(err.message)}</div>`;
    console.error(err);
  }
  attachBoatFilterHandlers();
  attachBoatEditHandlers();
  attachPendingChangesHandlers();
  attachDuplicatesHandlers();
  attachRegattaHandlers();
  attachSalesHandlers();
  updatePendingBadge();
  lastHash = hash;
  window.scrollTo(0, SCROLL_POSITIONS[hash] || 0);
}
window.addEventListener('hashchange', navigate);
document.addEventListener('click', e => {
  const el = e.target.closest('[data-route]');
  if (el && el.tagName !== 'A') { location.hash = el.dataset.route; }
});

// ---------- page: overview ----------
function renderOverview() {
  const s = DATA.stats;
  const activeBoats = DATA.boats.filter(b => b.active);
  const byBucket = boatBucketCounts(activeBoats);
  const bucketItems = BUCKET_ORDER.filter(b => byBucket[b]).map(b => ({sailmaker: b, entries: byBucket[b]}));

  // distinct boats per season, Solent regattas only, deduped (a boat racing
  // three times in a season still counts once) - built from boat-level
  // race_entries, since that's the only source with actual boat identity
  // (the aggregate historical class-count rows have no boat-level detail).
  // Limited to the last 5 seasons to match the active-fleet window used
  // everywhere else on the dashboard.
  const yearBoats = {};
  DATA.boats.forEach(b => b.entries.forEach(e => {
    const year = entrySeasonYear(e);
    if (!year || year < ACTIVE_CUTOFF_YEAR) return;
    const reg = entryRegatta(e);
    if (!reg || reg.region !== 'Solent') return;
    (yearBoats[year] ||= new Set()).add(b.id);
  }));
  const distinctPts = Object.keys(yearBoats).map(Number).sort((a,b)=>a-b).map(y => ({x:y, y:yearBoats[y].size}));

  const northPct = byBucket['North Sails'] ? Math.round(100*byBucket['North Sails']/activeBoats.length) : 0;

  return `
    <h1>Overview</h1>
    <p class="subtitle">Boat-centric race entry &amp; market-share database. Generated ${fmtDate(DATA.generated_at)}.
      Figures below cover the <strong>active fleet</strong> — boats with at least one race entry in ${ACTIVE_CUTOFF_YEAR}–${MAX_SEASON_YEAR}
      (last 5 seasons). <a href="#/boats" data-route="#/boats">${s.n_boats} boats</a> are tracked in total, including inactive ones.</p>
    <div class="stat-row">
      <div class="stat-tile"><div class="v">${activeBoats.length}</div><div class="l">Active boats (last 5 seasons)</div></div>
      <div class="stat-tile"><div class="v">${s.n_entries}</div><div class="l">Boat-level race entries (all-time)</div></div>
      <div class="stat-tile"><div class="v">${s.n_regattas}</div><div class="l">Regattas / races</div></div>
      <div class="stat-tile"><div class="v">${s.n_class_count_rows}</div><div class="l">Historical class-count records</div></div>
      <div class="stat-tile"><div class="v">${northPct}%</div><div class="l">Active boats on North Sails</div></div>
    </div>
    <div class="card-row">
      <div class="card">
        <h2>Sailmaker share — distinct boats (active fleet)</h2>
        ${svgBarChart(bucketItems, {colorFn: it => BUCKET_COLOR[it.sailmaker]})}
        <p class="muted" style="font-size:12px;margin-top:10px;">Boats active in the last 5 seasons, counted once by their most recently observed sailmaker (no signal at all = "Unknown"). "Other" groups low-volume brands (Relling, GP, UK...). <a href="#/market-share" data-route="#/market-share">Full breakdown →</a></p>
      </div>
      <div class="card">
        <h2>Solent IRC entries — last 5 seasons</h2>
        ${distinctPts.length ? sparkline(distinctPts) : '<p class="muted">No boat-level Solent entries with a season year on file yet.</p>'}
        <p class="muted" style="font-size:12px;margin-top:6px;">Distinct boats that raced at least once that season — a boat entering multiple races only counts once. <a href="#/boats" data-route="#/boats">All boats →</a></p>
      </div>
    </div>
    <div class="card">
      <h2>Where the data comes from</h2>
      <p style="margin:0 0 8px;">Boat-level entries: your JOG fleet register + entry lists (manual), plus one proof-of-concept RORC race scraped live from rorc.org's legacy results archive. Aggregate historical entry counts (2007–2026, no boat-level detail): your IRC Solent Report, covering RORC Inshore, RSYC, Round the Island, Cowes Week, Warsash, ORC Worlds/Euros, and RORC offshore races.</p>
      <p class="muted" style="font-size:12px;margin:0;">Note: the JOG entry-list sheets had no season year recorded, so they're filed under the current season (assumed) — flag to correct if wrong. See the README shipped alongside this file for the full scraping/automation notes.</p>
    </div>
  `;
}

// ---------- page: boats list ----------
function attachBoatFilterHandlers() {
  const search = document.getElementById('boat-search');
  const filter = document.getElementById('boat-filter');
  const activityFilter = document.getElementById('boat-activity-filter');
  if (!search) return;
  const catBoxes = () => Array.from(document.querySelectorAll('.cat-chip:checked'));
  const regattaBoxes = () => Array.from(document.querySelectorAll('.regatta-box:checked'));
  const apply = () => {
    const q = search.value.trim().toLowerCase();
    const f = filter.value;
    const af = activityFilter ? activityFilter.value : 'all';
    const selectedCats = new Set(catBoxes().map(b => b.value));
    const catMode = (document.querySelector('input[name=cat-mode]:checked') || {}).value || 'and';
    const selectedRegattas = new Set(regattaBoxes().map(b => parseInt(b.value)));
    const regMode = (document.querySelector('input[name=reg-mode]:checked') || {}).value || 'any';

    document.querySelectorAll('#boats-tbody tr').forEach(tr => {
      const hay = tr.dataset.hay;
      const bucket = tr.dataset.bucket;
      const b = boatsById[tr.dataset.boatId];
      let show = (!q || hay.includes(q)) && (f==='all' || bucket===f)
        && (af==='all' || (af==='active' && tr.dataset.active==='1') || (af==='inactive' && tr.dataset.active==='0'));

      if (show && selectedCats.size) {
        const cats = b.regattaCategories;
        if (catMode === 'and') { for (const c of selectedCats) if (!cats.has(c)) { show = false; break; } }
        else { show = Array.from(selectedCats).some(c => cats.has(c)); }
      }
      if (show && selectedRegattas.size) {
        const ids = b.regattaIds;
        if (regMode === 'any') show = Array.from(selectedRegattas).some(id => ids.has(id));
        else if (regMode === 'all') show = Array.from(selectedRegattas).every(id => ids.has(id));
        else if (regMode === 'only') show = ids.size > 0 && Array.from(ids).every(id => selectedRegattas.has(id));
      }
      tr.style.display = show ? '' : 'none';
    });
    const shown = document.querySelectorAll('#boats-tbody tr:not([style*="display: none"])').length;
    const countEl = document.getElementById('boat-count');
    if (countEl) countEl.textContent = shown === DATA.boats.length ? `${shown} boats` : `${shown} of ${DATA.boats.length} boats`;
  };
  search.addEventListener('input', apply);
  filter.addEventListener('change', apply);
  if (activityFilter) activityFilter.addEventListener('change', apply);
  document.querySelectorAll('.cat-chip, .regatta-box').forEach(el => el.addEventListener('change', apply));
  document.querySelectorAll('input[name=cat-mode], input[name=reg-mode]').forEach(el => el.addEventListener('change', apply));
  const clearBtn = document.getElementById('clear-regatta-filter');
  if (clearBtn) clearBtn.addEventListener('click', () => {
    document.querySelectorAll('.cat-chip, .regatta-box').forEach(el => el.checked = false);
    apply();
  });
  apply();
}

// Copy-to-clipboard + Artifact-downloads-capability (with <a download> fallback)
// wiring shared by the field-edits and boat-merges CSV exports.
function wireCsvExportButtons(copyId, dlId, boxId, filename, toCsv) {
  const copyBtn = document.getElementById(copyId);
  if (copyBtn) copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(toCsv());
      const original = copyBtn.textContent;
      copyBtn.textContent = 'Copied ✓';
      setTimeout(() => { copyBtn.textContent = original; }, 1800);
    } catch (e) {
      const box = document.getElementById(boxId);
      if (box) { box.focus(); box.select(); }
    }
  });
  const dlBtn = document.getElementById(dlId);
  if (dlBtn) dlBtn.addEventListener('click', async () => {
    const text = toCsv();
    // Prefer the Artifact "downloads" capability (a real save-file prompt);
    // fall back to a plain <a download> for when this file is opened directly
    // in a browser (not through the sandboxed Artifact viewer, which has
    // neither window.claude nor the ability to trigger its own downloads).
    let downloads = null;
    try { downloads = window.claude ? await window.claude.use('downloads') : null; } catch (e) {}
    if (downloads) {
      try {
        await downloads.save({ filename, data: text });
        const original = dlBtn.textContent;
        dlBtn.textContent = 'Saved ✓';
        setTimeout(() => { dlBtn.textContent = original; }, 1800);
      } catch (err) {
        console.error('downloads.save failed', err);
        const box = document.getElementById(boxId);
        if (box) { box.focus(); box.select(); }
      }
      return;
    }
    const a = document.createElement('a');
    a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(text);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
  });
}

// Season x Class aggregate counts for one regatta (event_class_counts, the
// only source that covers years with no boat-level breakdown). Shared by
// the regatta page render and the click-to-chart modal so both always
// agree with each other.
function getClassYearData(regattaId) {
  const evIds = new Set(DATA.events.filter(e => e.regatta_id === regattaId).map(e => e.id));
  const aggByClassYear = {}; // class -> { year: count }
  DATA.class_counts.forEach(c => {
    if (!evIds.has(c.event_id) || c.class_label.toLowerCase() === 'total') return;
    const year = eventsById[c.event_id].season_year;
    (aggByClassYear[c.class_label] ||= {})[year] = c.entry_count;
  });
  const allYears = Array.from(new Set(Object.values(aggByClassYear).flatMap(o => Object.keys(o).map(Number)))).sort((a,b)=>a-b);
  const classesWithYearData = Object.keys(aggByClassYear).sort();
  return { aggByClassYear, allYears, classesWithYearData };
}

function openClassChart(regattaId, mode, key) {

  const body = document.getElementById('chart-modal-body');

}

      <td>${esc(e.corrected_time||e.status||'')}</td>
      <td class="num">${e.points!=null ? e.points : ''}</td>
    </tr>`).join('');
  return `
    <a class="back-link" href="#/regatta/${reg.id}" data-route="#/regatta/${reg.id}">← ${esc(reg.name)}</a>
    <h1>${esc(race.race_name)}</h1>
    <p class="subtitle">${esc(reg.name)} · ${ev.season_year}${race.source_url ? ' · <a href="'+esc(race.source_url)+'" target="_blank" rel="noopener">source</a>' : ''}</p>
    <div class="card" style="padding:0;overflow:auto;">
      <table>
        <thead><tr><th>Pos</th><th>Boat</th><th>Sail No</th><th>Class</th><th class="num">TCC</th><th>Owner</th><th>Sailmaker</th><th>Corrected / status</th><th class="num">Points</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="9" class="muted">No boat-level entries on file for this race.</td></tr>'}</tbody>
      </table>
    </div>
  `;
}

// ---------- page: market share ----------
function renderMarketShare() {
  // "By race entry" is recomputed from raw entries (rather than the
  // server-precomputed all-time DATA.market_share_entries) so it can be
  // scoped to the same last-5-season active window as everything else here.
  const byBucketEntries = {};
  DATA.boats.forEach(b => b.entries.forEach(e => {
    const year = entrySeasonYear(e);
    if (year == null || year < ACTIVE_CUTOFF_YEAR || !e.sailmaker_name) return;
    const bucket = bucketOf(e.sailmaker_name);
    byBucketEntries[bucket] = (byBucketEntries[bucket]||0) + 1;
  }));
  const byBucketBoats = boatBucketCounts();
  const itemsEntries = BUCKET_ORDER.filter(b=>byBucketEntries[b]).map(b=>({sailmaker:b, entries:byBucketEntries[b]}));
  const itemsBoats = BUCKET_ORDER.filter(b=>byBucketBoats[b]).map(b=>({sailmaker:b, entries:byBucketBoats[b]}));

  const rawRows = DATA.market_share_entries.map(x => `<tr><td>${esc(x.sailmaker)}</td><td class="num">${x.entries}</td></tr>`).join('');

  return `
    <h1>Market share</h1>
    <p class="subtitle">Sailmaker share among the active fleet — boats with at least one race entry in ${ACTIVE_CUTOFF_YEAR}–${MAX_SEASON_YEAR}
      (last 5 seasons). Boats with no sailmaker recorded show as "Unknown" — that's your prospect list.</p>
    <div class="card-row">
      <div class="card">
        <h2>By distinct boat (active fleet)</h2>
        ${svgBarChart(itemsBoats, {colorFn: it => BUCKET_COLOR[it.sailmaker]})}
      </div>
      <div class="card">
        <h2>By race entry, last 5 seasons (a boat can appear more than once)</h2>
        ${svgBarChart(itemsEntries, {colorFn: it => BUCKET_COLOR[it.sailmaker]})}
      </div>
    </div>
    <div class="card" style="padding:0;overflow:auto;">
      <h2 style="padding:18px 20px 0;">Raw sailmaker labels (unbucketed, all-time)</h2>
      <table><thead><tr><th>Sailmaker (as recorded)</th><th class="num">Entries</th></tr></thead><tbody>${rawRows}</tbody></table>
    </div>
  `;
}

// ---------- page: sales opportunities ----------
function renderSales() {
  const allTargets = DATA.boats.filter(b => bucketOf(b.current_sailmaker) !== 'North Sails');
  const targets = allTargets.filter(b => b.active);
  const inactiveCount = allTargets.length - targets.length;
  targets.sort((a,b) => (b.entries.length - a.entries.length));
  const sailmakerNames = DATA.sailmakers.map(s => s.name).concat(BUCKET_ORDER).filter((v,i,a) => a.indexOf(v)===i).sort();
  const team = teamOptions();
  const selectOptions = (options, current) => `<option value="">— no change —</option>` +
    options.map(name => `<option value="${esc(name)}" ${current===name?'selected':''}>${esc(name)}</option>`).join('');

  const rows = targets.map(b => {
    const p = PENDING[b.id] || {};
    const edited = PENDING[b.id] ? '<span class="edited-flag">Edited</span>' : '';
    return `
    <tr data-boat-id="${b.id}">
      <td><a href="#/boat/${b.id}" data-route="#/boat/${b.id}">${esc(b.boat_name)}</a>${edited}</td>
      <td><input type="text" class="sales-edit-owner" data-boat-id="${b.id}" value="${esc(p.owner!=null?p.owner:(b.owner_name||''))}"></td>
      <td><select class="sales-edit-sailmaker" data-boat-id="${b.id}">${selectOptions(sailmakerNames, p.sailmaker||b.current_sailmaker)}</select></td>
      <td><select class="sales-edit-leadrep" data-boat-id="${b.id}">${selectOptions(team, p.leadRep||b.lead_rep)}</select></td>
      <td><select class="sales-edit-contactedby" data-boat-id="${b.id}">${selectOptions(team, p.contactedBy||b.contacted_by)}</select></td>
      <td class="${b.in_cs ? '' : 'tag-flag'}">${b.in_cs===1?'Yes':(b.in_cs===0?'No':'—')}</td>
      <td class="num">${b.entries.length}</td>
    </tr>`;
  }).join('');
  return `
    <h1>Sales opportunities</h1>
    <p class="subtitle">Boats not currently on North Sails (competitor-flagged, partial, or unknown), sorted by how active they are — most races entered first. ${targets.length} active boats
      (raced in ${ACTIVE_CUTOFF_YEAR}–${MAX_SEASON_YEAR}).${inactiveCount ? ` ${inactiveCount} more are inactive (no entry in the last 5 seasons) and hidden here — see <a href="#/boats" data-route="#/boats">Boats</a> and filter to Inactive to find them.` : ''}</p>
    <div class="card" style="padding:0;overflow:auto;">
      <table>
        <thead><tr><th>Boat</th><th>Owner</th><th>Current sailmaker</th><th>Lead rep</th><th>Contacted by</th><th>In CS</th><th class="num">Entries</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <footer class="note">Owner, sailmaker, lead rep and contacted-by are editable here — edits are saved locally (see <a href="#/changes" data-route="#/changes">Pending changes</a> to export and apply them). In CS is read-only, exactly as imported from your fleet register.</footer>
  `;
}

function attachSalesHandlers() {
  document.querySelectorAll('.sales-edit-owner').forEach(el => el.addEventListener('change', () => {
    setPendingEdit(el.dataset.boatId, { owner: el.value.trim() }); navigate();
  }));
  document.querySelectorAll('.sales-edit-sailmaker').forEach(el => el.addEventListener('change', () => {
    setPendingEdit(el.dataset.boatId, { sailmaker: el.value }); navigate();
  }));
  document.querySelectorAll('.sales-edit-leadrep').forEach(el => el.addEventListener('change', () => {
    setPendingEdit(el.dataset.boatId, { leadRep: el.value }); navigate();
  }));
  document.querySelectorAll('.sales-edit-contactedby').forEach(el => el.addEventListener('change', () => {
    setPendingEdit(el.dataset.boatId, { contactedBy: el.value }); navigate();
  }));
}

// one-time modal wiring - #chart-modal lives outside #main, so it's never
// re-rendered/re-bound by navigate()
document.getElementById('chart-modal-close').addEventListener('click', () => document.getElementById('chart-modal').close());
document.getElementById('chart-modal').addEventListener('click', (e) => {
  if (e.target.id === 'chart-modal') e.target.close(); // backdrop click
});

navigate();
})();
</script>
</body>
</html>
