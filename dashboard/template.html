<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketshare — Race Entry &amp; Sailmaker Tracker</title>
<style>
  :root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --surface-2:      #f1f0ec;   /* raised panels, hover, chips */
    --page:           #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --success:        #006300;
    --card-shadow:    0 1px 2px rgba(11,11,11,0.06), 0 1px 1px rgba(11,11,11,0.04);

    --series-north:    #2563eb;
    --series-doyle:    #eab308;
    --series-quantum:  #16a34a;
    --series-one:      #dc2626;
    --series-sanders:  #7c3aed;
    --series-elvstrom: #ea580c;
    --series-unknown:  #f5f5f4;
    --series-other:    #71717a;
    --series-partial:  #0d9488;
    --series-unknown-text: #292524;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --surface-2:      #262624;   /* raised panels, hover, chips */
      --page:           #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --baseline:       #383835;
      --border:         rgba(255,255,255,0.10);
      --success:        #0ca30c;
      --card-shadow:    0 1px 2px rgba(0,0,0,0.4);

      --series-north:    #4f83f1;
      --series-doyle:    #f0c33a;
      --series-quantum:  #2fbf63;
      --series-one:      #ef4444;
      --series-sanders:  #9767f0;
      --series-elvstrom: #fb7f36;
      --series-unknown:  #e7e5e4;
      --series-other:    #9a999a;
      --series-partial:  #22b6a6;
      --series-unknown-text: #1c1917;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--page);
    color: var(--text-primary);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  a { color: inherit; }
  .app { display: flex; min-height: 100vh; }

  .sidebar {
    width: 220px; flex: none; background: var(--surface-1);
    border-right: 1px solid var(--border); padding: 20px 12px;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  .brand { font-weight: 700; font-size: 15px; padding: 0 10px 18px; letter-spacing: -0.01em; }
  .brand small { display:block; color: var(--text-muted); font-weight: 500; font-size: 11px; margin-top: 2px;}
  .nav-item {
    display: block; padding: 9px 10px; border-radius: 8px; margin-bottom: 2px;
    color: var(--text-secondary); text-decoration: none; font-size: 13.5px; font-weight: 500;
    cursor: pointer;
  }
  .nav-item:hover { background: var(--gridline); color: var(--text-primary); }
  .nav-item.active { background: var(--series-north); color: white; }

  .main { flex: 1; min-width: 0; padding: 28px 36px 80px; max-width: 1180px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  h2 { font-size: 16px; margin: 0 0 14px; }
  .subtitle { color: var(--text-secondary); font-size: 13.5px; margin: 0 0 24px; }

  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap: 12px; margin-bottom: 26px; }
  .stat-tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; box-shadow: var(--card-shadow); }
  .stat-tile .v { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat-tile .l { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; box-shadow: var(--card-shadow); margin-bottom: 20px; }
  .card-row { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; align-items: start; }
  @media (max-width: 900px) { .card-row { grid-template-columns: 1fr; } }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; color: var(--text-muted); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.03em; padding: 8px 10px; border-bottom: 1px solid var(--gridline); position: sticky; top:0; background: var(--surface-1);}
  td { padding: 8px 10px; border-bottom: 1px solid var(--gridline); vertical-align: top; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: var(--gridline); }
  .num { text-align: right; font-variant-numeric: tabular-nums; }

  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; color: white; white-space: nowrap; }
  .search-row { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  input[type=text], select {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-size: 13.5px; color: var(--text-primary); font-family: inherit;
  }
  input[type=text] { flex: 1; min-width: 200px; }
  .legend { display:flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; font-size: 12.5px; color: var(--text-secondary); }
  .legend-item { display:flex; align-items:center; gap: 6px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .muted { color: var(--text-muted); }
  .back-link { display:inline-block; margin-bottom: 14px; font-size: 13px; color: var(--text-secondary); cursor:pointer; text-decoration: none;}
  .back-link:hover { color: var(--text-primary); }
  .kv { display:grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13.5px; }
  .kv dt { color: var(--text-muted); }
  .kv dd { margin: 0; }
  .tag-flag { color: var(--series-doyle); font-weight: 600; }
  footer.note { color: var(--text-muted); font-size: 11.5px; margin-top: 40px; border-top: 1px solid var(--gridline); padding-top: 14px; }
  code { background: var(--gridline); padding: 1px 5px; border-radius: 4px; font-size: 12px; }

  .nav-badge {
    display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px;
    background: var(--series-doyle); color: white; font-size: 11px; font-weight: 700;
    vertical-align: 1px;
  }
  input[type=number] {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-size: 13.5px; color: var(--text-primary); font-family: inherit; width: 100%;
  }
  label.field-label { display:block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; font-weight: 600; }
  .field { margin-bottom: 12px; }
  .field input, .field select { width: 100%; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; background: var(--series-north); color: white;
    border: none; border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn.secondary { background: var(--gridline); color: var(--text-primary); }
  .btn.danger { background: var(--series-unknown); }
  .btn-row { display:flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .edited-flag {
    display:inline-block; margin-left: 6px; font-size: 10.5px; font-weight: 700; color: var(--series-doyle);
    border: 1px solid var(--series-doyle); border-radius: 999px; padding: 1px 7px; text-transform: uppercase;
    letter-spacing: 0.03em; vertical-align: 1px;
  }
  .filter-panel summary {
    cursor: pointer; font-size: 13px; font-weight: 600; color: var(--text-secondary);
    padding: 4px 0; user-select: none;
  }
  .filter-panel summary:hover { color: var(--text-primary); }
  .filter-panel[open] summary { margin-bottom: 10px; }
  .filter-group { margin-bottom: 14px; }
  .filter-group-title { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-muted); margin-bottom: 6px; }
  .chip-row { display:flex; flex-wrap:wrap; gap: 6px; margin-bottom: 8px; }
  .chip { display:inline-flex; align-items:center; gap: 5px; background: var(--gridline); border-radius: 999px; padding: 4px 10px 4px 8px; font-size: 12.5px; cursor: pointer; user-select:none; }
  .chip input { margin: 0; }
  .mode-row { display:flex; gap: 14px; font-size: 12.5px; color: var(--text-secondary); align-items:center; }
  .mode-row label { display:flex; align-items:center; gap: 5px; cursor:pointer; }
  .regatta-checklist { max-height: 220px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .regatta-checklist .cat-heading { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin: 8px 0 4px; }
  .regatta-checklist .cat-heading:first-child { margin-top: 0; }
  .regatta-checklist label { display:flex; align-items:center; gap: 7px; font-size: 13px; padding: 3px 0; cursor: pointer; }
  textarea.csv-box {
    width: 100%; min-height: 140px; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 12px;
    background: var(--page); border: 1px solid var(--border); border-radius: 8px; padding: 10px; color: var(--text-primary);
    resize: vertical;
  }
  .banner {
    background: var(--gridline); border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px;
    display:flex; align-items:center; justify-content:space-between; gap: 10px; flex-wrap: wrap;
  }
  th.clickable-axis, td.clickable-axis {
    cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px;
  }
  th.clickable-axis:hover, td.clickable-axis:hover { color: var(--series-north); }
  /* <dialog> centers itself via a top/right/bottom/left inset trick in the UA
     stylesheet that author CSS can't cleanly override once showModal() promotes
     it to the top layer - so instead the dialog itself is a transparent,
     full-viewport flex container, and .modal-box (inside it) is the actual
     visible, centered card. */
  dialog#chart-modal[open] {
    display: flex; align-items: center; justify-content: center;
    width: 100vw; height: 100vh; max-width: 100vw; max-height: 100vh;
    margin: 0; padding: 0; border: none; background: transparent;
  }
  dialog#chart-modal::backdrop { background: rgba(0,0,0,0.5); }
  dialog#chart-modal .modal-box {
    border: 1px solid var(--border); border-radius: 12px; padding: 20px 24px 24px;
    background: var(--surface-1); color: var(--text-primary); box-shadow: var(--card-shadow);
    width: min(640px, 92vw); max-width: 92vw;
  }
  dialog#chart-modal .modal-head { display:flex; align-items:center; justify-content:space-between; gap: 16px; margin-bottom: 16px; }
  dialog#chart-modal .modal-head h2 { margin: 0; }

/* ---- regatta tree: Series > Regatta > Class ---- */
.regatta-series{padding:0;}
.regatta-series>summary.tree-series{
  display:flex;align-items:baseline;gap:12px;cursor:pointer;list-style:none;
  padding:16px 20px;font-size:19px;font-weight:600;
}
.regatta-series>summary.tree-series::-webkit-details-marker{display:none;}
.regatta-series>summary.tree-series::before{
  content:"";flex:none;width:0;height:0;
  border-left:6px solid currentColor;
  border-top:4.5px solid transparent;border-bottom:4.5px solid transparent;
  opacity:.5;transition:transform .15s ease;transform-origin:35% 50%;
}
.regatta-series[open]>summary.tree-series::before{transform:rotate(90deg);}
.tree-body{padding:0 8px 10px;}
.tree-node{border-top:1px solid var(--border);}
.tree-node>summary{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;cursor:pointer;
  list-style:none;padding:11px 12px;
}
.tree-node>summary::-webkit-details-marker{display:none;}
.tree-node>summary::before{
  content:"";flex:none;width:0;height:0;
  border-left:5px solid currentColor;
  border-top:4px solid transparent;border-bottom:4px solid transparent;
  opacity:.45;transition:transform .15s ease;transform-origin:35% 50%;
}
.tree-node[open]>summary::before{transform:rotate(90deg);}
.tree-node>summary:hover{background:var(--surface-2);}
.tree-name{font-weight:600;flex:1 1 240px;}
.tree-meta{display:flex;gap:14px;flex-wrap:wrap;align-items:center;
  font-size:12px;color:var(--text-muted);}
.tree-open{font-size:12px;font-weight:600;text-decoration:none;color:var(--series-north,#1b4f6e);
  white-space:nowrap;}
.tree-kids{display:flex;flex-direction:column;padding:2px 12px 12px 30px;gap:2px;}
.tree-leaf{
  display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;text-decoration:none;
  color:inherit;padding:6px 10px;border-radius:5px;border-left:2px solid var(--border);
}
.tree-leaf:hover{background:var(--surface-2);border-left-color:var(--series-north,#1b4f6e);}
.tree-leaf-name{font-weight:500;flex:1 1 200px;}
.tree-leaf-meta{font-size:12px;color:var(--text-muted);font-variant-numeric:tabular-nums;}
.tree-empty{padding:8px 10px;font-size:12.5px;color:var(--text-muted);margin:0;}

/* ---- contrast fix (reported: "this is white on white") ----
   --series-doyle (#eab308) is a CHART FILL, meant to sit behind dark text.
   Used as a foreground colour it gave yellow on a near-white card at 1.87:1,
   which reads as invisible; used as a badge background with white text it
   fails the same way from the other side. Both now use a contrast-safe pair:
   a dark amber for text on light, the yellow kept only as a fill under dark
   text. The dashboard themes on prefers-color-scheme, and the artifact viewer
   also stamps data-theme, so both are covered. */
:root { --flag-text: #8A5A00; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --flag-text: #F0C33A; }
}
:root[data-theme="dark"] { --flag-text: #F0C33A; }
:root[data-theme="light"] { --flag-text: #8A5A00; }
.tag-flag { color: var(--flag-text); }
.nav-badge { color: #292524; }

/* Sales rows stage their edits; Save commits them. */
.sales-save-cell { white-space: nowrap; }
.sales-save { padding: 5px 12px; font-size: 12px; }
.sales-save[disabled] { opacity: .55; cursor: default; }
tr.sales-dirty > td { background: var(--surface-2); }
tr.sales-dirty > td:first-child { box-shadow: inset 3px 0 0 var(--series-doyle); }
tr.sales-saved > td:first-child { box-shadow: inset 3px 0 0 var(--series-quantum); }

/* deeper tree: Club > Year > Event > Class > boat */
.tree-year > summary .tree-name { font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.tree-year > .tree-kids { padding-left: 18px; }
.tree-class > summary .tree-name { font-weight: 500; }
.tree-class > .tree-kids { padding-left: 18px; }
.tree-boats { max-height: 420px; overflow-y: auto; }
.tree-boats .tree-leaf { display: grid; grid-template-columns: minmax(120px,1.4fr) minmax(100px,1.2fr) minmax(90px,1fr) auto;
  gap: 10px; align-items: baseline; }
@media (max-width: 640px) { .tree-boats .tree-leaf { grid-template-columns: 1fr; gap: 2px; } }

.analysis-filters { display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end; }
.analysis-filters label { display:flex; flex-direction:column; gap:4px; font-size:12px;
  color:var(--text-muted); font-weight:600; }
.analysis-filters select { min-width:130px; }
.callout-warn { background:var(--surface-1); border:1px solid var(--border);
  border-left:3px solid var(--series-doyle); border-radius:0 8px 8px 0;
  padding:12px 16px; margin-bottom:14px; font-size:13px; color:var(--text-secondary); }
.callout-warn strong { color:var(--text-primary); }

/* boat page: a regatta opens to that boat's own races */
.boat-regatta { border-top: 1px solid var(--border); }
.boat-regatta > summary {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  cursor: pointer; list-style: none; padding: 10px 8px;
}
.boat-regatta > summary::-webkit-details-marker { display: none; }
.boat-regatta > summary::before {
  content: ""; flex: none; width: 0; height: 0;
  border-left: 5px solid currentColor;
  border-top: 4px solid transparent; border-bottom: 4px solid transparent;
  opacity: .45; transition: transform .15s ease; transform-origin: 35% 50%;
}
.boat-regatta[open] > summary::before { transform: rotate(90deg); }
.boat-regatta > summary:hover { background: var(--surface-2); }
.br-name { font-weight: 600; flex: 1 1 200px; }
.br-year { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums;
  font-size: 12.5px; color: var(--text-muted); }
.br-meta { font-size: 12px; color: var(--text-muted); }
.br-open { font-size: 12px; font-weight: 600; text-decoration: none;
  color: var(--series-north); white-space: nowrap; margin-left: auto; }
.boat-races { display: flex; flex-direction: column; gap: 2px; padding: 2px 8px 10px 26px; }
.boat-race {
  display: grid; grid-template-columns: minmax(120px,1.5fr) minmax(80px,1fr) 70px 1fr 1fr;
  gap: 10px; align-items: baseline; text-decoration: none; color: inherit;
  padding: 5px 10px; border-radius: 5px; border-left: 2px solid var(--border);
}
.boat-race:hover { background: var(--surface-2); border-left-color: var(--series-north); }
.boat-race-name { font-weight: 500; }
.boat-race-meta { font-size: 12px; color: var(--text-muted);
  font-variant-numeric: tabular-nums; }
@media (max-width: 640px) { .boat-race { grid-template-columns: 1fr; gap: 2px; } }

/* the organiser's published entry total, where we hold no named boats for it */
.tree-reported { color: var(--text-muted); font-style: italic; opacity: .85; }

/* real dropdowns in the boats table, coloured like the pill they replaced */
.sm-select {
  font: inherit; font-size: 12px; font-weight: 600;
  border-radius: 999px; padding: 2px 22px 2px 10px;
  border: 1px solid transparent; cursor: pointer; max-width: 150px;
  appearance: none; -webkit-appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%),
                    linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 12px) 52%, calc(100% - 8px) 52%;
  background-size: 4px 4px, 4px 4px;
  background-repeat: no-repeat;
}
.sm-select:hover { border-color: currentColor; }
.sm-select:focus { outline: 2px solid var(--series-north); outline-offset: 1px; }
.sm-select option { font-weight: 400; color: var(--text-primary); background: var(--surface-1); }

/* a blank branch says why it is blank */
.tree-why { display: block; margin-top: 4px; font-size: 12px;
  color: var(--text-muted); line-height: 1.45; }
.tree-why strong { color: var(--text-secondary); }

/* entry-list drop zone */
.drop-zone { border: 2px dashed var(--border); border-radius: 10px; padding: 22px;
  text-align: center; background: var(--surface-1); transition: border-color .15s, background .15s; }
.drop-zone.drag { border-color: var(--series-north); background: var(--surface-2); }
tr.enrich-miss > td { background: var(--surface-2); }
tr.enrich-miss > td:first-child { box-shadow: inset 3px 0 0 var(--series-doyle); }

/* market share at every level of the regatta tree */
.share-wrap { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.share-bar { display: inline-flex; width: 54px; height: 7px; border-radius: 4px;
  overflow: hidden; background: var(--surface-2); flex: none; }
.share-bar i { display: block; height: 100%; }
.sb-north   { background: var(--series-north); }
.sb-other   { background: var(--series-doyle); }
.sb-unknown { background: var(--border); }
.share-text { font-size: 11.5px; color: var(--text-secondary);
  font-variant-numeric: tabular-nums; }
.share-unknown { color: var(--text-muted); }
.share-none { color: var(--text-muted); font-style: italic; }
.tree-series .share-wrap { margin-left: 10px; }
@media (max-width: 720px) { .share-text { display: none; } }
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar" id="sidebar">
    <div class="brand">Marketshare<small>Race entry &amp; sailmaker tracker</small></div>
    <a class="nav-item" href="#/overview" data-route="#/overview">Overview</a>
    <a class="nav-item" href="#/boats" data-route="#/boats">Boats</a>
    <a class="nav-item" href="#/regattas" data-route="#/regattas">Regattas</a>
    <a class="nav-item" href="#/compare" data-route="#/compare">Compare</a>
    <a class="nav-item" href="#/coverage" data-route="#/coverage">Coverage</a>
    <a class="nav-item" href="#/analysis" data-route="#/analysis">Analysis</a>
    <a class="nav-item" href="#/market-analysis" data-route="#/market-analysis">Market analysis</a>
    <a class="nav-item" href="#/market-share" data-route="#/market-share">Market share</a>
    <a class="nav-item" href="#/sales" data-route="#/sales">Sales opportunities</a>
    <a class="nav-item" href="#/enrich" data-route="#/enrich">Entry list</a>
    <a class="nav-item" href="#/duplicates" data-route="#/duplicates">Duplicates<span class="nav-badge" id="duplicates-badge" style="display:none;"></span></a>
    <a class="nav-item" href="#/quality" data-route="#/quality">Data quality</a>
    <a class="nav-item" href="#/changes" data-route="#/changes">Pending changes<span class="nav-badge" id="pending-badge" style="display:none;"></span></a>
  </nav>
  <main class="main" id="main"><div class="card muted">Loading…</div></main>
  <dialog id="chart-modal">
    <div class="modal-box">
      <div class="modal-head">
        <h2 id="chart-modal-title"></h2>
        <button class="btn secondary" type="button" id="chart-modal-close">Close</button>
      </div>
      <div id="chart-modal-body"></div>
    </div>
  </dialog>
</div>
<script id="data-json" type="text/plain">/*__DATA_JSON_B64GZ__*/</script>
<script>
(async () => {
// The embedded payload is the dataset JSON, gzip-compressed then base64-encoded
// (raw JSON at this scale is tens of MB of highly repetitive text; gzip shrinks
// it ~15-18x). Decompressed with the browser's native DecompressionStream so no
// external library needs to be inlined.
const b64 = document.getElementById('data-json').textContent;
const gz = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
const ds = new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip')));
const DATA = JSON.parse(await ds.text());

// ---------- sailmaker bucketing / colors ----------
const BUCKET_ORDER = ['North Sails','Doyle','Quantum','One','Sanders','Elvstrom','Other','Partial','Unknown'];
const BUCKET_COLOR = {
  'North Sails':'var(--series-north)', 'Doyle':'var(--series-doyle)', 'One':'var(--series-one)',
  'Sanders':'var(--series-sanders)', 'Quantum':'var(--series-quantum)', 'Elvstrom':'var(--series-elvstrom)',
  'Other':'var(--series-other)', 'Partial':'var(--series-partial)', 'Unknown':'var(--series-unknown)'
};
// Text colour per bucket. Yellow and green are light fills: white on them
// measures 1.9:1 and 2.4:1, which is unreadable, so both take dark text.
const BUCKET_TEXT = {
  'North Sails':'#fff', 'Doyle':'#292524', 'One':'#fff', 'Sanders':'#fff', 'Quantum':'#292524',
  'Elvstrom':'#fff', 'Other':'#fff', 'Partial':'#fff', 'Unknown':'var(--series-unknown-text)'
};
function bucketOf(name) {
  if (!name) return 'Unknown';
  if (BUCKET_ORDER.includes(name)) return name;
  if (name === 'Unknown') return 'Unknown';
  if (name === 'Partial') return 'Partial';
  return 'Other';
}
// Dropdown option list for Lead rep / Contacted by - the union of names
// already used anywhere in the CRM data, since there's no separate "team
// members" table. New names can still be typed into a boat's Notes field
// and added properly on the next data refresh.
function teamOptions() {
  const names = new Set();
  DATA.boats.forEach(b => { if (b.lead_rep) names.add(b.lead_rep); if (b.contacted_by) names.add(b.contacted_by); });
  return Array.from(names).sort();
}
// Bucket counts across tracked boats (unlike DATA.market_share_boats, which
// is precomputed server-side and silently drops boats with no sailmaker
// signal at all instead of bucketing them as "Unknown" - this keeps the
// Overview/Market-share totals matching the actual boat count). Defaults to
// the active fleet (last 5 seasons) - pass DATA.boats explicitly for all-time.
function boatBucketCounts(boats) {
  const counts = {};
  (boats || DATA.boats.filter(b => b.active)).forEach(b => { const bucket = bucketOf(liveSailmaker(b)); counts[bucket] = (counts[bucket]||0) + 1; });
  return counts;
}
// inline style string for a sailmaker pill, incl. a border on the (near-white) Unknown pill so it stays visible
function pillStyle(name) {
  const b = bucketOf(name);
  const border = b === 'Unknown' ? `border:1px solid var(--border);` : '';
  return `background:${BUCKET_COLOR[b]};color:${BUCKET_TEXT[b]};${border}`;
}
// Search normalisation. Sources spell the same boat type every possible way -
// "J/111", "J111", "J 111", "J-111" all occur - so a literal substring match
// makes the answer depend on which spelling the user happens to guess, and
// "J 111" matched nothing at all. Two passes: one keeping word boundaries (so
// "mike moxley" still works) and one collapsing everything to alphanumerics
// (so "j 111", "j/111" and "j111" are the same query).
function searchKeep(s) {
  return (s || '').toLowerCase().replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
}
function searchTight(s) {
  return (s || '').toLowerCase().replace(/[^a-z0-9]+/g, '');
}
function matchesSearch(hayKeep, hayTight, q) {
  if (!q) return true;
  const k = searchKeep(q), t = searchTight(q);
  return (k && hayKeep.includes(k)) || (t && hayTight.includes(t));
}

// A boat's sailmaker as it stands RIGHT NOW, including edits made in this
// browser that have not yet been exported and applied to the database. Without
// this, changing a sailmaker on a boat left every share figure showing the old
// value until the CSV round-trip had been run, which made the analysis look
// stale and wrong at exactly the moment someone had just corrected it.
function liveSailmaker(b) {
  if (!b) return null;
  const p = PENDING[b.id];
  return (p && p.sailmaker) || b.current_sailmaker || null;
}

function esc(s) { return (s===null||s===undefined) ? '' : String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtDate(iso) { return iso ? iso.slice(0,10) : ''; }

// ---------- lookups ----------
const boatsById = {}; DATA.boats.forEach(b => boatsById[b.id] = b);
const regattasById = {}; DATA.regattas.forEach(r => regattasById[r.id] = r);
const eventsById = {}; DATA.events.forEach(e => eventsById[e.id] = e);
const racesById = {}; DATA.races.forEach(r => racesById[r.id] = r);

// Entries only carry race_id (see export_dashboard_data.py for why) - these
// derive the regatta/event/season a race_entry belongs to via that FK chain,
// same information, without duplicating it onto every single entry.
function entryEvent(e) { const race = racesById[e.race_id]; return race ? eventsById[race.event_id] : null; }
function entryRegatta(e) { const ev = entryEvent(e); return ev ? regattasById[ev.regatta_id] : null; }
function entrySeasonYear(e) { const ev = entryEvent(e); return ev ? ev.season_year : null; }

// Roll a boat's race entries up into one row per regatta-season - the unit a
// campaign is actually planned and sold in. Individual races stay available
// on the regatta page rather than flooding the boat profile.
function boatRegattaEntries(boat) {
  const byKey = new Map();
  boat.entries.forEach(e => {
    const ev = entryEvent(e);
    if (!ev) return;
    const key = ev.regatta_id + '|' + ev.season_year;
    let g = byKey.get(key);
    if (!g) {
      g = { regattaId: ev.regatta_id, year: ev.season_year,
            regattaName: (regattasById[ev.regatta_id] || {}).name || '—',
            classes: new Set(), races: 0, best: null, sailmaker: null,
            entries: [] };   // the individual races, so a boat page can reach them
      byKey.set(key, g);
    }
    g.races++;
    g.entries.push(e);
    if (e.class) g.classes.add(e.class);
    // finishing positions only - DNF/DNC/RET and the like aren't placings
    const pos = parseInt(e.position, 10);
    if (!isNaN(pos) && pos > 0 && (g.best === null || pos < g.best)) g.best = pos;
    if (!g.sailmaker && e.sailmaker_name) g.sailmaker = e.sailmaker_name;
  });
  return Array.from(byKey.values())
    .sort((a, b) => (b.year || 0) - (a.year || 0) || a.regattaName.localeCompare(b.regattaName));
}

// per-boat set of regatta ids / categories it has entries in, for the boats-list filter
DATA.boats.forEach(b => {
  b.regattaIds = new Set(b.entries.map(e => entryEvent(e)?.regatta_id).filter(x => x != null));
  b.regattaCategories = new Set(b.entries.map(e => entryRegatta(e)?.category).filter(x => x != null));
});

// ---------- active / inactive (last-5-season activity window) ----------
// A boat with no race entry in the last 5 seasons is treated as inactive -
// Overview/Market-share default to the active fleet, since a boat that left
// the sport years ago shouldn't count toward "current" market share.
DATA.boats.forEach(b => {
  b.lastActiveYear = null;
  b.entries.forEach(e => {
    const y = entrySeasonYear(e);
    if (y != null && (b.lastActiveYear == null || y > b.lastActiveYear)) b.lastActiveYear = y;
  });
});
let MAX_SEASON_YEAR = 0;
DATA.boats.forEach(b => { if (b.lastActiveYear != null && b.lastActiveYear > MAX_SEASON_YEAR) MAX_SEASON_YEAR = b.lastActiveYear; });
const ACTIVE_CUTOFF_YEAR = MAX_SEASON_YEAR - 4;
DATA.boats.forEach(b => { b.active = b.lastActiveYear != null && b.lastActiveYear >= ACTIVE_CUTOFF_YEAR; });

// ---------- pending edits (sailmaker / owner / TCC changes made in-browser) ----------
// The dashboard is a static file with no backend, so edits are held here (persisted to
// localStorage) and exported as a CSV to be applied to the DB via
// scripts/apply_boat_updates.py - see the "Pending changes" page.
const PENDING_KEY = 'marketshare_pending_edits_v1';
function loadPendingEdits() {
  try { return JSON.parse(localStorage.getItem(PENDING_KEY) || '{}'); }
  catch (e) { return {}; }
}
let PENDING = loadPendingEdits();
function savePendingEdits() { localStorage.setItem(PENDING_KEY, JSON.stringify(PENDING)); }
function setPendingEdit(boatId, patch) {
  const existing = PENDING[boatId] || {};
  PENDING[boatId] = { ...existing, ...patch };
  // drop keys that were cleared back to empty
  Object.keys(PENDING[boatId]).forEach(k => { if (PENDING[boatId][k] === '' || PENDING[boatId][k] == null) delete PENDING[boatId][k]; });
  if (Object.keys(PENDING[boatId]).length === 0) delete PENDING[boatId];
  savePendingEdits();
  updatePendingBadge();
}
function clearPendingEdit(boatId) { delete PENDING[boatId]; savePendingEdits(); updatePendingBadge(); }
function clearAllPendingEdits() { PENDING = {}; savePendingEdits(); updatePendingBadge(); }
function updatePendingBadge() {
  // Count only work still OUTSTANDING. An edit that has already been applied to
  // the database is done, and leaving it in the badge meant the number never
  // cleared - it just counted everything ever edited in this browser.
  const outstandingEdits = Object.keys(PENDING).filter(id => {
    const b = boatsById[id];
    return !b || !pendingApplied(b, PENDING[id]);
  }).length;
  // a merge is done once the merged-away boat is gone from the data
  const outstandingMerges = PENDING_MERGES.filter(m => boatsById[m.mergeId]).length;
  const outstandingTimelines = Object.keys(OWNER_TIMELINES || {}).length;
  const n = outstandingEdits + outstandingMerges + outstandingTimelines;
  const badge = document.getElementById('pending-badge');
  if (badge) { badge.style.display = n ? '' : 'none'; badge.textContent = n; }
  const dupBadge = document.getElementById('duplicates-badge');
  if (dupBadge) {
    const dn = findDuplicateGroups().length;
    dupBadge.style.display = dn ? '' : 'none';
    dupBadge.textContent = dn;
  }
}
const csvEsc = v => { v = (v==null?'':String(v)); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
function pendingEditsToCSV() {
  const cols = ['SailNo', 'BoatName', 'NewSailmaker', 'NewPartialSailmaker', 'NewOwner', 'NewTCC', 'NewLeadRep', 'NewContactedBy', 'Notes'];
  const lines = [cols.join(',')];
  Object.keys(PENDING).forEach(boatId => {
    const b = boatsById[boatId];
    const p = PENDING[boatId];
    if (!b) return;

      csvEsc(b.sail_no), csvEsc(b.boat_name), csvEsc(p.sailmaker||''),
      csvEsc(p.partialSailmaker||''),
      csvEsc(p.owner||''), csvEsc(p.tcc||''), csvEsc(p.leadRep||''),
      csvEsc(p.contactedBy||''), csvEsc(p.notes||''),
    ].join(','));
  });
  return lines.join('\n') + '\n';
}

// ---------- pending ownership-timeline edits ----------
// Ownership is inferred from whoever a results page printed in the owner
// column, and results pages print whoever entered the boat - the manager, the
// charterer, a co-skipper. 248 timelines show a one-season owner sandwiched
// between the same owner either side, and no rule can tell which of those is a
// typo, which is a stand-in and which is a real sale. Only a person can.
//
// So a timeline is edited as a WHOLE: the rows you leave behind are the
// timeline. That is easier to reason about than a list of patches, and it is
// what the apply script writes - the boat's history is replaced by exactly
// what is here, marked as manual, which is true: a human said so.
const OWNER_TL_KEY = 'marketshare_owner_timelines_v1';
function loadOwnerTimelines() {
  try { return JSON.parse(localStorage.getItem(OWNER_TL_KEY) || '{}'); }
  catch (e) { return {}; }
}
let OWNER_TIMELINES = loadOwnerTimelines();
function saveOwnerTimelines() {
  localStorage.setItem(OWNER_TL_KEY, JSON.stringify(OWNER_TIMELINES));
  updatePendingBadge();
}
function setOwnerTimeline(boatId, rows) {
  if (!rows || !rows.length) delete OWNER_TIMELINES[boatId];
  else OWNER_TIMELINES[boatId] = rows;
  saveOwnerTimelines();
}
function clearOwnerTimeline(boatId) { delete OWNER_TIMELINES[boatId]; saveOwnerTimelines(); }
function ownerTimelinesToCSV() {
  const lines = ['SailNo,BoatName,Seq,OwnerName,FromYear,ToYear,Charter'];
  Object.keys(OWNER_TIMELINES).forEach(boatId => {
    const b = boatsById[boatId];
    if (!b) return;
    OWNER_TIMELINES[boatId].forEach((r, i) => {
      lines.push([csvEsc(b.sail_no), csvEsc(b.boat_name), i + 1, csvEsc(r.owner),
                  csvEsc(r.from || ''), csvEsc(r.to || ''),
                  r.charter ? 'yes' : ''].join(','));
    });
  });
  return lines.join('\n') + '\n';
}

// Everything a thorough look at one boat's ownership needs, in one block. The
// dashboard is a static file and cannot ask anybody anything; what it CAN do
// is assemble the question so that no digging is needed to answer it.
function boatResearchPrompt(b) {
  const seasons = {};
  b.entries.forEach(e => {
    const ra = racesById[e.race_id]; if (!ra) return;
    const ev = eventsById[ra.event_id]; if (!ev) return;
    const rg = regattasById[ev.regatta_id] || {};
    const y = ev.season_year || '?';
    const key = [y, rg.name || '?', e.owner_name_used || '', e.skipper_name_used || '',
                 e.boat_name_used || '', e.tcc || ''].join('|');
    seasons[key] = (seasons[key] || 0) + 1;
  });
  const rows = Object.keys(seasons).sort().map(k => {
    const [y, rg, own, skip, nm, tcc] = k.split('|');
    return `  ${y}  ${rg}  entered as "${nm}"` +
           (own ? `, owner printed "${own}"` : '') +
           (skip && skip !== own ? `, skipper "${skip}"` : '') +
           (tcc ? `, TCC ${tcc}` : '') + `  (${seasons[k]} entries)`;
  });
  const tl = (b.owner_history || []).slice().sort((x, y) =>
      String(x.effective_from || '').localeCompare(String(y.effective_from || '')))
    .map(h => `  ${h.effective_from || '?'} - ${h.effective_to || 'present'}  ${h.owner_name || '?'}` +
              (h.is_charter ? '  [recorded as a charter]' : '') +
              (h.confidence ? `  (${h.confidence})` : ''));
  return [
    `Please work out the ownership history of this boat and give me a corrected timeline.`,
    ``,
    `BOAT`,
    `  Name: ${b.boat_name || '?'}`,
    `  Sail number: ${b.sail_no || '?'}`,
    `  Type: ${b.boat_type || 'unknown'}${b.tcc ? `, TCC ${b.tcc}` : ''}`,
    `  Currently recorded owner: ${b.owner_name || 'none'}`,
    ``,
    `TIMELINE WE HOLD (inferred from results pages, so it may be wrong)`,
    ...(tl.length ? tl : ['  none']),
    ``,
    `WHAT THE RESULTS ACTUALLY PRINTED, season by season`,
    ...(rows.length ? rows : ['  no entries on file']),
    ``,
    `WHY THIS IS UNRELIABLE`,
    `  Ownership here is inferred from whoever a results page printed in its owner`,
    `  column. Those pages print whoever entered the boat, which is often the boat`,
    `  captain, the programme manager, a charter operator or a co-skipper rather`,
    `  than the owner. A one-season name sitting between the same owner either`,
    `  side is usually one of those, or a spelling variant, not a sale.`,
    ``,
    `WHAT I NEED BACK`,
    `  A timeline of real OWNERS with year ranges, and for each row say whether it`,
    `  is an owner, a charter/corporate entry, or the same person under a different`,
    `  spelling. Flag anything you are unsure of rather than guessing. Give it as`,
    `  CSV with these columns so it can be loaded straight back:`,
    `  SailNo,BoatName,Seq,OwnerName,FromYear,ToYear,Charter`,
  ].join('\n');
}

function addPendingMerge(keepId, mergeId, notes) {
