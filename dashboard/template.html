// ---------- duplicate-boat detection ----------
// Heuristics only - always a human call before merging. Two signals:
//  1. identical (normalized) boat name across 2+ boat records
//  2. sail numbers that differ only by trailing IRC endorsement letter(s)
//     (e.g. GBR9091R vs GBR9091, or GBR8368RC vs GBR8368 - one boat's sail
//     number gaining/losing an endorsement suffix over time)
// Both paths require a matching, KNOWN boat type as corroboration. A blank/
// unrecorded type is deliberately never treated as a match signal - it's not
// evidence the boats are the same, so pairs where neither side has a real
// type on file are excluded rather than surfaced as low-confidence noise.
function sailNoBase(s) { return (s||'').replace(/[A-Z]+$/, ''); }
// Boat type strings carry a trailing IRC rating suffix that varies slightly
// between sources for the very same boat (e.g. "J 109 2.10" vs "J 109 2.08",
// "SUN FAST 3300 1.95 WB" vs "SUN FAST 3300 1.95") - strip it before comparing
// so real matches aren't missed, without being so loose it stops meaning
// anything.
function normType(t) { return (t||'').toUpperCase().replace(/\s+\d+\.\d+.*$/, '').trim(); }

function findDuplicateGroups() {
  const byName = {};
  const byBase = {};
  DATA.boats.forEach(b => {
    const nameKey = (b.boat_name||'').trim().toUpperCase();
    const typeKey = normType(b.boat_type);
    if (!typeKey) return; // no recorded type = no corroborating signal, skip entirely
    if (nameKey) (byName[nameKey+'||'+typeKey] ||= []).push(b);
    const base = sailNoBase(b.sail_no);
    if (base) (byBase[base+'||'+typeKey] ||= []).push(b);
  });
  const groups = [];
  const seen = new Set();
  Object.entries(byName).forEach(([key, boats]) => {
    if (boats.length < 2) return;
    const ids = boats.map(b=>b.id).sort().join(',');
    if (seen.has(ids)) return;
    seen.add(ids);
    groups.push({ key: 'name:'+key, reason: `Same boat name ("${boats[0].boat_name}") and boat type ("${boats[0].boat_type}")`, boats });
  });
  Object.entries(byBase).forEach(([key, boats]) => {
    const distinctSailNos = new Set(boats.map(b=>b.sail_no));
    if (distinctSailNos.size < 2) return;
    const ids = boats.map(b=>b.id).sort().join(',');
    if (seen.has(ids)) return;
    seen.add(ids);
    groups.push({ key: 'sailno:'+key, reason: `Sail numbers differ only by trailing letter(s) (${Array.from(distinctSailNos).join(' / ')}), same boat type ("${boats[0].boat_type}")`, boats });
  });
  const dismissed = loadDismissedDupes();
  return groups.filter(g => !dismissed.includes(g.key) && !g.boats.some(b => isPendingMergeAway(b.id)));
}
const DISMISSED_DUP_KEY = 'marketshare_dismissed_dupes_v1';
function loadDismissedDupes() { try { return JSON.parse(localStorage.getItem(DISMISSED_DUP_KEY)||'[]'); } catch(e){ return []; } }
function dismissDuplicateGroup(key) {
  const d = loadDismissedDupes();
  if (!d.includes(key)) { d.push(key); localStorage.setItem(DISMISSED_DUP_KEY, JSON.stringify(d)); }
}

// ---------- tiny SVG chart helpers ----------
function svgBarChart(items, {width=520, barHeight=22, gap=8, valueKey='entries', labelKey='sailmaker', colorFn}={}) {
  const max = Math.max(...items.map(i => i[valueKey]), 1);
  const chartW = width - 150;
  const h = items.length * (barHeight+gap);
  let bars = '';
  items.forEach((it, i) => {
    const y = i*(barHeight+gap);
    const w = Math.max(2, (it[valueKey]/max) * chartW);
    const color = colorFn(it);
    bars += `<text x="146" y="${y+barHeight/2+4}" text-anchor="end" font-size="12.5" fill="var(--text-secondary)">${esc(it[labelKey])}</text>`;
    bars += `<rect x="152" y="${y+3}" width="${w}" height="${barHeight-6}" rx="4" fill="${color}"/>`;
    bars += `<text x="${152+w+8}" y="${y+barHeight/2+4}" font-size="12.5" font-variant-numeric="tabular-nums" fill="var(--text-primary)">${it[valueKey]}</text>`;
  });
  return `<svg viewBox="0 0 ${width} ${h}" width="100%" height="${h}" role="img">${bars}</svg>`;
}

// Colours for overlaying several regattas on one axis. Deliberately not the
// sailmaker palette - these mean "series N", not "North Sails".
const LINE_COLOURS = ['#2563eb','#ea580c','#16a34a','#7c3aed','#dc2626','#0d9488','#a16207','#db2777'];

// Multi-series line chart on a shared year axis. Each series is
// {label, points:[{x,y,solid}]}; solid:false draws the marker hollow, which is
// how an aggregate-only season is distinguished from a counted-boats one.
function svgLineChart(series, {width=760, height=280, yLabel='Boats'}={}) {
  const all = series.flatMap(s => s.points);
  if (!all.length) return '<div class="muted">No data to plot.</div>';
  const xs = all.map(p=>p.x), ys = all.map(p=>p.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const maxY = Math.max(...ys, 1);
  const padL = 46, padR = 14, padT = 14, padB = 34;
  const sx = x => padL + (maxX===minX ? (width-padL-padR)/2 : (x-minX)/(maxX-minX)*(width-padL-padR));
  const sy = y => (height-padB) - (y/maxY)*(height-padT-padB);

  // y gridlines at 4 steps, rounded to something readable
  const step = Math.max(1, Math.ceil(maxY/4/10)*10 || Math.ceil(maxY/4));
  let grid = '';
  for (let v=0; v<=maxY; v+=step) {
    grid += `<line x1="${padL}" y1="${sy(v).toFixed(1)}" x2="${width-padR}" y2="${sy(v).toFixed(1)}"
             stroke="var(--baseline)" stroke-width="1" opacity="0.5"/>
             <text x="${padL-6}" y="${(sy(v)+4).toFixed(1)}" font-size="11" text-anchor="end"
             fill="var(--text-muted)">${v}</text>`;
  }
  const years = Array.from(new Set(xs)).sort((a,b)=>a-b);
  const tickEvery = Math.ceil(years.length/10) || 1;
  let xlab = '';
  years.forEach((y,i) => { if (i % tickEvery === 0)
    xlab += `<text x="${sx(y).toFixed(1)}" y="${height-12}" font-size="11" text-anchor="middle" fill="var(--text-muted)">${y}</text>`; });

  let body = '';
  series.forEach((s, i) => {
    const c = s.color || LINE_COLOURS[i % LINE_COLOURS.length];
    const pts = s.points.slice().sort((a,b)=>a.x-b.x);
    const d = pts.map((p,j) => `${j?'L':'M'}${sx(p.x).toFixed(1)},${sy(p.y).toFixed(1)}`).join(' ');
    // A dashed series is a DIFFERENT measure, not another subject - the
    // reported entry total beside the boats we actually hold results for.
    const dash = s.dashed ? ' stroke-dasharray="6 4"' : '';
    body += `<path d="${d}" fill="none" stroke="${c}" stroke-width="2.2" stroke-linejoin="round"${dash}/>`;
    pts.forEach(p => {
      body += `<circle cx="${sx(p.x).toFixed(1)}" cy="${sy(p.y).toFixed(1)}" r="4"
        fill="${p.solid === false ? 'var(--surface-1)' : c}" stroke="${c}" stroke-width="2">
        <title>${esc(s.label)} — ${p.x}: ${p.y}${p.solid === false ? ' (aggregate)' : ''}</title></circle>`;
    });
  });

  const legend = series.map((s,i) => {
    const c = s.color || LINE_COLOURS[i % LINE_COLOURS.length];
    return `<span style="display:inline-flex;align-items:center;gap:6px;margin-right:14px;font-size:12.5px;">
      <span style="width:14px;height:3px;display:inline-block;border-radius:2px;${
        s.dashed ? `background:repeating-linear-gradient(90deg,${c} 0 5px,transparent 5px 8px);` : `background:${c};`}"></span>
      ${esc(s.label)}</span>`;
  }).join('');

  return `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}" role="img">
      ${grid}${xlab}${body}
      <text x="10" y="${padT+2}" font-size="11" fill="var(--text-muted)">${esc(yLabel)}</text>
    </svg>
    <div style="margin-top:8px;">${legend}</div>`;
}

function sparkline(points, {width=560, height=90, color='var(--series-north)'}={}) {
  if (points.length === 0) return '<div class="muted">No data</div>';
  const xs = points.map(p=>p.x), ys = points.map(p=>p.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = 0, maxY = Math.max(...ys, 1);
  const pad = 28;
  const sx = x => pad + (maxX===minX ? 0 : (x-minX)/(maxX-minX)) * (width-pad*2);
  const sy = y => (height-24) - (y-minY)/(maxY-minY) * (height-44);
  const path = points.map((p,i) => `${i===0?'M':'L'}${sx(p.x).toFixed(1)},${sy(p.y).toFixed(1)}`).join(' ');
  let dots = '', labels = '';
  points.forEach(p => {
    dots += `<circle cx="${sx(p.x).toFixed(1)}" cy="${sy(p.y).toFixed(1)}" r="3.5" fill="${color}"><title>${p.x}: ${p.y}</title></circle>`;
    labels += `<text x="${sx(p.x).toFixed(1)}" y="${height-6}" font-size="10.5" text-anchor="middle" fill="var(--text-muted)">${p.x}</text>`;
    labels += `<text x="${sx(p.x).toFixed(1)}" y="${(sy(p.y)-8).toFixed(1)}" font-size="10.5" text-anchor="middle" fill="var(--text-secondary)">${p.y}</text>`;
  });
  const gridY = height-24;
  return `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}">
    <line x1="${pad}" y1="${gridY}" x2="${width-pad}" y2="${gridY}" stroke="var(--baseline)" stroke-width="1"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2"/>
    ${dots}${labels}
  </svg>`;
}

// ---------- routing ----------
// Scroll position is remembered per-hash so back/forward (and in-place
// re-renders like editing a field or merging a duplicate) return you to
// where you were instead of jumping to the top every time.
let lastHash = location.hash || '#/overview';
const SCROLL_POSITIONS = {};
// Record position continuously rather than only on the way out. Reading
// window.scrollY inside navigate() is too late once the browser has already
// moved us for a hashchange, and it misses the case where the page is left by
// the browser Back button.
addEventListener('scroll', () => {
  SCROLL_POSITIONS[location.hash || '#/overview'] = window.scrollY;
}, {passive: true});

// Stop the browser doing its own (wrong, pre-render) scroll restoration on
// history navigation - we do it ourselves once the new page has laid out.
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
function navigate() {
  const hash = location.hash || '#/overview';
  document.querySelectorAll('.nav-item').forEach(n => {
    n.classList.toggle('active', hash.startsWith(n.dataset.route));
  });
  // Split the query off the WHOLE hash before splitting the path. Doing it
  // only on the last segment worked for #/regatta/49?year=2025 but left
  // #/compare?r=1,2 with route "compare?r=1,2", which matched nothing and
  // silently fell through to the overview.
  const [path, queryStr] = hash.split('?');
  const query = new URLSearchParams(queryStr || '');
  const [_, route, arg] = path.split('/');
  const qYear = query.has('year') ? parseInt(query.get('year'), 10) : null;
  const qCls = query.get('cls') || null;
  const main = document.getElementById('main');
  try {
    if (!route || route === 'overview') main.innerHTML = renderOverview();
    else if (route === 'boats') main.innerHTML = renderBoatsList();
    else if (route === 'boat') { main.innerHTML = renderBoatProfile(parseInt(arg));
                                attachOwnerTimelineHandlers(); }
    else if (route === 'regattas') main.innerHTML = renderRegattasList();
    else if (route === 'regatta') main.innerHTML = renderRegattaProfile(parseInt(arg), qYear, qCls);
    else if (route === 'race') main.innerHTML = renderRacePage(parseInt(arg));
    else if (route === 'analysis') { main.innerHTML = renderAnalysis(); attachAnalysisHandlers(); }
    else if (route === 'market-analysis') main.innerHTML = renderMarketAnalysis();
    else if (route === 'market-share') main.innerHTML = renderMarketShare();
    else if (route === 'sales') main.innerHTML = renderSales();
    else if (route === 'enrich') { main.innerHTML = renderEnrich(); attachEnrichHandlers(); }
    else if (route === 'coverage') main.innerHTML = renderCoverage();
    else if (route === 'quality') main.innerHTML = renderQuality();
    else if (route === 'compare') main.innerHTML = renderCompare((query.get('r')||'').split(',').filter(Boolean));
    else if (route === 'duplicates') main.innerHTML = renderDuplicates();
    else if (route === 'changes') main.innerHTML = renderPendingChanges();
    else main.innerHTML = renderOverview();
  } catch (err) {
    main.innerHTML = `<div class="card">Something went wrong rendering this page: ${esc(err.message)}</div>`;
    console.error(err);
  }
  attachBoatFilterHandlers();
  attachInlineSailmakerHandlers();
  attachBoatEditHandlers();
  attachPendingChangesHandlers();
  attachDuplicatesHandlers();
  attachRegattaHandlers();
  attachRegattaListHandlers();
  attachCompareHandlers();
  attachMarketAnalysisHandlers();
  attachSalesHandlers();
  updatePendingBadge();
  lastHash = hash;
  // Restore AFTER the new content has been laid out. Scrolling in the same
  // tick clamps to the old document height - usually 0 - which is why this
  // looked like "always resets to the top". Two frames because the first only
  // guarantees style/layout is queued, not done.
  const target = SCROLL_POSITIONS[hash] || 0;
  requestAnimationFrame(() => requestAnimationFrame(() => window.scrollTo(0, target)));
}
window.addEventListener('hashchange', navigate);
document.addEventListener('click', e => {
  const el = e.target.closest('[data-route]');
  if (el && el.tagName !== 'A') { location.hash = el.dataset.route; }
});

// ---------- page: overview ----------
function renderOverview() {
  const s = DATA.stats;
  const activeBoats = DATA.boats.filter(b => b.active);
  const byBucket = boatBucketCounts(activeBoats);
  const bucketItems = BUCKET_ORDER.filter(b => byBucket[b]).map(b => ({sailmaker: b, entries: byBucket[b]}));

  // distinct boats per season, Solent regattas only, deduped (a boat racing
  // three times in a season still counts once) - built from boat-level
  // race_entries, since that's the only source with actual boat identity
  // (the aggregate historical class-count rows have no boat-level detail).
  // Limited to the last 5 seasons to match the active-fleet window used
  // everywhere else on the dashboard.
  const yearBoats = {};
  DATA.boats.forEach(b => b.entries.forEach(e => {
    const year = entrySeasonYear(e);
    if (!year || year < ACTIVE_CUTOFF_YEAR) return;
    const reg = entryRegatta(e);
    if (!reg || reg.region !== 'Solent') return;
    (yearBoats[year] ||= new Set()).add(b.id);
  }));
  const distinctPts = Object.keys(yearBoats).map(Number).sort((a,b)=>a-b).map(y => ({x:y, y:yearBoats[y].size}));

  // Two different North Sails figures, both true, and misleading on their own.
  // Share of the WHOLE active fleet understates us because most of the fleet is
  // simply unmeasured; share of the KNOWN fleet overstates us because what we
  // know is skewed towards boats North Sails itself publicises. The overview
  // shows both and says so, rather than picking the flattering one.
  const northN = byBucket['North Sails'] || 0;
  // 29 boats carry the literal value "Unknown" - a recorded finding meaning
  // "we looked and could not establish it", not a known sailmaker. Counting
  // those as known made the overview claim 144 where Market analysis said
  // 115, and two pages disagreeing is worse than either number.
  const smKnown = activeBoats.filter(b => liveSailmaker(b)
                                     && bucketOf(liveSailmaker(b)) !== 'Unknown').length;
  const smKnownPct = activeBoats.length ? Math.round(100 * smKnown / activeBoats.length) : 0;
  const northOfKnown = smKnown ? Math.round(100 * northN / smKnown) : 0;
  const northPct = activeBoats.length ? Math.round(100 * northN / activeBoats.length) : 0;
  // Known-market breakdown excludes Unknown: this chart answers "of the boats
  // we can actually see, who has them", which is a different question from the
  // whole-fleet chart further down and must not be confused with it.
  const knownItems = BUCKET_ORDER.filter(b => b !== 'Unknown' && byBucket[b])
    .map(b => ({sailmaker: b, entries: byBucket[b]}));
  const contactableCount = activeBoats.filter(b =>
    (!liveSailmaker(b) || bucketOf(liveSailmaker(b)) === 'Unknown') && b.owner_name).length;

  return `
    <h1>Overview</h1>
    <p class="subtitle">Boat-centric race entry &amp; market-share database. Generated ${fmtDate(DATA.generated_at)}.
      Figures below cover the <strong>active fleet</strong> — boats with at least one race entry in ${ACTIVE_CUTOFF_YEAR}–${MAX_SEASON_YEAR}
      (last 5 seasons). <a href="#/boats" data-route="#/boats">${s.n_boats} boats</a> are tracked in total, including inactive ones.</p>
    <div class="stat-row">
      <div class="stat-tile"><div class="v">${activeBoats.length}</div><div class="l">Active boats (last 5 seasons)</div></div>
      <div class="stat-tile"><div class="v">${s.n_entries}</div><div class="l">Boat-level race entries (all-time)</div></div>
      <div class="stat-tile"><div class="v">${s.n_regattas}</div><div class="l">Regattas / races</div></div>
      <div class="stat-tile"><div class="v">${s.n_class_count_rows}</div><div class="l">Historical class-count records</div></div>
      <div class="stat-tile"><div class="v">${smKnownPct}%</div><div class="l">Sailmaker known</div></div>
    </div>

    <div class="card-row">
      <div class="card" style="border-left:4px solid var(--series-north);">
        <h2 style="margin-top:0;">The known market ${confidenceBadge(smKnown, activeBoats.length, {label: 'active boats measured'})}</h2>
        <p style="margin:0 0 10px;font-size:15px;">Of the <strong>${smKnown}</strong> active boats whose sailmaker
          we know, <strong>${northN}</strong> are on North Sails — <strong>${northOfKnown}%</strong>.</p>
        ${svgBarChart(knownItems, {colorFn: it => BUCKET_COLOR[it.sailmaker], width: 460})}
        <p class="muted" style="font-size:12px;margin-top:10px;">
          The badge is our confidence: ${smKnownPct}% of the active fleet is measured. What we know also leans
          towards boats North Sails publicises, since competitors publish far less, so read ${northOfKnown}% as the
          optimistic end. <a href="#/market-analysis" data-route="#/market-analysis">Full analysis →</a></p>
      </div>
      <div class="card" style="border-left:4px solid var(--series-other);">
        <h2 style="margin-top:0;">The real market size</h2>
        <p style="margin:0 0 10px;font-size:15px;"><strong>${activeBoats.length - smKnown}</strong> active IRC boats
          have no sailmaker on file — the addressable fleet we cannot yet see into.</p>
        <p class="muted" style="font-size:13px;margin:0 0 10px;">
          Race results almost never record whose sails a boat carries: only
          <strong>${s.n_entries_with_sailmaker ?? 0}</strong> of ${s.n_entries} entries do. These are not lost
          business, they are <em>unmeasured</em> business — <strong>${contactableCount}</strong> of them already
          have an owner on file and could be approached tomorrow.</p>
        <p class="muted" style="font-size:12px;margin:0;">
          <a href="#/market-analysis" data-route="#/market-analysis">Targets →</a></p>
      </div>
    </div>
    <div class="card-row">
      <div class="card">
        <h2>Sailmaker share — distinct boats (active fleet)</h2>
        ${svgBarChart(bucketItems, {colorFn: it => BUCKET_COLOR[it.sailmaker]})}
        <p class="muted" style="font-size:12px;margin-top:10px;">Boats active in the last 5 seasons, counted once by their most recently observed sailmaker (no signal at all = "Unknown"). "Other" groups low-volume brands (Relling, GP, UK...). <a href="#/market-share" data-route="#/market-share">Full breakdown →</a></p>
      </div>
      <div class="card">
        <h2>Solent IRC entries — last 5 seasons</h2>
        ${distinctPts.length ? sparkline(distinctPts) : '<p class="muted">No boat-level Solent entries with a season year on file yet.</p>'}
        <p class="muted" style="font-size:12px;margin-top:6px;">Distinct boats that raced at least once that season — a boat entering multiple races only counts once. <a href="#/boats" data-route="#/boats">All boats →</a></p>
      </div>
    </div>
    <div class="card">
      <h2>Where the data comes from</h2>
      <p style="margin:0 0 8px;">Boat-level entries: your JOG fleet register + entry lists (manual), plus one proof-of-concept RORC race scraped live from rorc.org's legacy results archive. Aggregate historical entry counts (2007–2026, no boat-level detail): your IRC Solent Report, covering RORC Inshore, RSYC, Round the Island, Cowes Week, Warsash, ORC Worlds/Euros, and RORC offshore races.</p>
      <p class="muted" style="font-size:12px;margin:0;">Note: the JOG entry-list sheets had no season year recorded, so they're filed under the current season (assumed) — flag to correct if wrong. See the README shipped alongside this file for the full scraping/automation notes.</p>
    </div>
  `;
}

// ---------- page: boats list ----------
// REGATTA ATTENDANCE, not race count. A boat that sails eight races at one
// regatta is not eight times the prospect of one that turns up to eight
// separate events - attendance is the buying signal, and the Entries column
// was quietly rewarding boats that enter long series. Counted as distinct
// (regatta, season) pairs, the same unit the boat page groups by.
const _attCache = {};
function regattaAttendance(b) {
  if (_attCache[b.id] != null) return _attCache[b.id];
  const seen = new Set();
  b.entries.forEach(e => {
    const ra = racesById[e.race_id]; if (!ra) return;
    const ev = eventsById[ra.event_id]; if (!ev) return;
    seen.add(ev.regatta_id + ':' + (ev.season_year || 0));
  });
  return (_attCache[b.id] = seen.size);
}

const BOAT_SORTS = {
  attendance: { label: 'Regatta attendance (most first)', get: b => regattaAttendance(b), dir: -1 },
  entries:    { label: 'Race entries (most first)',       get: b => b.entries.length,     dir: -1 },
  recent:     { label: 'Most recently active',            get: b => b.lastActiveYear || 0, dir: -1 },
  name:       { label: 'Name (A–Z)',                  get: b => b.boat_name || '￿', dir: 1 },
  tcc:        { label: 'TCC (highest first)',             get: b => b.tcc || 0,           dir: -1 },
};
let BOAT_SORT = 'attendance';


// The timeline is edited whole: what you leave behind IS the timeline. A list
// of patches would be harder to read back and much harder to be sure about.
function attachOwnerTimelineHandlers() {
  const card = document.getElementById('owner-tl-card');
  if (!card) return;
  const b = boatsById[card.dataset.boatId];
  if (!b) return;
  const view = document.getElementById('owner-tl-view');
  const box = document.getElementById('owner-tl-editor');
  const note = document.getElementById('owner-tl-note');

  const startRows = () => {
    const staged = OWNER_TIMELINES[b.id];
    if (staged) return staged.map(r => ({ ...r }));
    return (b.owner_history || []).slice()
      .sort((x, y) => String(x.effective_from || '').localeCompare(String(y.effective_from || '')))
      .map(h => ({ owner: h.owner_name || '', from: h.effective_from || '',
                   to: h.effective_to || '', charter: !!h.is_charter }));
  };
  let rows = startRows();

  const draw = () => {
    box.innerHTML = `
      <table style="width:100%;">
        <thead><tr><th>Owner</th><th style="width:90px;">From</th><th style="width:90px;">To</th>
          <th style="width:80px;">Charter</th><th style="width:40px;"></th></tr></thead>
        <tbody>${rows.map((r, i) => `
          <tr>
            <td><input type="text" class="tl-owner" data-i="${i}" value="${esc(r.owner || '')}"
                  placeholder="Owner name" style="width:100%;" list="tl-owners"></td>
            <td><input type="text" class="tl-from" data-i="${i}" value="${esc(r.from || '')}"
                  placeholder="year" style="width:100%;"></td>
            <td><input type="text" class="tl-to" data-i="${i}" value="${esc(r.to || '')}"
                  placeholder="present" style="width:100%;"></td>
            <td style="text-align:center;"><input type="checkbox" class="tl-charter" data-i="${i}"
                  ${r.charter ? 'checked' : ''} title="Entered under a charter or corporate name, not an ownership change"></td>
            <td><button class="btn secondary tl-del" data-i="${i}" type="button"
                  style="padding:2px 8px;" title="Remove this period">&times;</button></td>
          </tr>`).join('') || '<tr><td colspan="5" class="muted">No periods. Add one below.</td></tr>'}
        </tbody>
      </table>
      <datalist id="tl-owners">${
        Array.from(new Set(DATA.boats.map(x => x.owner_name).filter(Boolean)))
          .sort().slice(0, 900).map(n => `<option value="${esc(n)}">`).join('')}</datalist>
      <p class="muted" style="font-size:12px;margin:8px 0;">Leave <strong>To</strong> empty for the
        current owner. Tick <strong>Charter</strong> where a name is a charter or corporate entry
        rather than a change of ownership &mdash; it stays on the timeline but never counts as the owner.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn secondary" type="button" id="tl-add">Add a period</button>
        <button class="btn" type="button" id="tl-save">Save timeline</button>
        <button class="btn secondary" type="button" id="tl-cancel">Cancel</button>
        ${OWNER_TIMELINES[b.id] ? '<button class="btn secondary" type="button" id="tl-revert">Discard my correction</button>' : ''}
      </div>`;

    box.querySelectorAll('.tl-owner').forEach(el => el.addEventListener('input',
      () => { rows[el.dataset.i].owner = el.value; }));
    box.querySelectorAll('.tl-from').forEach(el => el.addEventListener('input',
      () => { rows[el.dataset.i].from = el.value.trim(); }));
    box.querySelectorAll('.tl-to').forEach(el => el.addEventListener('input',
      () => { rows[el.dataset.i].to = el.value.trim(); }));
    box.querySelectorAll('.tl-charter').forEach(el => el.addEventListener('change',
      () => { rows[el.dataset.i].charter = el.checked; }));
    box.querySelectorAll('.tl-del').forEach(el => el.addEventListener('click',
      () => { rows.splice(parseInt(el.dataset.i, 10), 1); draw(); }));
    document.getElementById('tl-add').addEventListener('click', () => {
      rows.push({ owner: '', from: '', to: '', charter: false }); draw();
      const last = box.querySelectorAll('.tl-owner');
      if (last.length) last[last.length - 1].focus();
    });
    document.getElementById('tl-cancel').addEventListener('click', () => {
      rows = startRows(); box.hidden = true; view.hidden = false; note.textContent = '';
    });
    const rev = document.getElementById('tl-revert');
    if (rev) rev.addEventListener('click', () => { clearOwnerTimeline(b.id); navigate(); });
    document.getElementById('tl-save').addEventListener('click', () => {
      const clean = rows.filter(r => (r.owner || '').trim());
      // a timeline with two current owners is the one mistake worth catching here
      const open = clean.filter(r => !r.to && !r.charter);
      if (open.length > 1) {
        note.textContent = 'Two periods are both open-ended, so the boat would have two current ' +
          'owners. Give the earlier one a To year.';
        return;
      }
      setOwnerTimeline(b.id, clean);
      navigate();
    });
  };

  document.getElementById('owner-tl-edit').addEventListener('click', () => {
    rows = startRows();
    if (box.hidden) { draw(); box.hidden = false; view.hidden = true; }
    else { box.hidden = true; view.hidden = false; }
  });

  const rb = document.getElementById('owner-tl-research');
  if (rb) rb.addEventListener('click', async () => {
    const text = boatResearchPrompt(b);
    try {
      await navigator.clipboard.writeText(text);
      note.textContent = 'Question copied. Paste it to Claude; it comes back as CSV you can ' +
        'load with apply_owner_timeline.py, or type the answer in here with Edit.';
    } catch (e) {
      note.textContent = 'Could not reach the clipboard.';
    }
  });
}

function attachBoatFilterHandlers() {
  const search = document.getElementById('boat-search');
  const filter = document.getElementById('boat-filter');
  const activityFilter = document.getElementById('boat-activity-filter');
  const typeFilter = document.getElementById('boat-type-filter');
  if (!search) return;
  // Re-order the existing rows rather than re-rendering the page: a re-render
  // would throw away every filter and checkbox the user had already set.
  const sortSel = document.getElementById('boat-sort');
  if (sortSel) sortSel.addEventListener('change', () => {
    BOAT_SORT = sortSel.value;
    const srt = BOAT_SORTS[BOAT_SORT] || BOAT_SORTS.attendance;
    const tbody = document.getElementById('boats-tbody');
    if (!tbody) return;
    const trs = Array.from(tbody.children);
    trs.sort((ta, tb) => {
      const a = boatsById[ta.dataset.boatId], b = boatsById[tb.dataset.boatId];
      if (!a || !b) return 0;
      const x = srt.get(a), y = srt.get(b);
      if (x !== y) return (typeof x === 'string'
        ? String(x).localeCompare(String(y), undefined, { sensitivity: 'base' })
        : (x < y ? -1 : 1)) * srt.dir;
      return (a.boat_name || '￿').localeCompare(b.boat_name || '￿', undefined,
        { sensitivity: 'base' });
    });
    const frag = document.createDocumentFragment();
    trs.forEach(tr => frag.appendChild(tr));
    tbody.appendChild(frag);
  });

  const catBoxes = () => Array.from(document.querySelectorAll('.cat-chip:checked'));
  const regattaBoxes = () => Array.from(document.querySelectorAll('.regatta-box:checked'));
  const apply = () => {
    const q = search.value.trim().toLowerCase();
    const f = filter.value;
    const af = activityFilter ? activityFilter.value : 'all';
    const tf = typeFilter ? typeFilter.value : '';
    const selectedCats = new Set(catBoxes().map(b => b.value));
    const catMode = (document.querySelector('input[name=cat-mode]:checked') || {}).value || 'and';
    const selectedRegattas = new Set(regattaBoxes().map(b => parseInt(b.value)));
    const regMode = (document.querySelector('input[name=reg-mode]:checked') || {}).value || 'any';

    document.querySelectorAll('#boats-tbody tr').forEach(tr => {
      const hayKeep = tr.dataset.hay, hayTight = tr.dataset.haytight;
      const bucket = tr.dataset.bucket;
      const b = boatsById[tr.dataset.boatId];
      let show = matchesSearch(hayKeep, hayTight, q) && (f==='all' || bucket===f)
        && (af==='all' || (af==='active' && tr.dataset.active==='1') || (af==='inactive' && tr.dataset.active==='0'))
        && (!tf || tr.dataset.type === tf);

      if (show && selectedCats.size) {
        const cats = b.regattaCategories;
        if (catMode === 'and') { for (const c of selectedCats) if (!cats.has(c)) { show = false; break; } }
        else { show = Array.from(selectedCats).some(c => cats.has(c)); }
      }
      if (show && selectedRegattas.size) {
        const ids = b.regattaIds;
        if (regMode === 'any') show = Array.from(selectedRegattas).some(id => ids.has(id));
        else if (regMode === 'all') show = Array.from(selectedRegattas).every(id => ids.has(id));
        else if (regMode === 'only') show = ids.size > 0 && Array.from(ids).every(id => selectedRegattas.has(id));
      }
      tr.style.display = show ? '' : 'none';
    });
    const visible = Array.from(document.querySelectorAll('#boats-tbody tr'))
      .filter(tr => tr.style.display !== 'none');
    const shown = visible.length;
    const countEl = document.getElementById('boat-count');
    if (countEl) countEl.textContent = shown === DATA.boats.length ? `${shown} boats` : `${shown} of ${DATA.boats.length} boats`;
    renderFilteredShare(visible, {type: tf, sailmaker: f, activity: af, q});
  };
  search.addEventListener('input', apply);
  filter.addEventListener('change', apply);
  if (activityFilter) activityFilter.addEventListener('change', apply);
  if (typeFilter) typeFilter.addEventListener('change', apply);
  document.querySelectorAll('.cat-chip, .regatta-box').forEach(el => el.addEventListener('change', apply));
  document.querySelectorAll('input[name=cat-mode], input[name=reg-mode]').forEach(el => el.addEventListener('change', apply));
  const clearBtn = document.getElementById('clear-regatta-filter');
  if (clearBtn) clearBtn.addEventListener('click', () => {
    document.querySelectorAll('.cat-chip, .regatta-box').forEach(el => el.checked = false);
    apply();
  });
  apply();
}

// Market share for whatever the Boats page is currently filtered to. Selecting
// a class (say the 63 J/109s) and seeing who has that fleet is the question
// this whole tool exists to answer, so it updates live with the filters rather
// than being a separate report.
function renderFilteredShare(visibleRows, ctx) {
  const host = document.getElementById('filtered-share');
  if (!host) return;
  if (!visibleRows.length) { host.innerHTML = ''; return; }

  const counts = {};
  visibleRows.forEach(tr => {
    const b = boatsById[tr.dataset.boatId];
    const k = bucketOf(liveSailmaker(b));
    counts[k] = (counts[k] || 0) + 1;
  });
  const total = visibleRows.length;
  const items = BUCKET_ORDER.filter(b => counts[b]).map(b => ({sailmaker: b, entries: counts[b]}));
  const north = counts['North Sails'] || 0;
  const known = total - (counts['Unknown'] || 0);

  const bits = [];
  if (ctx.type) bits.push(`<strong>${esc(ctx.type)}</strong>`);
  if (ctx.sailmaker && ctx.sailmaker !== 'all') bits.push(`sailmaker ${esc(ctx.sailmaker)}`);
  if (ctx.activity === 'active') bits.push('active fleet');
  else if (ctx.activity === 'inactive') bits.push('inactive only');
  if (ctx.q) bits.push(`matching “${esc(ctx.q)}”`);
  const scope = bits.length ? bits.join(' · ') : 'all tracked boats';

  host.innerHTML = `
    <div class="card">
      <h2>Market share — ${scope}</h2>
      <p class="muted" style="font-size:12px;margin-top:0;">
        ${total} boat${total===1?'':'s'} in this selection.
        North Sails on <strong>${north}</strong>
        (${total ? Math.round(100*north/total) : 0}% of all,
         ${known ? Math.round(100*north/known) : 0}% of the ${known} with a known sailmaker).</p>
      ${svgBarChart(items, {colorFn: it => BUCKET_COLOR[it.sailmaker]})}
    </div>`;
}

// Sailmaker choices, shared by every editor so the three places you can change
// one all offer the same list.
function sailmakerChoices() {
  return DATA.sailmakers.map(s => s.name).concat(BUCKET_ORDER)
    .filter((v, i, a) => a.indexOf(v) === i).sort();
}

// Every row carries a REAL dropdown, so a sailmaker can be changed without
// first discovering that a pill is clickable.
//
// The reason this was a click-to-edit pill before is still true: a <select>
// holding ~45 makers, on two columns of 3,587 boats, is roughly 290,000 DOM
// nodes, and that volume of controls is exactly what made the old Sales page
// unusable. So each select ships EMPTY - one option showing the current value -
// and fills its list the first time you touch it. Visible dropdown on every
// row, about 7,000 nodes instead of 290,000.
function smOptionsFor(field) {
  return sailmakerChoices()
    .filter(n => field === 'sailmaker' || !['Partial', 'Unknown', 'Other'].includes(n));
}

function smCurrent(b, field) {
  return (field === 'sailmaker' ? liveSailmaker(b) : livePartial(b)) || '';
}

function smSelect(b, field) {
  const cur = smCurrent(b, field);
  const label = cur || (field === 'sailmaker' ? 'Unknown' : '—');
  return `<select class="sm-select" data-boat-id="${b.id}" data-field="${field}"
      style="${pillStyle(cur)}"
      title="${field === 'sailmaker' ? 'Main sail inventory' : 'Second, partial inventory'}">
      <option value="${esc(cur)}" selected>${esc(label)}</option></select>`;
}

function attachInlineSailmakerHandlers() {
  const fill = (sel) => {
    if (sel.dataset.filled) return;
    sel.dataset.filled = '1';
    const b = boatsById[sel.dataset.boatId];
    if (!b) return;
    const field = sel.dataset.field;
    const cur = smCurrent(b, field);
    const empty = field === 'sailmaker' ? '— unknown —' : '— none —';
    sel.innerHTML = `<option value="">${empty}</option>` +
      smOptionsFor(field).map(n =>
        `<option value="${esc(n)}"${n === cur ? ' selected' : ''}>${esc(n)}</option>`).join('');
    sel.value = cur;                      // '' selects the empty option
  };
  document.querySelectorAll('.sm-select').forEach(sel => {
    // fill before the native popup opens; focus covers keyboard use
    sel.addEventListener('mousedown', () => fill(sel));
    sel.addEventListener('focus', () => fill(sel));
    // the row is a link to the boat page - a click on the control is not
    sel.addEventListener('click', ev => ev.stopPropagation());
    sel.addEventListener('change', (ev) => {
      ev.stopPropagation();
      const b = boatsById[sel.dataset.boatId];
      if (!b) return;
      const field = sel.dataset.field;
      // an emptied partial is a deliberate clear, not "no change"
      const v = (field === 'partialSailmaker' && sel.value === '') ? '__none__' : sel.value;
      setPendingEdit(b.id, { [field]: v });
      navigate();                          // figures update immediately
    });
  });
}

function renderBoatsList() {
  // Alphabetical by boat name, case- and accent-insensitive. The SQL ORDER BY
  // uses SQLite's default binary collation, which sorts by byte value - so
  // lower-case names fall after every upper-case one and accented names sort
  // last of all. localeCompare puts them where a reader expects.
  const srt = BOAT_SORTS[BOAT_SORT] || BOAT_SORTS.attendance;
  const rows = DATA.boats.slice()
    .sort((a, b) => {
      const x = srt.get(a), y = srt.get(b);
      if (x !== y) return (typeof x === 'string' ? String(x).localeCompare(String(y), undefined,
        { sensitivity: 'base' }) : (x < y ? -1 : 1)) * srt.dir;
      // stable tiebreak so equal scores don't shuffle between renders
      return (a.boat_name || '￿').localeCompare(b.boat_name || '￿', undefined,
        { sensitivity: 'base' });
    })
    .map(b => {
    const bucket = bucketOf(liveSailmaker(b));
    const hayRaw = [b.boat_name,b.sail_no,b.owner_name,b.boat_type,b.current_sailmaker,b.tag].join(' ');
    const hayKeep = searchKeep(hayRaw), hayTight = searchTight(hayRaw);
    const edited = PENDING[b.id] ? '<span class="edited-flag">Edited</span>' : '';
    const statusPill = b.active
      ? `<span class="pill" style="background:var(--series-north);color:#fff;">Active</span>`
      : `<span class="pill" style="background:var(--surface-2);color:var(--text-muted);border:1px solid var(--border);">Inactive</span>`;
    return `<tr class="clickable" data-route="#/boat/${b.id}" data-hay="${esc(hayKeep)}" data-haytight="${esc(hayTight)}" data-bucket="${bucket}" data-active="${b.active?1:0}" data-type="${esc(normType(b.boat_type))}" data-boat-id="${b.id}">
      <td><strong>${esc(b.boat_name||'—')}</strong>${edited}</td>
      <td>${esc(b.sail_no||'')}</td>
      <td>${esc(b.boat_type||'')}</td>
      <td class="num">${b.tcc||''}</td>
      <td>${esc(b.owner_name||'')}</td>
      <td class="sm-cell">${smSelect(b, 'sailmaker')}</td>
      <td class="sm-cell">${smSelect(b, 'partialSailmaker')}</td>
      <td>${statusPill}${b.lastActiveYear ? ` <span class="muted" style="font-size:11px;">(${b.lastActiveYear})</span>` : ''}</td>
      <td>${esc(b.tag||'')}</td>
      <td class="num">${regattaAttendance(b)}</td>
      <td class="num">${b.entries.length}</td>
    </tr>`;
  }).join('');
  const options = BUCKET_ORDER.map(b => `<option value="${b}">${b}</option>`).join('');

  // Boat-type filter. Types are normalised the same way the duplicate matcher
  // does it (trailing IRC rating stripped) so "J/109 1.01" and "J/109" are one
  // entry, and the list is ordered by how many boats carry each type so the
  // big fleets are reachable without scrolling.
  const typeCounts = {};
  DATA.boats.forEach(b => {
    const t = normType(b.boat_type);
    if (t) typeCounts[t] = (typeCounts[t] || 0) + 1;
  });
  const typeOptions = Object.entries(typeCounts)
    .sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0]))
    .map(([t,n]) => `<option value="${esc(t)}">${esc(t)} (${n})</option>`).join('');

  const catsPresent = Array.from(new Set(DATA.regattas.map(r => r.category || 'Other'))).sort();
  const catChips = catsPresent.map(c => `<label class="chip"><input type="checkbox" class="cat-chip" value="${esc(c)}"> ${esc(c)}</label>`).join('');

  const byCat = {};
  DATA.regattas.forEach(r => { (byCat[r.category||'Other'] ||= []).push(r); });
  let regattaList = '';
  Object.keys(byCat).sort().forEach(cat => {
    regattaList += `<div class="cat-heading">${esc(cat)}</div>`;
    byCat[cat].sort((a,b)=>a.name.localeCompare(b.name)).forEach(r => {
      regattaList += `<label><input type="checkbox" class="regatta-box" value="${r.id}"> ${esc(r.name)}</label>`;
    });
  });

  return `
    <h1>Boats</h1>
    <p class="subtitle"><span id="boat-count">${DATA.boats.length} boats</span>. The boat is the central record — click into one to see its owner, sailmaker history and every race it's entered.</p>
    <p class="muted" style="font-size:12px;margin-top:-8px;">"Active" = raced at least once in ${ACTIVE_CUTOFF_YEAR}–${MAX_SEASON_YEAR}. Boats with no entry in the last 5 seasons are marked Inactive.</p>
    <div class="search-row">
      <input type="text" id="boat-search" placeholder="Search by name, sail no, owner, type, tag…">
      <select id="boat-filter"><option value="all">All sailmakers</option>${options}</select>
      <select id="boat-activity-filter">
        <option value="active" selected>Active only (last 5 seasons)</option>
        <option value="inactive">Inactive only</option>
        <option value="all">All boats</option>
      </select>
      <select id="boat-type-filter">
        <option value="">All boat types</option>
        ${typeOptions}
      </select>
      <select id="boat-sort" title="Order the list">
        ${Object.keys(BOAT_SORTS).map(k =>
          `<option value="${k}"${k === BOAT_SORT ? ' selected' : ''}>${esc(BOAT_SORTS[k].label)}</option>`).join('')}
      </select>
    </div>
    <details class="filter-panel card">
      <summary>Filter by regatta / series</summary>
      <div class="filter-group">
        <div class="filter-group-title">By category (e.g. "entered JOG and RORC")</div>
        <div class="chip-row">${catChips || '<span class="muted">No categories on file.</span>'}</div>
        <div class="mode-row">
          <label><input type="radio" name="cat-mode" value="and" checked> Must have entered ALL checked categories</label>
          <label><input type="radio" name="cat-mode" value="or"> Must have entered ANY checked category</label>
        </div>
      </div>
      <div class="filter-group">
        <div class="filter-group-title">By specific regatta (e.g. "only entered Royal Southern regattas")</div>
        <div class="regatta-checklist">${regattaList}</div>
        <div class="mode-row">
          <label><input type="radio" name="reg-mode" value="any" checked> Entered ANY of these</label>
          <label><input type="radio" name="reg-mode" value="all"> Entered ALL of these</label>
          <label><input type="radio" name="reg-mode" value="only"> Entered ONLY these (nothing else)</label>
        </div>
      </div>
      <button class="btn secondary" id="clear-regatta-filter" type="button">Clear regatta filters</button>
    </details>
    <div id="filtered-share"></div>
    <div class="card" style="padding:0; overflow:auto;">
      <table>
        <thead><tr><th>Boat</th><th>Sail No</th><th>Type</th><th class="num">TCC</th><th>Owner</th><th>Sailmaker</th><th>Partial</th><th>Status</th><th>Tag</th><th class="num" title="Distinct regatta-seasons attended">Regattas</th><th class="num" title="Individual race entries">Entries</th></tr></thead>
        <tbody id="boats-tbody">${rows}</tbody>
      </table>
    </div>
  `;
}

// ---------- page: boat profile ----------
function renderBoatProfile(id) {
  const b = boatsById[id];
  if (!b) return `<div class="card">Boat not found.</div>`;
  const bucket = bucketOf(b.current_sailmaker);
  const smHistoryRows = b.sailmaker_history.map(h => `
    <tr><td>${esc(h.sailmaker_name||'—')}</td><td>${esc(h.source||'')}</td><td>${esc(h.confidence||'')}</td></tr>
  `).join('') || `<tr><td colspan="3" class="muted">No sailmaker history recorded.</td></tr>`;

  // Identity timeline: what this boat was called and who owned it, on one
  // axis. Both are derived from the entries, so a name and an owner change in
  // the same season line up the way they did in real life.
  const nameHist = (b.name_history || []).slice()
    .sort((a, c) => (c.first_season || 0) - (a.first_season || 0));
  const overlapping = nameHist.some(h => h.confidence === 'overlapping');
  const nameTimeline = nameHist.length <= 1 ? '' : `
    <div class="card">
      <h2>Previously known as</h2>
      ${overlapping ? `<p class="muted" style="font-size:12px;margin-top:0;">
        <strong>These periods overlap</strong>, and a boat cannot carry two names at once — this record
        probably holds more than one boat, merged because they share a sail number. Worth splitting.</p>`
        : `<p class="muted" style="font-size:12px;margin-top:0;">Names this boat has raced under, newest first,
           taken from the entry lists themselves.</p>`}
      <ol style="list-style:none;padding:0;margin:0;border-left:2px solid var(--border);">
        ${nameHist.map((h, i) => {
          const cur = i === 0;
          const dot = cur ? 'var(--series-north)' : 'var(--text-muted)';
          const vs = (h.variants || '').split('|').map(x => x.trim()).filter(x => x && x !== h.name);
          return `<li style="position:relative;padding:0 0 14px 18px;">
            <span style="position:absolute;left:-7px;top:4px;width:12px;height:12px;border-radius:50%;
                  background:${cur ? dot : 'var(--surface-1)'};border:2px solid ${dot};"></span>
            <div><strong>${esc(h.name)}</strong>
              ${cur ? '<span class="pill" style="background:var(--series-north);color:#fff;margin-left:6px;">current</span>' : ''}
              ${h.confidence === 'overlapping' ? '<span class="pill" style="background:var(--series-doyle);color:#292524;margin-left:6px;">overlaps</span>' : ''}</div>
            <div class="muted" style="font-size:12px;">${h.first_season || '?'}${h.last_season && h.last_season !== h.first_season ? '–' + h.last_season : ''}
              ${vs.length ? ' · also entered as ' + vs.map(esc).join(', ') : ''}</div>
          </li>`;
        }).join('')}
      </ol>
    </div>`;

  // Ownership timeline, newest first. Segments come from walking the boat's
  // race history, so a merged-in duplicate contributes its previous owner here
  // rather than that record's owner being lost - which is usually the whole
  // point of the pair: the same hull under two owners.
  const ownerTimeline = (() => {
    // Show the CORRECTION if one is staged. Saving an edit used to leave this
    // view rendering the database, so the "current owner" tag stayed on the
    // name you had just demoted to charterer and the edit looked ignored.
    const staged = OWNER_TIMELINES[b.id];
    const hs = staged
      ? staged.map(r => ({ owner_name: r.owner, effective_from: r.from,
                           effective_to: r.to, is_charter: r.charter,
                           confidence: 'your correction, not yet applied' }))
          .sort((a, c) => String(c.effective_from || '').localeCompare(String(a.effective_from || '')))
      : (b.owner_history || []).slice().sort((a, c) =>
          String(c.effective_from || '').localeCompare(String(a.effective_from || '')));
    if (!hs.length) return '<p class="muted" style="margin:0;">No owner history recorded.</p>';
    return `<ol style="list-style:none;padding:0;margin:0;border-left:2px solid var(--border);">` +
      hs.map(h => {
        // A charter operator entering the boat for a season is not a change of
        // ownership - shown on the timeline, but as a charter, and it never
        // counts as "current".
        const charter = !!h.is_charter;
        const current = !h.effective_to && !charter;
        const dot = charter ? 'var(--series-doyle)'
                  : current ? 'var(--series-north)' : 'var(--text-muted)';
        return `<li style="position:relative;padding:0 0 14px 18px;">
          <span style="position:absolute;left:-7px;top:4px;width:12px;height:12px;border-radius:50%;
                background:${current ? dot : 'var(--surface-1)'};border:2px solid ${dot};"></span>
          <div><strong>${esc(h.owner_name || '—')}</strong>
            ${charter ? '<span class="pill" style="background:var(--series-doyle);color:#292524;margin-left:6px;">chartered</span>' : ''}
            ${current ? '<span class="pill" style="background:var(--series-north);color:#fff;margin-left:6px;">current owner</span>' : ''}</div>
          <div class="muted" style="font-size:12px;">
            ${esc(h.effective_from || '?')} → ${esc(h.effective_to || 'present')}
            ${charter ? ' · entered under a charter/corporate name, not an ownership change' : ''}
            ${h.confidence ? ' · ' + esc(h.confidence) : ''}</div>
        </li>`;
      }).join('') + '</ol>';
  })();

  // A boat's history reads as the regattas it has entered, not the hundreds of
  // individual races inside them (a single Cowes Week is ~15 rows on its own).
  // Races are still there, one level down, on the regatta page.
  const regattaEntries = boatRegattaEntries(b);
  const ordinal = n => n === 1 ? '1st' : n === 2 ? '2nd' : n === 3 ? '3rd' : n + 'th';
  // Each regatta opens to the boat's OWN races in it. These used to be one
  // level down on the regatta page, which meant hunting for this boat among
  // everyone else's results to answer "how did we actually do?".
  const entryRows = regattaEntries.map(g => {
    const races = g.entries.slice().sort((x, y) => {
      const rx = racesById[x.race_id] || {}, ry = racesById[y.race_id] || {};
      return (rx.race_number || 0) - (ry.race_number || 0)
          || String(rx.race_name || '').localeCompare(String(ry.race_name || ''));
    });
    const raceRows = races.map(e => {
      const ra = racesById[e.race_id] || {};
      const pos = parseInt(e.position, 10);
      const status = (e.status && e.status !== 'finished') ? e.status : '';
      return `<a class="boat-race" href="#/race/${e.race_id}">
        <span class="boat-race-name">${esc(ra.race_name || 'Race')}</span>
        <span class="boat-race-meta">${esc(e.class || '')}</span>
        <span class="boat-race-meta">${!isNaN(pos) && pos > 0 ? ordinal(pos)
            : (status ? esc(status) : '—')}</span>
        <span class="boat-race-meta">${e.elapsed_time ? 'elapsed ' + esc(e.elapsed_time) : ''}</span>
        <span class="boat-race-meta">${e.corrected_time ? 'corrected ' + esc(e.corrected_time) : ''}</span>
      </a>`;
    }).join('');
    // A boat sailed ONE race but scores in two divisions - its own class and,
    // say, the two-handed one - so it has two results for one race. Counting
    // results as races doubled the season on paper.
    // keyed on the race NAME, not the race id: results are stored one row per
    // class, so the same start line is two race ids under two class labels
    const nSailed = new Set(races.map(e =>
      String((racesById[e.race_id] || {}).race_name || e.race_id))).size;
    const countLabel = races.length > nSailed
      ? `${nSailed} race${nSailed === 1 ? '' : 's'}, ${races.length} results`
      : `${nSailed} race${nSailed === 1 ? '' : 's'}`;
    return `<details class="boat-regatta">
      <summary>
        <span class="br-name">${esc(g.regattaName)}</span>
        <span class="br-year">${g.year || ''}</span>
        <span class="br-meta">${esc(Array.from(g.classes).join(', '))}</span>
        <span class="br-meta">${countLabel}</span>
        <span class="br-meta">${g.best != null ? 'best ' + ordinal(g.best) : '—'}</span>
        ${g.sailmaker ? `<span class="pill" style="${pillStyle(g.sailmaker)}">${esc(g.sailmaker)}</span>` : ''}
        <a class="br-open" href="#/regatta/${g.regattaId}?year=${g.year}">whole regatta &rsaquo;</a>
      </summary>
      <div class="boat-races">${raceRows || '<p class="muted" style="padding:6px 10px;margin:0;">No individual races on file — this season is aggregate counts only.</p>'}</div>
    </details>`;
  }).join('') || `<p class="muted" style="padding:0 20px 16px;">No regatta entries on file.</p>`;

  const crm = `
    <dl class="kv">
      <dt>Lead rep</dt><dd>${esc(b.lead_rep||'—')}</dd>
      <dt>Contacted by</dt><dd>${esc(b.contacted_by||'—')}</dd>
      <dt>Boat captain</dt><dd>${esc(b.boat_captain||'—')}</dd>
      <dt>Programme manager</dt><dd>${esc(b.programme_manager||'—')}</dd>
      <dt>In customer system</dt><dd>${b.in_cs===1?'Yes':(b.in_cs===0?'No':'—')}</dd>
      <dt>Tag</dt><dd>${esc(b.tag||'—')}</dd>
      <dt>Notes</dt><dd>${esc(b.crm_notes||'—')}</dd>
    </dl>`;

  const pending = PENDING[b.id];
  const pendingBanner = pending ? `
    <div class="banner">
      <span>This boat has unsaved edits (${Object.keys(pending).filter(k=>k!=='notes').join(', ')||'notes'}) — not yet written to the database. See <a href="#/changes" data-route="#/changes">Pending changes</a> to export them.</span>
      <button class="btn secondary" type="button" data-discard-edit="${b.id}">Discard</button>
    </div>` : '';

  const pendingMerge = PENDING_MERGES.find(m => String(m.mergeId) === String(b.id));
  const mergeBanner = pendingMerge ? `
    <div class="banner">
      <span>This boat is marked to be merged into <a href="#/boat/${pendingMerge.keepId}" data-route="#/boat/${pendingMerge.keepId}">${esc((boatsById[pendingMerge.keepId]||{}).boat_name||'another boat')}</a> and removed once applied.</span>
      <button class="btn secondary" type="button" data-discard-merge="${b.id}">Discard</button>
    </div>` : '';

  const sailmakerOptions = DATA.sailmakers.map(s => s.name)
    .concat(BUCKET_ORDER).filter((v,i,a) => a.indexOf(v)===i).sort()
    .map(name => `<option value="${esc(name)}" ${((pending&&pending.sailmaker)||b.current_sailmaker)===name?'selected':''}>${esc(name)}</option>`).join('');
  const team = teamOptions();
  const currentPartial = partialSailmakerOf(b);
  // Same list as the main dropdown; 'Partial' and 'Unknown' are states, not
  // makers, so they are no use as a secondary inventory.
  const partialOptions = DATA.sailmakers.map(x => x.name).concat(BUCKET_ORDER)

// ---------- page: pending changes ----------
// Has this pending edit already made it into the database? The export is a
// one-way copy - applying the CSV never told the browser - so edits sat in the
// pending list forever after they were live, and the only button offered was
// "Discard", which reads as undo rather than done. Comparing each field against
// the rebuilt data answers it without anyone having to remember.
// A boat can carry a second, partial inventory - some sails from another
// maker alongside its main wardrobe. Those split boats are the shortest
// conquest there is, so the field is first-class rather than a note.
function partialSailmakerOf(b) {
  const h = (b.sailmaker_history || []).filter(x => x.confidence === 'partial');
  if (!h.length) return '';
  return h[h.length - 1].sailmaker_name || '';
}
function livePartial(b) {
  const p = PENDING[b.id];
  if (p && p.partialSailmaker != null && p.partialSailmaker !== '') return p.partialSailmaker;
  if (p && p.partialSailmaker === '__none__') return '';
  return partialSailmakerOf(b);
}

function pendingApplied(b, p) {
  const same = (a, c) => String(a ?? '').trim().toLowerCase() === String(c ?? '').trim().toLowerCase();
  const checks = [];
  if (p.sailmaker)   checks.push(same(b.current_sailmaker, p.sailmaker));
  if (p.partialSailmaker)
    checks.push(p.partialSailmaker === '__none__'
      ? !partialSailmakerOf(b)
      : same(partialSailmakerOf(b), p.partialSailmaker));
  if (p.owner)       checks.push(same(b.owner_name, p.owner));
  if (p.tcc)         checks.push(same(b.tcc, p.tcc));
  if (p.leadRep)     checks.push(same(b.lead_rep, p.leadRep));
  if (p.contactedBy) checks.push(same(b.contacted_by, p.contactedBy));
  return checks.length > 0 && checks.every(Boolean);
}

// Copy-to-clipboard + Artifact-downloads-capability (with <a download> fallback)
// wiring shared by the field-edits and boat-merges CSV exports.
function wireCsvExportButtons(copyId, dlId, boxId, filename, toCsv) {
  const copyBtn = document.getElementById(copyId);
  if (copyBtn) copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(toCsv());
      const original = copyBtn.textContent;
      copyBtn.textContent = 'Copied ✓';
      setTimeout(() => { copyBtn.textContent = original; }, 1800);
    } catch (e) {
      const box = document.getElementById(boxId);
      if (box) { box.focus(); box.select(); }
    }
  });
  const dlBtn = document.getElementById(dlId);
  if (dlBtn) dlBtn.addEventListener('click', async () => {
    const text = toCsv();
    // Prefer the Artifact "downloads" capability (a real save-file prompt);
    // fall back to a plain <a download> for when this file is opened directly
    // in a browser (not through the sandboxed Artifact viewer, which has
    // neither window.claude nor the ability to trigger its own downloads).
    let downloads = null;
    try { downloads = window.claude ? await window.claude.use('downloads') : null; } catch (e) {}
    if (downloads) {
      try {
        await downloads.save({ filename, data: text });
        const original = dlBtn.textContent;
        dlBtn.textContent = 'Saved ✓';
        setTimeout(() => { dlBtn.textContent = original; }, 1800);
      } catch (err) {
        console.error('downloads.save failed', err);
        const box = document.getElementById(boxId);
        if (box) { box.focus(); box.select(); }
      }
      return;
    }
    const a = document.createElement('a');
    a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(text);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
  });
}

    const boatOptions = g.boats.map(b => `
