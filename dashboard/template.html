// Season x Class aggregate counts for one regatta (event_class_counts, the
// only source that covers years with no boat-level breakdown). Shared by
// the regatta page render and the click-to-chart modal so both always
// agree with each other.
function getClassYearData(regattaId) {
  const evIds = new Set(DATA.events.filter(e => e.regatta_id === regattaId).map(e => e.id));
  const aggByClassYear = {}; // class -> { year: count }
  DATA.class_counts.forEach(c => {
    if (!evIds.has(c.event_id) || c.class_label.toLowerCase() === 'total') return;
    const year = eventsById[c.event_id].season_year;
    (aggByClassYear[c.class_label] ||= {})[year] = c.entry_count;
  });
  const allYears = Array.from(new Set(Object.values(aggByClassYear).flatMap(o => Object.keys(o).map(Number)))).sort((a,b)=>a-b);
  const classesWithYearData = Object.keys(aggByClassYear).sort();
  return { aggByClassYear, allYears, classesWithYearData };
}

function attachRegattaHandlers() {
  document.querySelectorAll('[data-chart-season]').forEach(el => el.addEventListener('click', (e) => {
    e.stopPropagation();
    openClassChart(parseInt(el.dataset.regattaId), 'season', el.dataset.chartSeason);
  }));
  document.querySelectorAll('[data-chart-class]').forEach(el => el.addEventListener('click', (e) => {
    e.stopPropagation();
    openClassChart(parseInt(el.dataset.regattaId), 'class', el.dataset.chartClass);
  }));
}

function openClassChart(regattaId, mode, key) {
  const { aggByClassYear, allYears, classesWithYearData } = getClassYearData(regattaId);
  const reg = regattasById[regattaId];
  const title = document.getElementById('chart-modal-title');
  const body = document.getElementById('chart-modal-body');
  if (mode === 'season') {
    const year = parseInt(key);
    title.textContent = `${reg.name} — ${year} by class`;
    const items = classesWithYearData.map(c => ({ cls: c, entries: aggByClassYear[c][year] || 0 })).filter(x => x.entries > 0);
    body.innerHTML = items.length ? svgBarChart(items, { valueKey: 'entries', labelKey: 'cls', colorFn: () => 'var(--series-north)' }) : '<p class="muted">No entries recorded for this season.</p>';
  } else {
    title.textContent = `${reg.name} — Class ${key} over time`;
    const pts = allYears.map(y => ({ x: y, y: aggByClassYear[key][y] || 0 }));
    body.innerHTML = sparkline(pts, { color: 'var(--series-north)' });
  }
  document.getElementById('chart-modal').showModal();
}

// ---------- page: market share ----------
// ---------- confidence ----------
// Every derived figure carries the share of its population we actually
// measured. A market-share number over 5 known boats is not the same claim as
// one over 500, and the dashboard should never let those look alike.
function confidenceBadge(known, total, {label = 'measured'} = {}) {
  if (!total) return '';
  const pct = Math.round(100 * known / total);
  const band = pct >= 60 ? 'high' : pct >= 25 ? 'medium' : 'low';
  const bg = band === 'high' ? 'var(--series-quantum)'
           : band === 'medium' ? 'var(--series-doyle)' : 'var(--series-one)';
  // high uses the green fill and medium the yellow - white on either is
  // ~2.4:1 and ~1.9:1, so only the red 'low' band can carry white text.
  const fg = band === 'low' ? '#fff' : '#292524';
  return `<span class="pill" title="${known} of ${total} ${label} — ${band} confidence"
    style="background:${bg};color:${fg};font-variant-numeric:tabular-nums;">${pct}%</span>`;
}

// ---------- page: market analysis ----------
function boatIsNorth(b) { return bucketOf(liveSailmaker(b)) === 'North Sails'; }

function typeMarketRows(active) {
  const byType = {};
  active.forEach(b => {
    const t = (b.boat_type || '').trim() || '(type unrecorded)';
    const g = (byType[t] ||= {type: t, boats: 0, known: 0, north: 0, comp: 0, list: []});
    g.boats++;
    g.list.push(b);
    if (liveSailmaker(b)) {
      const bk = bucketOf(liveSailmaker(b));
      if (bk !== 'Unknown') {
        g.known++;
        if (bk === 'North Sails') g.north++;
        else if (bk !== 'Partial') g.comp++;
      }
    }
  });
  return Object.values(byType)
    .filter(g => g.boats >= 3)
    .map(g => ({...g, share: g.known ? Math.round(100 * g.north / g.known) : null}))
    .sort((a, b) => b.boats - a.boats);
}

function renderMarketAnalysis() {
  const active = DATA.boats.filter(b => b.active);
  const known = active.filter(b => liveSailmaker(b) && bucketOf(liveSailmaker(b)) !== 'Unknown');
  const north = known.filter(boatIsNorth);
  const rows = typeMarketRows(active);

  // Strength / weakness only where enough of the fleet is measured to mean
  // anything. Below a third measured the share is noise, and is shown as such.
  const solid = rows.filter(r => r.known >= 4 && r.known / r.boats >= 0.33);
  const strengths = solid.filter(r => r.share >= 50).slice(0, 8);
  const weaknesses = solid.filter(r => r.share < 50).sort((a, b) => a.share - b.share).slice(0, 8);

  const typeRows = rows.map(r => `<tr class="clickable" data-route="#/boats?type=${encodeURIComponent(r.type)}">
      <td><strong>${esc(r.type)}</strong></td>
      <td class="num">${r.boats}</td>
      <td class="num">${r.north}</td>
      <td class="num">${r.comp}</td>
      <td class="num">${r.boats - r.known}</td>
      <td class="num">${r.known < 3 ? '<span class="muted" title="too few measured boats to state a share">—</span>'
                          : r.share + '%'}</td>
      <td>${confidenceBadge(r.known, r.boats, {label: 'boats with a known sailmaker'})}</td>
    </tr>`).join('');

  // Contactable = active, not ours, and we know who to talk to.
  const targets = active.filter(b => !boatIsNorth(b))
    .sort((a, b) => b.entries.length - a.entries.length);
  const contactable = targets.filter(b => b.owner_name);
  const topTargets = contactable.slice(0, 25).map(b => `
    <tr class="clickable" data-route="#/boat/${b.id}">
      <td><strong>${esc(b.boat_name || '—')}</strong></td>
      <td>${esc(b.sail_no || '')}</td>
      <td>${esc(b.boat_type || '')}</td>
      <td>${esc(b.owner_name || '')}</td>
      <td><span class="pill" style="${pillStyle(liveSailmaker(b))}">${esc(liveSailmaker(b) || 'Unknown')}</span></td>
      <td class="num">${b.entries.length}</td>
    </tr>`).join('');

  const list = (arr, empty) => arr.length ? `<ul style="margin:8px 0 0;padding-left:18px;">
      ${arr.map(r => `<li style="margin-bottom:4px;">
        <strong>${esc(r.type)}</strong> — ${r.share}% of ${r.known} known
        <span class="muted">(${r.boats} boats)</span> ${confidenceBadge(r.known, r.boats)}</li>`).join('')}
    </ul>` : `<p class="muted" style="margin:8px 0 0;">${empty}</p>`;

  return `
    <h1>Market analysis</h1>
    <p class="subtitle">Where we are strong, where we are not, and who is worth calling.
      Every share figure carries the share of that fleet we have actually measured — a percentage
      over 4 known boats is not the same claim as one over 40.</p>

    <div class="stat-row">
      <div class="stat-tile"><div class="v">${active.length}</div><div class="l">Active IRC boats</div></div>
      <div class="stat-tile"><div class="v">${known.length}</div><div class="l">Sailmaker known</div></div>
      <div class="stat-tile"><div class="v">${north.length}</div><div class="l">On North Sails</div></div>
      <div class="stat-tile"><div class="v">${contactable.length}</div><div class="l">Contactable targets</div></div>
    </div>

    <div class="card-row">
      <div class="card" style="border-left:4px solid var(--series-quantum);">
        <h2 style="margin-top:0;">Strengths</h2>
        <p class="muted" style="font-size:12px;margin:0;">Types where we hold at least half the measured fleet.</p>
        ${list(strengths, 'No type yet has enough measured boats to call a strength.')}
      </div>
      <div class="card" style="border-left:4px solid var(--series-one);">
        <h2 style="margin-top:0;">Weaknesses</h2>
        <p class="muted" style="font-size:12px;margin:0;">Measured fleets where we hold under half — the winnable ground.</p>
        ${list(weaknesses, 'Nothing qualifies yet. A weakness needs at least 4 boats of that type measured, and outside the J/109 and Sun Fast fleets we are not there — a 33% share over 3 boats is one boat, not a trend.')}
      </div>
    </div>

    <div class="card" style="padding:0;overflow:auto;">
      <h2 style="padding:18px 20px 0;">Fleet by boat type</h2>
      <p class="muted" style="font-size:12px;padding:0 20px;margin:4px 0 0;">
        Types with 3+ active boats. Click a row to see those boats. "Measured" is the confidence
        column: it is the proportion of that fleet whose sailmaker we actually know.</p>
      <table>
        <thead><tr><th>Boat type</th><th class="num">Active</th><th class="num">North</th>
          <th class="num">Competitor</th><th class="num">Unknown</th><th class="num">Our share</th><th>Measured</th></tr></thead>

// The whole contactable list, not just the 25 shown - the table is a preview,
// the export is the working list.
function targetsCSV() {
  const active = DATA.boats.filter(b => b.active);
  const rows = active.filter(b => !boatIsNorth(b) && b.owner_name)
    .sort((a, b) => b.entries.length - a.entries.length);
  const esc2 = csvEsc;   // reuse the existing CSV escaper
  const head = ['SailNo', 'Boat', 'Type', 'TCC', 'Owner', 'Sailmaker', 'LeadRep', 'Races', 'LastSeason'];
  const lines = [head.join(',')];
  rows.forEach(b => {
    let last = null;
    b.entries.forEach(e => {
      const y = entrySeasonYear(e);
      if (y && (last === null || y > last)) last = y;
    });
    lines.push([b.sail_no, b.boat_name, b.boat_type, b.tcc, b.owner_name,
                liveSailmaker(b) || 'Unknown', b.lead_rep, b.entries.length, last]
               .map(esc2).join(','));
  });
  return lines.join('\n');
}

function attachMarketAnalysisHandlers() {
  const btn = document.getElementById('copy-targets');
  if (!btn) return;
  btn.addEventListener('click', async () => {
    const csv = targetsCSV();
    try {
      await navigator.clipboard.writeText(csv);
      btn.textContent = 'Copied';
    } catch (e) {
      // clipboard can be blocked; fall back to a selectable box rather than
      // leaving the click doing nothing
      const ta = document.createElement('textarea');
      ta.value = csv;
      ta.style.cssText = 'width:100%;height:220px;margin-top:10px;';
      btn.parentNode.appendChild(ta);
      ta.select();
      btn.textContent = 'Select and copy from the box';
    }
    setTimeout(() => { btn.textContent = 'Copy all targets as CSV'; }, 4000);
  });
}

// ---------- page: sales opportunities ----------
// How many editable rows the Sales page renders. Kept small because each row
// carries four form controls; "show all" is available but is genuinely heavy.
let salesLimit = 50;
// Edits used to commit on every 'change' and immediately re-render. Two things
// went wrong: setting a boat's sailmaker to North Sails dropped it out of a
// list that shows only NON-North boats, so the row vanished underneath you
// mid-edit, taking lead rep and contacted-by with it; and the re-render threw
// away your place in a long table. Edits are now staged per row and committed
// by a Save button, and any boat edited this session is pinned to the list so
// it cannot disappear while you are still working on it.
const salesDraft = {};      // boat id -> staged {owner, sailmaker, leadRep, contactedBy}
const salesKeep = new Set(); // boat ids pinned to the list for this session

let salesWho = 'unknown';   // the gap is the default view: it is the biggest one

function renderSales() {
  const allTargets = DATA.boats.filter(b =>
    bucketOf(liveSailmaker(b)) !== 'North Sails' || salesKeep.has(String(b.id)));
  let targets = allTargets.filter(b => b.active || salesKeep.has(String(b.id)));
  const inactiveCount = allTargets.length - targets.length;
  const activeTargets = targets.length;
  // Two different jobs wearing one list. A boat on a competitor's sails is a
  // conquest; a boat whose sailmaker nobody has ever recorded is not a sales
  // problem at all until someone finds out what it is flying. Mixing them
  // buried the second, which is 94% of the fleet.
  const bucketNow = b => bucketOf(liveSailmaker(b));
  if (salesWho === 'unknown') {
    targets = targets.filter(b => ['Unknown', 'Partial'].includes(bucketNow(b))
      || salesKeep.has(String(b.id)));
  } else if (salesWho === 'competitor') {
    targets = targets.filter(b => !['Unknown', 'Partial'].includes(bucketNow(b))
      || salesKeep.has(String(b.id)));
  }
  const nUnknown = allTargets.filter(b => b.active && ['Unknown', 'Partial'].includes(bucketNow(b))).length;
  const nCompetitor = allTargets.filter(b => b.active && !['Unknown', 'Partial'].includes(bucketNow(b))).length;
  // Attendance, not race count: a boat sailing eight races at one regatta is
  // not eight times the prospect of one that turns up to eight events.
  targets.sort((a, b) => regattaAttendance(b) - regattaAttendance(a)
    || (b.entries.length - a.entries.length));
  const sailmakerNames = DATA.sailmakers.map(s => s.name).concat(BUCKET_ORDER).filter((v,i,a) => a.indexOf(v)===i).sort();
  const team = teamOptions();
  const selectOptions = (options, current) => `<option value="">— no change —</option>` +
    options.map(name => `<option value="${esc(name)}" ${current===name?'selected':''}>${esc(name)}</option>`).join('');

  // Only the visible slice gets form controls. Rendering four dropdowns for
  // every target built 3,324 controls and 40k words into one page, which is
  // what made this screen feel unusable. The rest are one row of plain text
  // until you search or ask for more.
  const shown = targets.slice(0, salesLimit);

  const rows = shown.map(b => {
    const p = PENDING[b.id] || {};
    const edited = PENDING[b.id] ? '<span class="edited-flag">Edited</span>' : '';
    return `
    <tr data-boat-id="${b.id}">
      <td><a href="#/boat/${b.id}" data-route="#/boat/${b.id}">${esc(b.boat_name)}</a>${edited}</td>
      <td><input type="text" class="sales-edit-owner" data-boat-id="${b.id}" value="${esc(p.owner!=null?p.owner:(b.owner_name||''))}"></td>
      <td><select class="sales-edit-sailmaker" data-boat-id="${b.id}">${selectOptions(sailmakerNames, p.sailmaker||b.current_sailmaker)}</select></td>
      <td><select class="sales-edit-partial" data-boat-id="${b.id}">${selectOptions(
            sailmakerNames.filter(n => !['Partial','Unknown','Other'].includes(n)),
            p.partialSailmaker || partialSailmakerOf(b))}</select></td>
      <td><select class="sales-edit-leadrep" data-boat-id="${b.id}">${selectOptions(team, p.leadRep||b.lead_rep)}</select></td>
      <td><select class="sales-edit-contactedby" data-boat-id="${b.id}">${selectOptions(team, p.contactedBy||b.contacted_by)}</select></td>
      <td class="${b.in_cs ? '' : 'tag-flag'}">${b.in_cs===1?'Yes':(b.in_cs===0?'No':'—')}</td>
      <td class="num">${regattaAttendance(b)}</td>
      <td class="num">${b.entries.length}</td>
      <td class="sales-save-cell"><button type="button" class="btn sales-save" data-boat-id="${b.id}" hidden>Save</button></td>
    </tr>`;
  }).join('');
  return `
    <h1>Sales opportunities</h1>
    <p class="subtitle">Boats not on North Sails, most regatta attendance first. Showing
      <strong>${shown.length}</strong> of ${targets.length}${inactiveCount ? `; ${inactiveCount} inactive boats are hidden — see <a href="#/boats" data-route="#/boats">Boats</a> and filter to Inactive.` : '.'}</p>
    <div class="search-row">
      <select id="sales-who">
        <option value="unknown"${salesWho === 'unknown' ? ' selected' : ''}>Sailmaker unknown (${nUnknown})</option>
        <option value="competitor"${salesWho === 'competitor' ? ' selected' : ''}>On a competitor (${nCompetitor})</option>
        <option value="all"${salesWho === 'all' ? ' selected' : ''}>All targets (${activeTargets})</option>
      </select>
      <button class="btn secondary" id="sales-export" type="button">Export this list</button>
      <span class="muted" id="sales-export-note" style="font-size:12px;align-self:center;"></span>
    </div>
    ${salesWho === 'unknown' ? `<p class="callout-warn"><strong>${nUnknown} active boats have no sailmaker on file.</strong>
      They are not competitor boats — nobody has recorded what they fly. That is the single
      biggest limit on every share figure in this tool: we know the sailmaker for
      ${Math.round(100 * DATA.boats.filter(b => bucketOf(liveSailmaker(b)) !== 'Unknown' && bucketOf(liveSailmaker(b)) !== 'Partial').length / DATA.boats.length)}%
      of the fleet. Ranked by regatta attendance, so the boats you see most often come first.</p>` : ''}
    <div class="card" style="padding:0;overflow:auto;">
      <table>
        <thead><tr><th>Boat</th><th>Owner</th><th>Current sailmaker</th><th>Partial</th><th>Lead rep</th><th>Contacted by</th><th>In CS</th><th class="num">Regattas</th><th class="num">Entries</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    ${shown.length < targets.length ? `<div class="card" style="text-align:center;">
      <button class="btn secondary" id="sales-more" type="button">Show 50 more</button>
      <button class="btn secondary" id="sales-all" type="button">Show all ${targets.length}</button>
      <p class="muted" style="font-size:12px;margin:8px 0 0;">Each row carries four editable fields, so showing everything at once is slow.</p>
    </div>` : ''}
    <footer class="note">Owner, sailmaker, lead rep and contacted-by are editable here — edits are saved locally (see <a href="#/changes" data-route="#/changes">Pending changes</a> to export and apply them). In CS is read-only, exactly as imported from your fleet register.</footer>
  `;
}

function attachSalesHandlers() {
  const who = document.getElementById('sales-who');
  if (who) who.addEventListener('change', () => { salesWho = who.value; salesLimit = 50; navigate(); });

  const ex = document.getElementById('sales-export');
  const exNote = document.getElementById('sales-export-note');
  if (ex) ex.addEventListener('click', async () => {
    const bucketNow = b => bucketOf(liveSailmaker(b));
    let list = DATA.boats.filter(b => b.active && bucketNow(b) !== 'North Sails');
    if (salesWho === 'unknown') list = list.filter(b => ['Unknown','Partial'].includes(bucketNow(b)));
    else if (salesWho === 'competitor') list = list.filter(b => !['Unknown','Partial'].includes(bucketNow(b)));
    list.sort((a, b) => regattaAttendance(b) - regattaAttendance(a));
    const esc2 = v => { v = String(v == null ? '' : v);
      return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    const head = ['SailNo','BoatName','BoatType','Owner','CurrentSailmaker','Regattas',
                  'Entries','LastRaced','LeadRep','ContactedBy','NewSailmaker','NewLeadRep','Notes'];
    const lines = [head.join(',')].concat(list.map(b => [
      b.sail_no, b.boat_name, b.boat_type, b.owner_name, liveSailmaker(b) || '',
      regattaAttendance(b), b.entries.length, b.lastActiveYear || '',
      b.lead_rep || '', b.contacted_by || '', '', '', ''
    ].map(esc2).join(',')));
    const csv = lines.join('\n');
    const base = 'marketshare-' + salesWho + '-worklist';
    // The last three columns are blank on purpose: fill them in, and
    // apply_boat_updates.py reads the file straight back into the database.
    let saved = false;
    try {
      const downloads = window.claude && claude.use ? await claude.use('downloads') : null;
      if (downloads) {
        try { await downloads.save({ filename: base + '.csv', data: csv }); saved = true;
              if (exNote) exNote.textContent = list.length + ' boats saved.'; }
        catch (err) {
          const code = err && err.code;
          if (code === 'declined') { if (exNote) exNote.textContent = 'Cancelled.'; return; }
          if (code === 'extension_not_enabled') {
            await downloads.save({ filename: base + '.csv.txt', data: csv }); saved = true;
            if (exNote) exNote.textContent = 'Saved as .csv.txt — rename to .csv.';
          }
        }
      }
    } catch (e) { /* fall through */ }
    if (!saved) {
      try {
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = base + '.csv';
        document.body.appendChild(a); a.click();
        setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
        if (exNote) exNote.textContent = 'Download sent for ' + list.length + ' boats.';
      } catch (e) {
        if (exNote) exNote.textContent = 'Downloads are blocked here.';
      }
    }
  });

  const more=document.getElementById('sales-more');
  if (more) more.addEventListener('click', () => { salesLimit += 50; navigate(); });
  const all=document.getElementById('sales-all');
  if (all) all.addEventListener('click', () => { salesLimit = Infinity; navigate(); });
  // Staging only - nothing is committed and nothing re-renders until Save.
  const stage = (el, field, value) => {
    const id = el.dataset.boatId;
    (salesDraft[id] ||= {})[field] = value;
    const row = el.closest('tr');
    row.classList.add('sales-dirty');
    const btn = row.querySelector('.sales-save');
    if (btn) { btn.hidden = false; btn.textContent = 'Save'; btn.disabled = false; }
  };
  document.querySelectorAll('.sales-edit-owner').forEach(el =>
    el.addEventListener('input', () => stage(el, 'owner', el.value.trim())));
  document.querySelectorAll('.sales-edit-sailmaker').forEach(el =>
    el.addEventListener('change', () => stage(el, 'sailmaker', el.value)));
  document.querySelectorAll('.sales-edit-partial').forEach(el =>
    el.addEventListener('change', () => stage(el, 'partialSailmaker', el.value)));
  document.querySelectorAll('.sales-edit-leadrep').forEach(el =>
    el.addEventListener('change', () => stage(el, 'leadRep', el.value)));
  document.querySelectorAll('.sales-edit-contactedby').forEach(el =>
    el.addEventListener('change', () => stage(el, 'contactedBy', el.value)));

  document.querySelectorAll('.sales-save').forEach(btn => btn.addEventListener('click', () => {
    const id = btn.dataset.boatId;
    const draft = salesDraft[id];
    if (!draft) return;
    // Drop "no change" selections so a blank option cannot wipe a real value.
    const patch = {};
    Object.keys(draft).forEach(k => { if (draft[k] !== '' && draft[k] != null) patch[k] = draft[k]; });
    if (Object.keys(patch).length) setPendingEdit(id, patch);
    salesKeep.add(String(id));       // pin it so it stays visible
    delete salesDraft[id];
    const row = btn.closest('tr');
    row.classList.remove('sales-dirty');
    row.classList.add('sales-saved');
    btn.textContent = 'Saved';
    btn.disabled = true;
    if (!row.querySelector('.edited-flag')) {
      const flag = document.createElement('span');
      flag.className = 'edited-flag';
      flag.textContent = 'Edited';
      row.querySelector('td').appendChild(flag);
    }
    updatePendingBadge();            // keep the nav count honest without a re-render
  }));
}

// one-time modal wiring - #chart-modal lives outside #main, so it's never
// re-rendered/re-bound by navigate()
document.getElementById('chart-modal-close').addEventListener('click', () => document.getElementById('chart-modal').close());
document.getElementById('chart-modal').addEventListener('click', (e) => {
  if (e.target.id === 'chart-modal') e.target.close(); // backdrop click
});

navigate();
})();
</script>
</body>
</html>
